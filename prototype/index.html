<title>Gulf Pulse</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;0,900;1,800;1,900&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: dark, immersive single feed. Glass header + swipeable category tabs; cards are
   full-bleed photo cards or "paper" cards with a floating newspaper cut-out. Tap opens a
   full-screen story: the crux first, then full text, then the clippings. Dark-only by design. */
:root{
  --navy:#192C76; --orange:#FF7403; --sky:#93DAFE; --white:#FFFFFF;
  --bg:#050A1F; --bg-2:#0A1233; --glass:rgba(255,255,255,.045); --glass-2:rgba(255,255,255,.08);
  --line:rgba(147,218,254,.14); --fg:#F2F6FF; --fg-2:#B7C3E6; --muted:#7D8BB8;
  --c-gulf:#FF7403; --c-infra:#93DAFE; --c-oil:#FFB070; --c-auto:#7C9BFF; --c-other:#B7C3E6;
  --f-display:"Montserrat","Arial Black",system-ui,sans-serif;
  --f-body:"Inter","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:3px;border-radius:8px}
img{display:block}
.num{font-variant-numeric:tabular-nums}

/* ---------- Ambient background: slow oil-sheen light ---------- */
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--bg)}
.aurora i{position:absolute;border-radius:50%;opacity:.55;will-change:transform}
.aurora i:nth-child(1){width:80vmax;height:80vmax;left:-30vmax;top:-35vmax;background:radial-gradient(closest-side,rgba(25,44,118,.95),transparent);animation:drift1 26s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:60vmax;height:60vmax;right:-28vmax;top:10vh;background:radial-gradient(closest-side,rgba(255,116,3,.28),transparent);animation:drift2 30s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:70vmax;height:70vmax;left:10vw;bottom:-45vmax;background:radial-gradient(closest-side,rgba(147,218,254,.16),transparent);animation:drift3 34s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(18vw,22vh) scale(1.15)}}
@keyframes drift2{to{transform:translate(-26vw,30vh) scale(.85)}}
@keyframes drift3{to{transform:translate(20vw,-25vh) scale(1.1)}}
.aurora::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:3px 3px;mix-blend-mode:overlay}

/* ---------- Intro ---------- */
.intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);
  clip-path:circle(150% at var(--ox,50%) var(--oy,50%));transition:clip-path .9s cubic-bezier(.7,0,.2,1)}
.intro.out{clip-path:circle(0% at var(--ox,50%) var(--oy,50%))}
.intro-inner{display:flex;flex-direction:column;align-items:center;gap:22px;padding:24px}
.halo{position:relative;width:min(56vw,240px);aspect-ratio:1}
.halo svg{position:absolute;inset:-34%;width:168%;height:168%;animation:spin 6s linear infinite}
.halo circle{fill:none;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.3s var(--ease) forwards}
.halo circle:nth-child(2){animation-delay:.12s}.halo circle:nth-child(3){animation-delay:.24s}
@keyframes draw{to{stroke-dashoffset:calc(var(--len) * .35)}}
@keyframes spin{to{transform:rotate(360deg)}}
.halo img{position:relative;width:100%;height:auto;transform:scale(.3) rotate(-25deg);opacity:0;animation:pop .9s var(--spring) .15s forwards;filter:drop-shadow(0 18px 40px rgba(255,116,3,.35))}
@keyframes pop{to{transform:none;opacity:1}}
.intro-title{font:900 clamp(30px,9vw,56px)/1 var(--f-display);letter-spacing:-.03em;display:flex;gap:.28em;overflow:hidden;padding-bottom:4px}
.intro-title span{display:inline-block;transform:translateY(110%);animation:rise .7s var(--ease) forwards}
.intro-title span:nth-child(1){animation-delay:.55s}
.intro-title span:nth-child(2){animation-delay:.68s;color:var(--orange)}
@keyframes rise{to{transform:none}}
.intro-date{font:600 12px/1 var(--f-display);letter-spacing:.32em;text-transform:uppercase;color:var(--sky);opacity:0;animation:fadein .6s ease .95s forwards;text-align:center}
@keyframes fadein{to{opacity:1}}
.intro-skip{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));font:600 12px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:10px 12px}

/* ---------- Header ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:rgba(5,10,31,.92)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:linear-gradient(rgba(5,10,31,.92),rgba(5,10,31,.72));backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;align-items:center;gap:12px;padding-block:12px 8px}
.logo{width:40px;height:auto;flex:none;filter:drop-shadow(0 4px 14px rgba(255,116,3,.25))}
.brand{min-width:0}
.brand b{display:block;font:800 18px/1 var(--f-display);letter-spacing:-.01em}
.brand b em{font-style:normal;color:var(--orange)}
.brand>span{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 0 rgba(255,116,3,.7);animation:ping 1.8s infinite;flex:none}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(255,116,3,0)}100%{box-shadow:0 0 0 0 rgba(255,116,3,0)}}
.edition-btn{margin-left:auto;display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:999px;background:var(--glass-2);border:1px solid var(--line);font:700 13px/1 var(--f-display);white-space:nowrap}
.edition-btn svg{width:14px;height:14px;opacity:.7}

.tabs{position:relative;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:4px 10px}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;z-index:1;flex:none;display:flex;align-items:center;gap:7px;padding:10px 14px;border-radius:999px;font:700 13.5px/1 var(--f-display);color:var(--fg-2);transition:color .3s}
.tab sup{font:600 10px/1 var(--f-body);color:var(--muted);transition:color .3s}
.tab[aria-selected="true"]{color:#fff}
.tab[aria-selected="true"] sup{color:rgba(255,255,255,.85)}
.tab i{width:7px;height:7px;border-radius:50%}
.tab[aria-selected="true"] i{background:#fff!important}
.pill{position:absolute;z-index:0;left:0;top:4px;height:calc(100% - 14px);border-radius:999px;background:linear-gradient(135deg,var(--orange),#ff9640);box-shadow:0 8px 24px -8px rgba(255,116,3,.7);transition:transform .45s var(--spring),width .45s var(--spring)}

/* ---------- Kinetic outlet band ---------- */
.band{overflow:hidden;margin:18px 0 4px;mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.band div{display:flex;gap:28px;width:max-content;animation:marq 60s linear infinite;font:900 italic clamp(26px,7vw,54px)/1.1 var(--f-display);letter-spacing:-.02em;text-transform:uppercase;color:transparent;-webkit-text-stroke:1px rgba(147,218,254,.3)}
.band span:nth-child(4n+1){-webkit-text-stroke-color:rgba(255,116,3,.5)}
@keyframes marq{to{transform:translateX(-50%)}}

/* ---------- Feed ---------- */
.feed{padding-block:4px 60px;touch-action:pan-y}
.feed-anim{animation:feedIn .55s var(--ease)}
.feed-anim.from-left{animation-name:feedInL}
@keyframes feedIn{from{transform:translateX(36px)}}
@keyframes feedInL{from{transform:translateX(-36px)}}
.sect{margin-top:26px}
.sect:first-child{margin-top:12px}
.sect-h{display:flex;align-items:baseline;gap:12px;margin:0 0 14px}
.sect-h h2{margin:0;font:900 clamp(26px,7vw,40px)/1 var(--f-display);letter-spacing:-.03em}
.sect-h .n{font:700 13px/1 var(--f-display);color:var(--muted)}
.sect-h .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}

.card{position:relative;display:block;width:100%;border-radius:22px;overflow:hidden;isolation:isolate;
  background:var(--glass);border:1px solid var(--line);transition:transform .35s var(--ease),border-color .3s}
.card::before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.10),transparent 45%)}
.card:hover::before{opacity:1}
.card:hover{border-color:rgba(255,116,3,.45)}
.card:active{transform:scale(.985)}
.kick{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:12px;color:var(--fg-2)}
.kick .src{display:inline-flex;align-items:center;gap:7px;font:800 11px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:#fff}
.kick .src i{width:8px;height:8px;border-radius:50%;flex:none}
.kick .k{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.1);backdrop-filter:blur(8px);font-size:11px;color:#fff}
.kick svg{width:12px;height:12px}

/* media card: full-bleed photo */
.card.media{min-height:min(118vw,520px);display:flex;align-items:flex-end}
.card.media .ph{position:absolute;inset:0;z-index:-2;overflow:hidden}
.card.media .ph img{width:100%;height:100%;object-fit:cover;transform:scale(1.06);transition:transform 1.2s var(--ease)}
.card.media:hover .ph img{transform:scale(1.12)}
.card.media::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(5,10,31,.12) 0%,rgba(5,10,31,.2) 20%,rgba(5,10,31,.88) 46%,rgba(5,10,31,.98) 70%)}
.card.media .txt{padding:20px;display:flex;flex-direction:column;gap:10px}
.card.media h3{margin:0;font:800 clamp(22px,6.2vw,30px)/1.12 var(--f-display);letter-spacing:-.015em;text-wrap:balance}
.card.media p{margin:0;color:var(--fg-2);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.flag{align-self:flex-start;padding:6px 10px;border-radius:8px;background:var(--orange);color:#fff;font:800 10.5px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;box-shadow:0 10px 30px -8px rgba(255,116,3,.8)}

/* paper card: headline + floating newspaper cut-out */
.card.paper{min-height:236px;padding:18px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02) 60%)}
.card.paper .txt{position:relative;z-index:2;width:62%;display:flex;flex-direction:column;gap:10px}
.card.paper h3{margin:0;font:700 17.5px/1.25 var(--f-display);text-wrap:balance;overflow-wrap:anywhere}
.card.paper p{margin:0;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cut{position:absolute;z-index:1;right:-8px;top:22px;width:40%;max-width:220px;aspect-ratio:3/4;background:#f5f1e8;border-radius:3px;overflow:hidden;
  transform:rotate(6deg);box-shadow:0 2px 0 rgba(0,0,0,.2),0 30px 50px -18px rgba(0,0,0,.9);transition:transform .6s var(--spring)}
.cut img{width:100%;height:100%;object-fit:cover;object-position:top;filter:contrast(1.05)}
.cut::after{content:"";position:absolute;inset:0;background:linear-gradient(200deg,rgba(255,255,255,.18),transparent 40%,rgba(0,0,0,.18))}
.card.paper:hover .cut{transform:rotate(1deg) translateY(-6px) scale(1.04)}
.card.paper .more-ic{position:relative;z-index:2;margin-top:auto;display:inline-flex;align-items:center;gap:8px;font:700 12px/1 var(--f-display);color:var(--orange)}
.card.paper .more-ic svg{width:14px;height:14px;transition:transform .3s var(--ease)}
.card.paper:hover .more-ic svg{transform:translateX(4px)}
.card.paper.noimg .txt{width:100%}
.card.paper.noimg .ghost{position:absolute;right:-6px;bottom:-26px;font:900 120px/1 var(--f-display);color:transparent;-webkit-text-stroke:1px rgba(147,218,254,.16);z-index:0}

/* scroll-driven reveal where supported (content stays visible elsewhere) */
@supports (animation-timeline: view()){
  .card{animation:reveal linear both;animation-timeline:view();animation-range:entry 0% entry 45%}
  @keyframes reveal{from{opacity:.15;transform:translateY(46px) scale(.95)}}
  .cut{animation:float linear both;animation-timeline:view()}
  @keyframes float{from{translate:0 26px;rotate:4deg}to{translate:0 -18px;rotate:-3deg}}
}

/* Clippings wall */
.wall{columns:2 150px;column-gap:14px;margin-top:22px}
.clip{break-inside:avoid;display:block;width:100%;margin:0 0 14px;background:#f5f1e8;border-radius:4px;overflow:hidden;position:relative;
  box-shadow:0 26px 40px -22px rgba(0,0,0,.95);transition:transform .45s var(--spring)}
.clip:nth-child(4n+1){transform:rotate(-1.4deg)}.clip:nth-child(4n+2){transform:rotate(1.1deg)}.clip:nth-child(4n+3){transform:rotate(-.5deg)}
.clip:hover{transform:rotate(0) scale(1.03);z-index:2}
.clip img{width:100%;height:auto}
.clip .cap{position:absolute;inset:auto 0 0;padding:26px 10px 9px;background:linear-gradient(transparent,rgba(5,10,31,.92));font:700 11px/1.25 var(--f-display);color:#fff}

/* ---------- Story view ---------- */
.story{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;animation:storyIn .5s var(--ease)}
@keyframes storyIn{from{opacity:0;transform:translateY(30px) scale(.98)}}
.story.closing{animation:storyOut .3s ease forwards}
@keyframes storyOut{to{opacity:0;transform:translateY(24px) scale(.98)}}
.st-bar{position:absolute;z-index:3;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;background:linear-gradient(rgba(5,10,31,.85),rgba(5,10,31,.5) 60%,transparent);
  padding:calc(12px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 12px max(14px,env(safe-area-inset-left,0px))}
.rbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(5,10,31,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.14);flex:none}
.rbtn svg{width:18px;height:18px}
.rbtn:disabled{opacity:.35;cursor:default}
.st-prog{flex:1;display:flex;gap:3px;min-width:0}
.st-prog i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.22)}
.st-prog i.done{background:rgba(255,255,255,.75)}
.st-prog i.cur{background:linear-gradient(90deg,var(--orange),#ffb070)}
.st-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.st-hero{position:relative;height:min(58vh,540px);overflow:hidden;background:#0a1233}
.st-hero img{width:100%;height:100%;object-fit:cover;object-position:top;animation:kb 18s ease-out forwards}
.st-hero.paper-hero{background:var(--navy)}
.st-hero.paper-hero img{filter:grayscale(1) contrast(1.15) brightness(.85);mix-blend-mode:luminosity;opacity:.75}
@keyframes kb{from{transform:scale(1.18) translateY(2%)}to{transform:scale(1.02)}}
.st-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,10,31,.55) 0,rgba(5,10,31,0) 22%,rgba(5,10,31,0) 45%,var(--bg) 100%)}
.st-hero .gen{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,rgba(255,116,3,.45),transparent 50%),radial-gradient(circle at 70% 70%,rgba(147,218,254,.3),transparent 50%),var(--navy);font:900 min(28vw,220px)/1 var(--f-display);color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.35)}
.st-body{position:relative;margin:-90px auto 0;padding:0 max(18px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));max-width:760px}
.st-body>*{animation:up .7s var(--ease) both}
.st-body>*:nth-child(2){animation-delay:.06s}.st-body>*:nth-child(3){animation-delay:.12s}.st-body>*:nth-child(4){animation-delay:.18s}.st-body>*:nth-child(5){animation-delay:.24s}
@keyframes up{from{opacity:0;transform:translateY(24px)}}
.st-body h1{margin:12px 0 0;font:800 clamp(26px,7.4vw,42px)/1.08 var(--f-display);letter-spacing:-.02em;text-wrap:balance;overflow-wrap:anywhere}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.facts span{padding:6px 10px;border-radius:999px;background:var(--glass-2);border:1px solid var(--line);font-size:12px;color:var(--fg-2)}
.facts b{color:#fff;font-weight:600}
.crux{position:relative;margin-top:26px;padding:22px 20px 22px 22px;border-radius:20px;background:linear-gradient(135deg,rgba(255,116,3,.16),rgba(255,116,3,.03) 60%);border:1px solid rgba(255,116,3,.3);overflow:hidden}
.crux::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--orange);transform-origin:top;animation:barIn .8s var(--ease) .35s both}
@keyframes barIn{from{transform:scaleY(0)}}
.crux .lab{font:800 11px/1 var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--orange)}
.crux p{margin:10px 0 0;font:500 clamp(17px,4.6vw,20px)/1.55 var(--f-body);color:#fff}
.crux mark,.full mark{background:rgba(255,116,3,.35);color:#fff;border-radius:4px;padding:0 3px}
.actions{display:grid;gap:10px;margin-top:18px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:15px 18px;border-radius:16px;font:800 14px/1 var(--f-display);letter-spacing:.01em;text-decoration:none;transition:transform .2s var(--ease)}
.btn:active{transform:scale(.98)}
.btn svg{width:16px;height:16px;transition:transform .3s var(--ease)}
.btn.primary{background:#fff;color:var(--navy)}
.btn.ghost{background:var(--glass-2);border:1px solid var(--line);color:#fff}
.full{overflow:hidden;max-height:0;transition:max-height .8s var(--ease)}
.full.open{max-height:var(--h,4000px)}
.full .in{padding-top:24px;font-size:16px;line-height:1.75;color:var(--fg-2)}
.full .in p{margin:0 0 14px}
.full .in p:first-child::first-letter{float:left;font:900 54px/.85 var(--f-display);color:var(--orange);margin:6px 10px 0 0}
.clips-h{display:flex;align-items:center;gap:12px;margin:34px 0 16px;font:900 22px/1 var(--f-display);letter-spacing:-.02em}
.clips-h .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.papers{display:grid;gap:18px;justify-items:center}
.paper-big{width:min(100%,520px);background:#f5f1e8;border-radius:4px;overflow:hidden;box-shadow:0 40px 60px -26px rgba(0,0,0,.95);transform:rotate(-1.5deg);transition:transform .5s var(--spring)}
.paper-big:hover{transform:rotate(0) scale(1.01)}
.paper-big img{width:100%;height:auto}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}
.next{display:flex;align-items:center;gap:14px;margin-top:34px;padding:14px;border-radius:18px;background:var(--glass);border:1px solid var(--line);width:100%}
.next .th{flex:none;width:64px;height:64px;border-radius:12px;overflow:hidden;background:var(--navy)}
.next .th img{width:100%;height:100%;object-fit:cover;object-position:top}
.next small{display:block;font:800 10.5px/1 var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--orange)}
.next b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:6px;font:700 14.5px/1.3 var(--f-display)}
.next>svg{flex:none;width:20px;height:20px;margin-left:auto;color:var(--orange)}

/* Lightbox */
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(3,6,20,.97);display:flex;flex-direction:column;animation:fadein .25s ease both;opacity:0}
.lightbox .st-bar{position:static}
.lb-scroll{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:0 12px 30px}
.lb-scroll img{width:min(100%,900px);height:auto;background:#f5f1e8;cursor:zoom-in}
.lightbox.zoom .lb-scroll{justify-content:flex-start}
.lightbox.zoom .lb-scroll img{width:220%;max-width:none;cursor:zoom-out}

/* Edition sheet */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(3,6,20,.6);backdrop-filter:blur(4px);animation:fadein .2s both;opacity:0}
.sheet{position:fixed;z-index:61;left:0;right:0;bottom:0;max-height:80vh;overflow:auto;background:linear-gradient(180deg,#101a45,#0a1233);border-radius:26px 26px 0 0;border-top:1px solid var(--line);
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:sheetUp .45s var(--spring)}
@keyframes sheetUp{from{transform:translateY(100%)}}
.grab{width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin:0 auto 14px}
.sheet h3{margin:0 0 4px;font:800 20px/1.2 var(--f-display)}
.sheet .sub{font-size:13px;color:var(--muted);margin-bottom:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dh{font:700 10px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:4px}
.cal button,.cal .pad{aspect-ratio:1;max-width:100%;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:700 14px/1 var(--f-display)}
.cal button{background:var(--glass)}
.cal button:disabled{color:rgba(255,255,255,.25);cursor:default}
.cal button.has{background:var(--glass-2);border:1px solid var(--line)}
.cal button.has small{font:600 9.5px/1 var(--f-body);color:var(--sky)}
.cal button.sel{background:var(--orange);border-color:var(--orange);color:#fff}
.cal button.sel small{color:#fff}

@media (min-width:760px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid .card.media:first-child{grid-column:1/-1;min-height:460px}
  .grid .card.media:first-child h3{font-size:38px;max-width:20ch}
  .card.media{min-height:400px}
  .wall{columns:4 200px}
  .logo{width:46px}
  .brand b{font-size:20px}
}
@media (min-width:1100px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid .card.media:first-child{grid-column:span 2;grid-row:span 2;min-height:100%}
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:420px;translate:-50% -50%;border-radius:24px;border:1px solid var(--line);animation:fadein .3s both;opacity:0}
  .grab{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .lightbox,.scrim,.sheet{opacity:1}
  .intro{display:none}
}
</style>

<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="intro" id="intro" aria-hidden="true">
  <div class="intro-inner">
    <div class="halo">
      <svg viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="96" stroke="#FF7403" stroke-width="1.5" style="--len:603"/>
        <circle cx="100" cy="100" r="88" stroke="#93DAFE" stroke-width="1" style="--len:553"/>
        <circle cx="100" cy="100" r="80" stroke="#3550B8" stroke-width="2" style="--len:503"/>
      </svg>
      <img src="logo-lg.png" alt="">
    </div>
    <div class="intro-title"><span>Gulf</span><span>Pulse</span></div>
    <div class="intro-date" id="intro-date"></div>
  </div>

</div>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <img class="logo" id="hdr-logo" src="logo.png" alt="Gulf">
      <div class="brand"><b>Gulf <em>Pulse</em></b><span><i class="dot"></i><span id="updated">Loading edition</span></span></div>
      <button class="edition-btn" id="edition-btn" aria-haspopup="dialog"><span id="edition-label">Edition</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Categories"></nav>
  </div>
</header>

<main class="wrap">
  <div class="band" aria-hidden="true"><div id="band"></div></div>
  <div class="feed" id="feed"></div>
</main>
<div id="layer"></div>

<script>
(() => {
const CATS = {
  "Gulf in the News": {short:"Gulf", color:"var(--c-gulf)"},
  "Infrastructure": {short:"Infrastructure", color:"var(--c-infra)"},
  "Oil and Gas": {short:"Oil & Gas", color:"var(--c-oil)"},
  "Auto and E Mobility": {short:"Auto & EV", color:"var(--c-auto)"}
};
const cat = s => CATS[s] || {short:s, color:"var(--c-other)"};
const KIND = {print:"Print", online:"Online", social:"Social"};
const I = {
  print:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h13a2 2 0 0 1 2 2v12H6a2 2 0 0 1-2-2z"/><path d="M8 9h7M8 13h7M8 17h4"/></svg>',
  online:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.8 2.5 14.2 0 17M12 3.5c-2.5 2.8-2.5 14.2 0 17"/></svg>',
  social:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="18" cy="5.5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="18.5" r="2.5"/><path d="m8.2 10.8 7.6-4.1M8.2 13.2l7.6 4.1"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  out:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  prev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>'
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dObj = d => new Date(d + "T00:00:00");
const fmt = (d, o) => dObj(d).toLocaleDateString("en-IN", o);
const pages = p => p ? (p.includes(",") ? "pp. " + p.replace(/,\s*$/, "") : "p. " + p) : "";
const asset = v => v && ({...v, src:"data/" + v.src, thumb:"data/" + (v.thumb || v.src)});
const visual = s => asset((s.clips && s.clips[0]) || s.image);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const hl = t => esc(t).replace(/(gulf oil|gulf[’']s|dhoni)/gi, "<mark>$1</mark>");
const smooth = reduce ? "auto" : "smooth";

const st = {index:[], ed:null, date:null, tab:"all", list:[], pos:-1};

/* ---------- Tabs ---------- */
function tabsList(){
  const S = st.ed.stories;
  return [{id:"all", label:"Top stories", n:S.length},
    ...st.ed.sections.map(n => ({id:n, label:cat(n).short, n:S.filter(s => s.section === n).length, color:cat(n).color})),
    {id:"clips", label:"Clippings", n:S.filter(s => s.clips?.length).length}];
}
function renderTabs(){
  $("#tabs").innerHTML = `<span class="pill" id="pill"></span>` + tabsList().map(t =>
    `<button class="tab" role="tab" data-tab="${esc(t.id)}" aria-selected="${t.id === st.tab}">${t.color ? `<i style="background:${t.color}"></i>` : ""}${esc(t.label)}<sup class="num">${t.n}</sup></button>`).join("");
  movePill(false);
}
function movePill(animate = true){
  const b = $(`.tab[aria-selected="true"]`), p = $("#pill"); if (!b || !p) return;
  if (!animate) p.style.transition = "none";
  p.style.width = b.offsetWidth + "px"; p.style.transform = `translateX(${b.offsetLeft}px)`;
  if (!animate) requestAnimationFrame(() => p.style.transition = "");
  const tabs = $("#tabs");
  tabs.scrollTo({left: b.offsetLeft - (tabs.clientWidth - b.offsetWidth) / 2, behavior: animate ? smooth : "auto"});
}
function setTab(id, dir = 1){
  if (id === st.tab) return;
  st.tab = id;
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === id));
  movePill();
  renderFeed(dir);
  const top = $("main").offsetTop - $(".top").offsetHeight;
  if (window.scrollY > top) window.scrollTo({top, behavior:smooth});
}

/* ---------- Feed ---------- */
function card(s, idx){
  const v = visual(s), c = cat(s.section);
  if (v && !s.clips?.length){ // photo story (online / social)
    return `<button class="card media" data-i="${idx}">
      <div class="ph"><img src="${esc(v.src)}" alt="" loading="lazy"></div>
      <div class="txt">
        ${s.section === "Gulf in the News" ? `<span class="flag">Gulf in the news</span>` : ""}
        <div class="kick"><span class="src"><i style="background:${c.color}"></i>${esc(s.outlet)}</span><span class="k">${I[s.kind]}${KIND[s.kind]}${s.platform ? " · " + esc(s.platform) : ""}</span></div>
        <h3>${esc(s.title)}</h3><p>${esc(s.summary)}</p>
      </div></button>`;
  }
  const kick = `<div class="kick"><span class="src"><i style="background:${c.color}"></i>${esc(s.outlet)}</span>${s.edition ? `<span>${esc(s.edition.split(",")[0])}</span>` : ""}${s.page ? `<span>${pages(s.page)}</span>` : ""}</div>`;
  return `<button class="card paper ${v ? "" : "noimg"}" data-i="${idx}">
      <div class="txt">${kick}<h3>${esc(s.title)}</h3><p>${esc(s.summary)}</p></div>
      ${v ? `<div class="cut"><img src="${esc(v.thumb)}" alt="" loading="lazy"></div>` : `<span class="ghost">${esc(s.outlet.slice(0,2))}</span>`}
      <span class="more-ic">Read the crux ${I.arrow}</span>
    </button>`;
}
function renderFeed(dir = 1){
  const S = st.ed.stories, f = $("#feed");
  if (st.tab === "clips"){
    st.list = S.filter(s => s.clips?.length);
    f.innerHTML = `<div class="wall">${st.list.map((s, i) => { const v = visual(s); return `
      <button class="clip" data-i="${i}" data-jump="clips"><img src="${esc(v.thumb)}" alt="Clipping: ${esc(s.title)}" loading="lazy" width="${v.w}" height="${v.h}"><span class="cap">${esc(s.outlet)}</span></button>`; }).join("")}</div>`;
  } else {
    const secs = st.tab === "all" ? st.ed.sections : [st.tab];
    st.list = secs.flatMap(n => S.filter(s => s.section === n));
    let i = 0;
    f.innerHTML = secs.map(n => {
      const l = S.filter(s => s.section === n);
      return `<section class="sect">
        ${st.tab === "all" ? `<div class="sect-h"><h2>${esc(cat(n).short)}</h2><span class="n num">${String(l.length).padStart(2,"0")}</span><span class="ln"></span></div>` : ""}
        <div class="grid">${l.map(s => card(s, i++)).join("")}</div></section>`;
    }).join("");
  }
  f.classList.remove("feed-anim","from-left"); void f.offsetWidth;
  f.classList.add("feed-anim"); if (dir < 0) f.classList.add("from-left");
  stagger();
}
function stagger(){
  if (reduce || !Element.prototype.animate) return;
  const vh = innerHeight;
  [...document.querySelectorAll("#feed .card, #feed .clip")].filter(el => el.getBoundingClientRect().top < vh).forEach((el, k) =>
    el.animate([{transform:"translateY(40px) scale(.96)", opacity:.2}, {transform:"none", opacity:1}], {duration:700, delay:k * 80, easing:"cubic-bezier(.2,.8,.2,1)", fill:"backwards"}));
}
function renderBand(){
  const outlets = [...new Set(st.ed.stories.map(s => s.outlet))];
  $("#band").innerHTML = [...outlets, ...outlets].map(o => `<span>${esc(o)}</span><span>·</span>`).join("");
}

/* ---------- Story ---------- */
function openStory(i, focus){
  st.pos = i;
  const s = st.list[i]; if (!s) return;
  const v = visual(s), c = cat(s.section), nxt = st.list[i + 1];
  const paras = (s.fullText || "").split(/\n+/).map(p => p.trim()).filter(Boolean);
  const clips = (s.clips || []).map(asset);
  const facts = [["", s.outlet], ["", s.outletType], ["Edition", s.edition], ["", pages(s.page)], ["By", s.author], ["", fmt(s.date,{day:"numeric",month:"short",year:"numeric"})]].filter(f => f[1]);
  const prog = st.list.map((_, k) => `<i class="${k < i ? "done" : k === i ? "cur" : ""}"></i>`).join("");
  $("#layer").innerHTML = `
  <div class="story" role="dialog" aria-modal="true" aria-labelledby="st-title">
    <div class="st-bar">
      <button class="rbtn" data-act="close" aria-label="Close story">${I.close}</button>
      <div class="st-prog" role="img" aria-label="Story ${i + 1} of ${st.list.length}">${prog}</div>
      <button class="rbtn" data-act="prev" aria-label="Previous story" ${i ? "" : "disabled"}>${I.prev}</button>
      <button class="rbtn" data-act="next" aria-label="Next story" ${nxt ? "" : "disabled"}>${I.next}</button>
    </div>
    <div class="st-scroll" id="st-scroll">
      <div class="st-hero ${clips.length ? "paper-hero" : ""}">${v ? `<img src="${esc(v.src)}" alt="">` : `<div class="gen">${esc(s.outlet.slice(0,3).toUpperCase())}</div>`}</div>
      <div class="st-body">
        <div class="kick"><span class="src"><i style="background:${c.color}"></i>${esc(c.short)}</span><span class="k">${I[s.kind]}${KIND[s.kind]}${s.platform ? " · " + esc(s.platform) : ""}</span></div>
        <h1 id="st-title">${esc(s.title)}</h1>
        <div class="facts">${facts.map(([k, val]) => `<span>${k ? k + " " : ""}<b>${esc(val)}</b></span>`).join("")}</div>
        <div class="crux"><span class="lab">The crux</span><p>${hl(s.summary)}</p></div>
        <div class="actions">
          ${paras.length ? `<button class="btn primary" data-act="more" aria-expanded="false" aria-controls="full">${I.down}<span>Read the full story</span></button>` : ""}
          ${clips.length ? `<button class="btn ghost" data-act="toclips">See the newspaper clipping</button>` : ""}
          <a class="btn ghost" href="${esc(s.url)}" target="_blank" rel="noopener">${s.kind === "print" ? "Open in media tracker" : "Open on " + esc(s.platform || s.outlet)} ${I.out}</a>
        </div>
        <div class="full" id="full"><div class="in">${paras.map(p => `<p>${hl(p)}</p>`).join("")}</div></div>
        ${clips.length ? `<div id="clips"><div class="clips-h">From the newspaper<span class="ln"></span></div>
          <div class="papers">${clips.map((cl, k) => `<button class="paper-big" data-act="zoom" data-k="${k}" aria-label="Open clipping full screen"><img src="${esc(cl.src)}" alt="Newspaper clipping: ${esc(s.title)}" loading="lazy" width="${cl.w}" height="${cl.h}"></button>`).join("")}</div>
          <p class="hint">Tap the clipping to read it full screen.${s.page && s.page.includes(",") ? " This story runs over several pages; the media-tracker link has every page." : ""}</p></div>` : ""}
        ${nxt ? `<button class="next" data-act="next"><span class="th">${visual(nxt) ? `<img src="${esc(visual(nxt).thumb)}" alt="">` : ""}</span><span style="min-width:0"><small>Up next</small><b>${esc(nxt.title)}</b></span>${I.arrow}</button>` : ""}
      </div>
    </div>
  </div>`;
  document.body.style.overflow = "hidden";
  $(".story [data-act=close]").focus({preventScroll:true});
  if (focus === "clips" && clips.length) setTimeout(() => $("#clips")?.scrollIntoView({behavior:smooth}), 450);
}
function closeStory(){
  const el = $(".story"); if (!el) return;
  const back = document.querySelector(`#feed [data-i="${st.pos}"]`);
  const done = () => { $("#layer").innerHTML = ""; document.body.style.overflow = ""; back?.focus({preventScroll:true}); };
  if (reduce) return done();
  el.classList.add("closing"); setTimeout(done, 280);
}
function go(d){ const n = st.pos + d; if (n >= 0 && n < st.list.length) openStory(n); }
function zoom(k){
  const s = st.list[st.pos], cl = asset(s.clips[k]);
  const lb = document.createElement("div");
  lb.className = "lightbox"; lb.setAttribute("role","dialog"); lb.setAttribute("aria-label","Clipping");
  lb.innerHTML = `<div class="st-bar"><button class="rbtn" data-act="lbclose" aria-label="Close clipping">${I.close}</button><span style="font:700 13px/1.2 var(--f-display);min-width:0">${esc(s.outlet)}${s.page ? " · " + pages(s.page) : ""} · tap to zoom</span></div>
    <div class="lb-scroll"><img src="${esc(cl.src)}" alt="Newspaper clipping: ${esc(s.title)}" data-act="lbzoom"></div>`;
  document.body.appendChild(lb); lb.querySelector("button").focus();
}

/* ---------- Editions ---------- */
function openEditions(){
  const have = new Map(st.index.map(e => [e.date, e]));
  const ref = dObj(st.date), y = ref.getFullYear(), m = ref.getMonth();
  const lead = (new Date(y, m, 1).getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate();
  let cells = "<span class='pad'></span>".repeat(lead);
  for (let d = 1; d <= days; d++){
    const key = new Date(y, m, d).toLocaleDateString("en-CA"), e = have.get(key);
    cells += `<button ${e ? `class="has ${key === st.date ? "sel" : ""}" data-date="${key}"` : "disabled"} aria-label="${fmt(key,{day:"numeric",month:"long"})}${e ? ", " + e.stories + " stories" : ", no edition"}">${d}${e ? `<small>${e.stories}</small>` : ""}</button>`;
  }
  $("#layer").innerHTML = `<div class="scrim" data-act="sheetclose"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ed-h"><div class="grab"></div>
      <h3 id="ed-h">Editions</h3><div class="sub">${ref.toLocaleDateString("en-IN",{month:"long",year:"numeric"})} · ${st.index.length} published. Tap a day to open it.</div>
      <div class="cal">${["M","T","W","T","F","S","S"].map(d => `<span class="dh">${d}</span>`).join("")}${cells}</div></div>`;
  $(".sheet .has")?.focus();
}
async function loadEdition(date){
  st.date = date;
  st.ed = await (await fetch(`data/${date}.json`)).json();
  const upd = new Date(st.ed.ingestedAt);
  const latest = date === st.index[0].date;
  $("#updated").textContent = (latest ? "Latest" : "Archive") + (isNaN(upd) ? "" : " · updated " + upd.toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit",timeZone:"Asia/Kolkata"}));
  $("#edition-label").textContent = fmt(date,{weekday:"short",day:"numeric",month:"short"});
  $("#intro-date").textContent = fmt(date,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  st.tab = "all";
  renderTabs(); renderBand(); renderFeed();
}

/* ---------- Events ---------- */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-act],[data-tab],[data-i],[data-date],#edition-btn"); if (!t) return;
  const a = t.dataset.act;
  if (t.id === "edition-btn") return openEditions();
  if (t.dataset.date){ $("#layer").innerHTML = ""; await loadEdition(t.dataset.date); window.scrollTo({top:0}); return; }
  if (t.dataset.tab && t.classList.contains("tab")){
    const ids = tabsList().map(x => x.id); return setTab(t.dataset.tab, ids.indexOf(t.dataset.tab) >= ids.indexOf(st.tab) ? 1 : -1);
  }
  if (t.dataset.i && !a) return openStory(+t.dataset.i, t.dataset.jump);
  if (a === "close") return closeStory();
  if (a === "prev") return go(-1);
  if (a === "next") return go(1);
  if (a === "more"){
    const f = $("#full"), open = !f.classList.contains("open");
    f.style.setProperty("--h", f.scrollHeight + 40 + "px"); f.classList.toggle("open", open);
    t.setAttribute("aria-expanded", open); t.querySelector("span").textContent = open ? "Show less" : "Read the full story";
    t.querySelector("svg").style.transform = open ? "rotate(180deg)" : "";
    if (open) setTimeout(() => t.scrollIntoView({behavior:smooth, block:"start"}), 120);
    return;
  }
  if (a === "toclips") return $("#clips").scrollIntoView({behavior:smooth});
  if (a === "zoom") return zoom(+t.dataset.k);
  if (a === "lbzoom") return t.closest(".lightbox").classList.toggle("zoom");
  if (a === "lbclose") return t.closest(".lightbox").remove();
  if (a === "sheetclose") return $("#layer").innerHTML = "";
});
document.addEventListener("keydown", e => {
  const lb = $(".lightbox");
  if (e.key === "Escape"){ if (lb) return lb.remove(); if ($(".sheet")) return $("#layer").innerHTML = ""; return closeStory(); }
  if ($(".story") && !lb){ if (e.key === "ArrowRight") go(1); if (e.key === "ArrowLeft") go(-1); }
});
// Cursor light on cards (desktop)
document.addEventListener("pointermove", e => {
  const c = e.target.closest?.(".card"); if (!c || e.pointerType !== "mouse") return;
  const r = c.getBoundingClientRect();
  c.style.setProperty("--mx", e.clientX - r.left + "px"); c.style.setProperty("--my", e.clientY - r.top + "px");
});
// Swipe: between tabs on the feed, between stories in the story view
let sx = 0, sy = 0, sTarget = null;
document.addEventListener("touchstart", e => { const p = e.touches[0]; sx = p.clientX; sy = p.clientY; sTarget = e.target; }, {passive:true});
document.addEventListener("touchend", e => {
  const p = e.changedTouches[0], dx = p.clientX - sx, dy = p.clientY - sy;
  if (Math.abs(dx) < 70 || Math.abs(dy) > 50) return;
  if ($(".lightbox") || $(".sheet")) return;
  if ($(".story")) return go(dx < 0 ? 1 : -1);
  if (sTarget?.closest("#feed")){
    const ids = tabsList().map(x => x.id), k = ids.indexOf(st.tab) + (dx < 0 ? 1 : -1);
    if (k >= 0 && k < ids.length) setTab(ids[k], dx < 0 ? 1 : -1);
  }
}, {passive:true});
addEventListener("resize", () => movePill(false));

/* ---------- Intro ---------- */
function runIntro(){
  const intro = $("#intro");
  let shown = false; try { shown = sessionStorage.getItem("gp-intro") === "1"; } catch(e){}
  if (reduce || shown){ intro.remove(); return; }
  try { sessionStorage.setItem("gp-intro", "1"); } catch(e){}
  const finish = () => {
    if (!intro.isConnected || intro.classList.contains("out")) return;
    const r = $("#hdr-logo").getBoundingClientRect();
    intro.style.setProperty("--ox", r.left + r.width / 2 + "px"); intro.style.setProperty("--oy", r.top + r.height / 2 + "px");
    intro.classList.add("out"); stagger();
    setTimeout(() => intro.remove(), 950);
  };
  $("#skip").addEventListener("click", finish);
  setTimeout(finish, 2300);
}

(async function boot(){
  runIntro();
  try {
    st.index = (await (await fetch("data/index.json")).json()).editions;
    await loadEdition(st.index[0].date);
  } catch (err){
    $("#feed").innerHTML = `<p style="padding:40px 0;color:var(--muted);text-align:center">The edition could not be loaded. Refresh the page to try again.</p>`;
    $("#intro")?.remove();
  }
})();
})();
</script>
