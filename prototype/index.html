<title>Gulf Pulse</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first daily bulletin. Brand corner motif + navy "edition cover",
   then Gulf spotlight, at-a-glance, beat feed. Desktop: feed + sticky insight rail. */
:root{
  --navy:#192C76; --orange:#FF7403; --sky:#93DAFE; --white:#FFFFFF; --ink:#1A1A1A;
  --bg:#F4F7FC; --surface:#FFFFFF; --surface-2:#EAF1FB; --fg:#1A1A1A; --fg-2:#46506E; --muted:#6B7493;
  --line:#DCE4F2; --cover:#192C76; --cover-fg:#FFFFFF; --cover-2:#22398F;
  --brand-ink:#192C76; --accent:#FF7403; --accent-ink:#C24F00; --sky-ink:#0C6A9A;
  --motif-navy:#192C76; --chip:#FFFFFF;
  --seg-gulf:#FF7403; --seg-infra:#192C76; --seg-oil:#4A8FD8; --seg-auto:#93DAFE;
  --shadow:0 1px 2px rgba(25,44,118,.06),0 8px 24px -12px rgba(25,44,118,.18);
  --f-display:"Montserrat","Arial Black",system-ui,sans-serif;
  --f-body:"Helvetica Neue","Inter",Helvetica,Arial,system-ui,sans-serif;
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#070C24; --surface:#0F1838; --surface-2:#16224D; --fg:#EEF3FF; --fg-2:#BAC5E8; --muted:#8C99C6;
  --line:#22305F; --cover:#14225F; --cover-fg:#FFFFFF; --cover-2:#1D2F78;
  --brand-ink:#B9D8FF; --accent:#FF8526; --accent-ink:#FF9A4A; --sky-ink:#93DAFE;
  --motif-navy:#3550B8; --chip:#0F1838;
  --seg-gulf:#FF7403; --seg-infra:#5C78E0; --seg-oil:#93DAFE; --seg-auto:#2F4BA8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#070C24; --surface:#0F1838; --surface-2:#16224D; --fg:#EEF3FF; --fg-2:#BAC5E8; --muted:#8C99C6;
  --line:#22305F; --cover:#14225F; --cover-fg:#FFFFFF; --cover-2:#1D2F78;
  --brand-ink:#B9D8FF; --accent:#FF8526; --accent-ink:#FF9A4A; --sky-ink:#93DAFE;
  --motif-navy:#3550B8; --chip:#0F1838;
  --seg-gulf:#FF7403; --seg-infra:#5C78E0; --seg-oil:#93DAFE; --seg-auto:#2F4BA8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font:700 11px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}

/* ---------- Masthead ---------- */
.mast{position:relative;overflow:hidden}
.motif{position:absolute;left:0;top:0;width:84px;height:112px;pointer-events:none}
.mast-row{position:relative;display:flex;align-items:center;gap:14px;padding-block:22px 14px;padding-left:max(60px,env(safe-area-inset-left,0px))}
.brand{display:flex;flex-direction:column;gap:3px;min-width:0}
.wordmark{font:800 22px/1 var(--f-display);letter-spacing:-.01em;color:var(--brand-ink)}
.wordmark b{color:var(--accent);font-weight:800}
.tagline{font-size:12px;color:var(--muted)}
.logo{width:46px;height:auto;margin-left:auto;flex:none}
.wide-only{display:none}

/* Nav: bottom tab bar on phone, inline segmented control on desktop */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;
  background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:76px;padding:6px 10px;border-radius:12px;font:600 11px/1 var(--f-display);color:var(--muted);letter-spacing:.02em}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent-ink)}
.tab[aria-current="page"] svg{color:var(--accent)}

/* ---------- Edition strip (dates) ---------- */
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:4px 14px;scroll-snap-type:x mandatory}
.days::-webkit-scrollbar{display:none}
.day{flex:none;scroll-snap-align:end;width:52px;padding:8px 0 9px;border-radius:12px;border:1px solid var(--line);background:var(--chip);display:flex;flex-direction:column;align-items:center;gap:4px}
.day .dw{font:600 10px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.day .dn{font:700 18px/1 var(--f-display)}
.day .dc{font-size:10px;line-height:1;color:var(--muted)}
.day:disabled{opacity:.42;cursor:default}
.day[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff}
.day[aria-pressed="true"] .dw,.day[aria-pressed="true"] .dc{color:#fff}

/* ---------- Cover ---------- */
.cover{position:relative;overflow:hidden;border-radius:22px;background:var(--cover);color:var(--cover-fg);padding:22px 20px 0;isolation:isolate}
.cover::before{content:"";position:absolute;right:-150px;top:-150px;width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,rgba(255,116,3,.95) 0 34%,transparent 35%),radial-gradient(circle,rgba(147,218,254,.0) 0 47%,rgba(147,218,254,.35) 48% 50%,transparent 51%);z-index:-1;opacity:.9}
.cover::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 22px,rgba(147,218,254,.05) 22px 23px);z-index:-1}
.live{display:inline-flex;align-items:center;gap:8px;font:700 11px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--sky)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 0 rgba(255,116,3,.7);animation:ping 1.8s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,116,3,.7)}70%{box-shadow:0 0 0 10px rgba(255,116,3,0)}100%{box-shadow:0 0 0 0 rgba(255,116,3,0)}}
.cover h1{font-size:clamp(30px,8.4vw,52px);line-height:1.02;font-weight:800;letter-spacing:-.02em;margin:12px 0 8px}
.cover h1 em{font-style:normal;color:var(--orange)}
.cover .sub{color:rgba(255,255,255,.78);font-size:14px;max-width:46ch}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin:18px -20px 0;background:rgba(147,218,254,.18);border-top:1px solid rgba(147,218,254,.18)}
.stat{background:var(--cover);padding:12px 12px 14px;min-width:0}
.stat b{display:block;font:800 26px/1 var(--f-display);letter-spacing:-.02em}
.stat span{display:block;margin-top:5px;font-size:11px;line-height:1.2;color:rgba(255,255,255,.7)}
.stat.hot b{color:var(--orange)}
.ticker{display:flex;align-items:center;margin:0 -20px;background:var(--cover-2);border-top:1px solid rgba(147,218,254,.18);overflow:hidden;height:40px}
.ticker .lab{position:relative;z-index:1;flex:none;align-self:stretch;display:flex;align-items:center;padding:0 12px 0 20px;background:var(--orange);color:#fff;font:800 11px/1 var(--f-display);letter-spacing:.14em;clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%);padding-right:22px}
.ticker .track{display:flex;gap:36px;white-space:nowrap;padding-left:16px;animation:tick 90s linear infinite;font-size:13px;color:rgba(255,255,255,.88)}
.ticker .track button{white-space:nowrap}
.ticker .track button::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--sky);margin-right:10px;vertical-align:middle}
.ticker:hover .track{animation-play-state:paused}
@keyframes tick{to{transform:translateX(-50%)}}

/* ---------- Page grid ---------- */
.grid{display:grid;gap:28px;grid-template-areas:"spot" "glance" "feed";margin-top:26px}
.spot{grid-area:spot;min-width:0}.glance{grid-area:glance;min-width:0}.feed{grid-area:feed;min-width:0}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-head h2{font-size:20px;font-weight:800;letter-spacing:-.01em}
.sec-head .eyebrow{margin-bottom:6px}
.hint{font-size:12px;color:var(--muted)}

/* Spotlight carousel */
.spot-row{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 0;padding-right:16px}
.spot-row::-webkit-scrollbar{display:none}
.spot-card{flex:0 0 min(82%,340px);scroll-snap-align:start;position:relative;border-radius:18px;overflow:hidden;background:var(--navy);color:#fff;text-align:left;aspect-ratio:4/5;max-width:100%;box-shadow:var(--shadow)}
.spot-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.spot-card:hover img{transform:scale(1.04)}
.spot-card .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,18,52,0) 25%,rgba(10,18,52,.8) 55%,rgba(10,18,52,.96) 85%)}
.cv-r{display:none;flex-direction:column;gap:2px;align-self:center;position:relative;min-width:0}
.cv-r .eyebrow{color:var(--sky);margin-bottom:8px}
.cv-r button{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;text-align:left;padding:10px 12px;border-radius:12px;background:rgba(7,12,36,.35);backdrop-filter:blur(6px);margin-top:6px}
.cv-r button:hover{background:rgba(7,12,36,.55)}
.cv-r i{grid-row:span 2;width:4px;border-radius:2px;align-self:stretch}
.cv-r small{font:700 10.5px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.65)}
.cv-r b{font:600 14px/1.3 var(--f-display);color:#fff;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.spot-card .body{position:absolute;left:0;right:0;bottom:0;padding:16px;display:flex;flex-direction:column;gap:8px}
.spot-card h3{font-size:18px;line-height:1.2;font-weight:700}
.badge{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;padding:5px 9px;border-radius:999px;font:700 10.5px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.badge.gulf{background:var(--orange);color:#fff}
.badge.k{background:rgba(255,255,255,.16);color:#fff;backdrop-filter:blur(6px)}
.spot-card .meta{font-size:12px;color:rgba(255,255,255,.78)}

/* At a glance */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.glance{display:grid;gap:12px}
.mix-bar{display:flex;height:14px;border-radius:999px;overflow:hidden;gap:2px;margin:12px 0 12px}
.mix-bar span{display:block;height:100%;transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(.001)}}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.legend button{display:flex;align-items:center;gap:8px;text-align:left;font-size:13px;min-width:0;padding:2px 0}
.legend i{flex:none;width:10px;height:10px;border-radius:3px}
.legend b{margin-left:auto;font:700 13px/1 var(--f-display)}
.media{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.media div{background:var(--surface-2);border-radius:var(--r-sm);padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.media svg{width:18px;height:18px;color:var(--sky-ink)}
.media b{font:800 22px/1 var(--f-display)}
.media span{font-size:11.5px;color:var(--muted)}
.outlets{display:grid;gap:8px;margin-top:12px}
.outlet{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:13px}
.outlet .bar{grid-column:1/-1;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.outlet .bar i{display:block;height:100%;border-radius:99px;background:var(--seg-infra);animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.outlet b{font:700 13px/1.4 var(--f-display)}
.watch{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.wchip{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:999px;border:1px solid var(--line);background:var(--chip);font-size:13px}
.wchip b{font:700 12px/1 var(--f-display);min-width:18px;height:18px;border-radius:9px;display:inline-grid;place-items:center;background:var(--surface-2);padding:0 5px}
.wchip.on b{background:var(--orange);color:#fff}
.wchip.zero{color:var(--muted)}
.wchip[aria-pressed="true"]{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange) inset}
.wgroup{font:600 10.5px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);width:100%;margin-top:4px}

/* Beat filter + feed */
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:10px;margin-bottom:6px;background:var(--bg)}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--chip);font:600 13px/1 var(--f-display)}
.fchip i{width:8px;height:8px;border-radius:50%}
.fchip small{font:600 11px/1 var(--f-body);color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.fchip[aria-pressed="true"] small{color:rgba(255,255,255,.75)}
.active-filter{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--fg-2);margin:4px 0 10px}
.active-filter button{color:var(--accent-ink);font-weight:600}

.beat{margin-top:22px}
.beat-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.beat-head .sw{flex:none;width:6px;align-self:stretch;border-radius:3px}
.beat-head h3{font-size:18px;font-weight:800}
.beat-head p{margin:3px 0 0;font-size:13px;color:var(--muted);max-width:60ch}
.beat-head .ct{margin-left:auto;font:800 28px/1 var(--f-display);color:var(--line)}
.cards{display:grid;gap:12px}
.card{display:grid;grid-template-columns:minmax(0,1fr) 104px;gap:14px;align-items:start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);transition:transform .2s ease,border-color .2s ease;animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 40ms)}
.card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--orange) 50%,var(--line))}
@keyframes rise{from{transform:translateY(10px)}}
.card .kick{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:11.5px;color:var(--muted);margin-bottom:6px}
.card .kick .src{font:700 11px/1.2 var(--f-display);letter-spacing:.04em;text-transform:uppercase;color:var(--sky-ink)}
.card h4{margin:0;font:700 15.5px/1.3 var(--f-display);text-wrap:balance;overflow-wrap:anywhere}
.card p{margin:6px 0 0;font-size:13.5px;color:var(--fg-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .foot{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:7px;background:var(--surface-2);font-size:11.5px;color:var(--fg-2)}
.tag svg{width:13px;height:13px}
.tag.hit{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--accent-ink)}
.thumb{position:relative;width:104px;aspect-ratio:4/5;max-width:100%;border-radius:8px;overflow:hidden;background:#fff;
  box-shadow:0 1px 0 rgba(0,0,0,.04),0 6px 14px -8px rgba(0,0,0,.35);transform:rotate(1.2deg)}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top}
.thumb.paper{clip-path:polygon(0 0,100% 0,100% 94%,92% 97%,84% 94%,75% 98%,66% 95%,57% 98%,48% 94%,39% 97%,30% 94%,21% 98%,12% 95%,0 97%)}
.thumb.noimg{display:grid;place-items:center;background:var(--surface-2);color:var(--muted);transform:none}
.thumb.noimg svg{width:28px;height:28px}
.card.lead{grid-template-columns:1fr;padding:0;overflow:hidden}
.card.lead .lead-img{height:190px;overflow:hidden;background:#fff;position:relative}
.card.lead .lead-img img{width:100%;height:100%;object-fit:cover;object-position:top}
.card.lead .lead-img::after{content:"";position:absolute;inset:auto 0 0;height:50%;background:linear-gradient(transparent,var(--surface))}
.card.lead .txt{padding:0 16px 16px;margin-top:-18px;position:relative}
.card.lead h4{font-size:19px}
.empty{padding:28px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* ---------- Clippings wall ---------- */
.wall{columns:2 160px;column-gap:12px;margin-top:8px}
.clip{break-inside:avoid;display:block;width:100%;margin:0 0 12px;background:#fff;border-radius:6px;overflow:hidden;text-align:left;box-shadow:0 1px 1px rgba(0,0,0,.06),0 10px 22px -14px rgba(0,0,0,.45);position:relative;transition:transform .25s ease}
.clip:nth-child(3n+1){transform:rotate(-.6deg)}.clip:nth-child(3n+2){transform:rotate(.5deg)}
.clip:hover{transform:rotate(0) scale(1.02);z-index:2}
.clip img{display:block;width:100%;height:auto}
.clip .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;background:linear-gradient(transparent,rgba(10,18,52,.88));color:#fff;font:600 11px/1.25 var(--f-display);letter-spacing:.02em}
.clip .cap span{display:block;font:400 10.5px/1.3 var(--f-body);opacity:.8;margin-top:2px}

/* ---------- Archive ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.cal .dh{font:600 10.5px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:4px}
.cal button,.cal .pad{aspect-ratio:1;max-width:100%;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 14px/1 var(--f-display);border:1px solid var(--line);background:var(--chip)}
.cal .pad{border:0;background:none}
.cal button:disabled{color:var(--muted);opacity:.5;cursor:default}
.cal button.has{background:var(--navy);border-color:var(--navy);color:#fff}
.cal button.has small{font:500 10px/1 var(--f-body);color:var(--sky)}
.cal button.sel{outline:3px solid var(--orange);outline-offset:1px}
.ed-list{display:grid;gap:10px;margin-top:16px}
.ed{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.ed .d{flex:none;width:52px;height:56px;border-radius:12px;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 20px/1 var(--f-display)}
.ed .d small{font:600 10px/1 var(--f-display);letter-spacing:.1em;color:var(--sky);margin-top:4px}
.ed b{font:700 15px/1.3 var(--f-display);display:block}
.ed span{font-size:12.5px;color:var(--muted)}

/* ---------- Story sheet ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(7,12,36,.55);backdrop-filter:blur(3px);animation:fade .2s both}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -20px 60px -20px rgba(0,0,0,.5);animation:up .35s cubic-bezier(.2,.8,.2,1) both;padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}
.sh-top{flex:none;display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.sh-top .sec{font:700 11px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink)}
.iconbtn{margin-left:auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2)}
.iconbtn svg{width:18px;height:18px}
.sh-scroll{overflow-y:auto;overscroll-behavior:contain;padding:0 max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.sh-scroll h2{font-size:clamp(21px,5.4vw,27px);line-height:1.18;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:14px 0}
.facts div{background:var(--surface);padding:9px 11px;min-width:0}
.facts dt{font:600 10px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:4px 0 0;font-size:13px;font-weight:500;overflow-wrap:anywhere}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--surface-2);position:sticky;top:0;z-index:2;margin-bottom:14px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font:700 12.5px/1 var(--f-display);color:var(--fg-2)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button:disabled{opacity:.4;cursor:default}
.prose{font-size:15.5px;line-height:1.65;max-width:66ch}
.prose p{margin:0 0 12px}
.summary-lede{font-size:17px;line-height:1.55;color:var(--fg);border-left:3px solid var(--orange);padding-left:14px;margin:0 0 16px}
.why{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--fg-2)}
.why b{display:block;font:700 10.5px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--sky-ink);margin-bottom:6px}
.clipview{background:#fff;border-radius:10px;overflow:auto;max-height:70vh;border:1px solid var(--line)}
.clipview img{display:block;width:100%;height:auto;cursor:zoom-in}
.clipview.zoom img{width:200%;max-width:none;cursor:zoom-out}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;padding:13px 16px;border-radius:12px;background:var(--navy);color:#fff;text-decoration:none;font:700 14px/1 var(--f-display)}
.cta svg{width:16px;height:16px}
.muted{color:var(--muted)}
mark{background:color-mix(in srgb,var(--orange) 28%,transparent);color:inherit;border-radius:3px;padding:0 2px}

.foot-note{margin:36px 0 10px;font-size:12px;color:var(--muted);text-align:center}

/* ---------- Desktop ---------- */
@media (min-width:1000px){
  body{padding-bottom:0}
  .tabs{position:static;background:none;backdrop-filter:none;border:0;padding:0;gap:4px;margin-left:auto;margin-right:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);padding:4px}
  .tab{flex-direction:row;gap:8px;min-width:0;padding:9px 14px;font-size:13px;border-radius:9px}
  .tab svg{width:18px;height:18px}
  .tab[aria-current="page"]{background:var(--navy);color:#fff}
  .tab[aria-current="page"] svg{color:var(--orange)}
  .logo{margin-left:0;width:54px}
  .wide-only{display:inline}
  .wordmark{font-size:26px}
  .cover{padding:34px 36px 0;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);column-gap:30px}
  .cover>.cv-l{grid-column:1}
  .cover .stats{grid-column:1/-1;margin:26px -36px 0;grid-template-columns:repeat(4,1fr)}
  .cover .ticker{grid-column:1/-1;margin:0 -36px}
  .cover::before{right:-120px;top:-160px;width:420px;height:420px;opacity:.55}
  .cv-r{display:flex!important}
  .card.lead .lead-img{height:300px!important;min-height:0!important}
  .stat{padding:16px 22px 18px}.stat b{font-size:34px}
  .ticker .lab{padding-left:36px}
  .grid{grid-template-columns:minmax(0,1fr) 360px;grid-template-areas:"spot spot" "feed glance";column-gap:32px}
  .glance{position:sticky;top:16px;align-self:start}
  .spot-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin:0;padding:0;overflow:visible}
  .spot-card{aspect-ratio:16/11}
  .cards{grid-template-columns:1fr 1fr}
  .card.lead{grid-column:1/-1;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:0}
  .card.lead .lead-img::after{inset:0 0 0 auto;width:40%;height:auto;background:linear-gradient(90deg,transparent,var(--surface))}
  .card.lead .txt{margin:0;padding:22px 22px 20px 4px;align-self:center}
  .card.lead h4{font-size:22px}
  .wall{columns:4 200px}
  .sheet{left:auto;top:0;bottom:0;right:0;width:min(620px,92vw);max-height:none;border-radius:22px 0 0 22px;animation-name:side}
  @keyframes side{from{transform:translateX(40px);opacity:.4}}
  .grab{display:none}
  .sh-top{padding-top:18px}
  .sh-scroll{padding:0 28px 28px}
  .archive-grid{display:grid;grid-template-columns:420px minmax(0,1fr);gap:32px;align-items:start}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .ticker{overflow-x:auto}
}
</style>

<div id="app">
  <header class="mast">
    <svg class="motif" viewBox="0 0 150 200" aria-hidden="true">
      <polygon points="0,0 30,0 12,150 0,150" fill="#93DAFE"/>
      <polygon points="26,0 150,0 30,40" style="fill:var(--motif-navy)"/>
      <polygon points="0,0 40,0 34,36 0,52" fill="#FF7403"/>
    </svg>
    <div class="wrap mast-row">
      <div class="brand">
        <div class="wordmark">Gulf <b>Pulse</b></div>
        <div class="tagline">Daily media brief<span class="wide-only"> · Gulf Oil Lubricants India</span></div>
      </div>
      <nav class="tabs" aria-label="Views">
        <button class="tab" data-view="today" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h13a2 2 0 0 1 2 2v12H6a2 2 0 0 1-2-2z"/><path d="M19 9h1a1 1 0 0 1 1 1v8a1 1 0 0 1-2 0"/><path d="M8 9h7M8 13h7M8 17h4"/></svg>Today</button>
        <button class="tab" data-view="clippings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><path d="M8 7.5 20 17M8 16.5 20 7"/></svg>Clippings</button>
        <button class="tab" data-view="archive">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Archive</button>
      </nav>
      <img class="logo" src="logo.png" alt="Gulf">
    </div>
    <div class="wrap"><div class="days" id="days" role="group" aria-label="Choose an edition"></div></div>
  </header>

  <main class="wrap">
    <section id="view-today" aria-label="Today's edition"></section>
    <section id="view-clippings" hidden aria-label="Newspaper clippings"></section>
    <section id="view-archive" hidden aria-label="Past editions"></section>
    <p class="foot-note" id="footnote">Source: Adfactors PR media tracker, emailed daily.</p>
  </main>
</div>
<div id="sheet-root"></div>

<script>
(() => {
const SECTIONS = {
  "Gulf in the News": {short:"Gulf", color:"var(--seg-gulf)", why:"Coverage that names Gulf Oil, its brands or its ambassadors."},
  "Infrastructure": {short:"Infrastructure", color:"var(--seg-infra)", why:"Road and industrial build-out signals demand for CV and construction-equipment lubricants."},
  "Oil and Gas": {short:"Oil & Gas", color:"var(--seg-oil)", why:"Crude prices and fuel policy feed straight into base-oil costs."},
  "Auto and E Mobility": {short:"Auto & EV", color:"var(--seg-auto)", why:"OEM moves and the shift to EVs reshape the engine-oil market."}
};
const secInfo = s => SECTIONS[s] || {short:s, color:"var(--muted)", why:""};
// Watchlist: what leadership tracks. Competitors with zero hits are shown too — silence is news.
const WATCH = [
  {g:"Gulf", items:[{k:"Gulf Oil", re:/gulf oil|gulf[’']s|\bdhoni\b/i, own:true}]},
  {g:"Competitors", items:[
    {k:"Castrol", re:/castrol/i},{k:"Shell", re:/\bshell\b/i},{k:"Servo / IOCL", re:/\bservo\b|indian oil/i},
    {k:"Mobil", re:/\bmobil\b|exxon/i},{k:"Valvoline", re:/valvoline/i},{k:"Veedol", re:/veedol|tide water/i},{k:"HP Lubricants", re:/hp lubricants/i}]},
  {g:"Themes", brief:true, items:[
    {k:"EV shift", re:/electric|\bev\b|battery|e-?mobility/i},{k:"Crude", re:/crude|oil prices/i},
    {k:"Ethanol / E20", re:/ethanol|\be20\b/i},{k:"CNG", re:/\bcng\b/i},{k:"Commercial vehicles", re:/truck|\bcv\b|commercial vehicle|bus(es)?\b/i}]}
];
const WATCH_BRIEF = new Set(WATCH.filter(g => g.brief).flatMap(g => g.items.map(w => w.k)));
const ICON = {
  print:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h13a2 2 0 0 1 2 2v12H6a2 2 0 0 1-2-2z"/><path d="M8 9h7M8 13h7M8 17h4"/></svg>',
  online:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.8 2.5 14.2 0 17M12 3.5c-2.5 2.8-2.5 14.2 0 17"/></svg>',
  social:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5.5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="18.5" r="2.5"/><path d="m8.2 10.8 7.6-4.1M8.2 13.2l7.6 4.1"/></svg>',
  clip:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><path d="M8 7.5 20 17M8 16.5 20 7"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  out:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>'
};
const KIND = {print:"Print", online:"Online", social:"Social"};

const state = {index:[], date:null, ed:null, view:"today", beat:"all", watch:null, open:null};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dateObj = d => new Date(d + "T00:00:00");
const fmt = (d, o) => dateObj(d).toLocaleDateString("en-IN", o);
const textOf = s => [s.title, s.summary, s.fullText].join(" ");
// Names (Gulf, competitors) count anywhere in the article; themes only in headline + summary, so passing mentions don't inflate them.
const matches = (w, s) => w.re.test(WATCH_BRIEF.has(w.k) ? s.title + " " + s.summary : textOf(s));
const sid = s => "story-" + s.id.slice(0, 2);
const visual = s => { const v = (s.clips && s.clips[0]) || s.image; return v ? {...v, src:"data/" + v.src, thumb:v.thumb && "data/" + v.thumb} : null; };
const pages = p => p ? (p.includes(",") ? "pp. " + p.replace(/,\s*$/, "") : "p. " + p) : "";
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

function watchHits(stories){
  return WATCH.map(g => ({g:g.g, items:g.items.map(w => ({...w, ids:stories.filter(s => matches(w, s)).map(s => s.id)}))}));
}
function filtered(){
  let list = state.ed.stories;
  if (state.beat !== "all") list = list.filter(s => s.section === state.beat);
  if (state.watch){ const w = WATCH.flatMap(g => g.items).find(w => w.k === state.watch); list = list.filter(s => matches(w, s)); }
  return list;
}

/* ---------- Date strip ---------- */
function renderDays(){
  const have = new Map(state.index.map(e => [e.date, e]));
  const latest = state.index[0]?.date;
  const days = [];
  for (let i = 13; i >= 0; i--){ const d = dateObj(latest); d.setDate(d.getDate() - i); days.push(d.toLocaleDateString("en-CA")); }
  $("#days").innerHTML = days.map(d => {
    const e = have.get(d);
    return `<button class="day" ${e ? "" : "disabled"} aria-pressed="${d === state.date}" data-date="${d}" aria-label="${fmt(d,{weekday:"long",day:"numeric",month:"long"})}${e ? ", " + e.stories + " stories" : ", no edition"}">
      <span class="dw">${fmt(d,{weekday:"short"})}</span><span class="dn">${dateObj(d).getDate()}</span><span class="dc">${e ? e.stories : "–"}</span></button>`;
  }).join("");
  const sel = $("#days [aria-pressed=true]"); if (sel) sel.scrollIntoView({inline:"end", block:"nearest"});
}

/* ---------- Today ---------- */
function renderToday(){
  const ed = state.ed, S = ed.stories;
  const gulf = S.filter(s => s.section === "Gulf in the News");
  const outlets = [...S.reduce((m, s) => m.set(s.outlet, (m.get(s.outlet) || 0) + 1), new Map())].sort((a,b) => b[1]-a[1]);
  const clips = S.filter(s => s.clips?.length).length;
  const kinds = ["print","online","social"].map(k => [k, S.filter(s => s.kind === k).length]);
  const secs = ed.sections.map(n => [n, S.filter(s => s.section === n).length]);
  const upd = new Date(ed.ingestedAt);
  const updTxt = isNaN(upd) ? "" : upd.toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit",timeZone:"Asia/Kolkata"}) + " IST";
  const hits = watchHits(S);
  const lead = gulf[0];

  $("#view-today").innerHTML = `
  <div class="cover">
    <div class="cv-l">
      <div class="live"><i></i>${state.date === state.index[0].date ? "Latest edition" : "Past edition"} · updated ${esc(updTxt)}</div>
      <h1>${fmt(ed.date,{weekday:"long"})},<br><em>${fmt(ed.date,{day:"numeric",month:"long"})}</em></h1>
      <div class="sub">${S.length} stories across ${ed.sections.length} beats from ${outlets.length} outlets. ${gulf.length ? `Gulf is named in <b style="color:var(--orange)">${gulf.length}</b> of them.` : "No direct Gulf mentions today."}</div>
    </div>
    <div class="cv-r"><div class="eyebrow">Top of each beat</div>
      ${ed.sections.map(n => { const s = S.find(x => x.section === n); return `<button data-story="${s.id}"><i style="background:${secInfo(n).color}"></i><small>${esc(secInfo(n).short)} · ${esc(s.outlet)}</small><b>${esc(s.title)}</b></button>`; }).join("")}
    </div>
    <div class="stats">
      <div class="stat"><b class="num" data-count="${S.length}">${S.length}</b><span>stories</span></div>
      <div class="stat hot"><b class="num" data-count="${gulf.length}">${gulf.length}</b><span>Gulf mentions</span></div>
      <div class="stat"><b class="num" data-count="${outlets.length}">${outlets.length}</b><span>outlets</span></div>
      <div class="stat"><b class="num" data-count="${clips}">${clips}</b><span>press clippings</span></div>
    </div>
    <div class="ticker" aria-label="Headlines">
      <span class="lab">TODAY</span>
      <div class="track">${[...S, ...S].map((s,i) => `<button data-story="${s.id}" ${i >= S.length ? 'aria-hidden="true" tabindex="-1"' : ""}>${esc(s.title)}</button>`).join("")}</div>
    </div>
  </div>

  <div class="grid">
    ${gulf.length ? `<section class="spot" aria-labelledby="spot-h">
      <div class="sec-head"><div><div class="eyebrow">Spotlight</div><h2 id="spot-h">Gulf in the news</h2></div><span class="hint">${gulf.length} mention${gulf.length>1?"s":""}</span></div>
      <div class="spot-row">${gulf.map(s => { const v = visual(s); return `
        <button class="spot-card" data-story="${s.id}">
          ${v ? `<img src="${esc(v.src)}" alt="" loading="lazy">` : ""}
          <span class="shade"></span>
          <span class="body">
            <span style="display:flex;gap:6px;flex-wrap:wrap"><span class="badge gulf">Gulf</span><span class="badge k">${KIND[s.kind]}${s.platform ? " · " + esc(s.platform) : ""}</span></span>
            <h3>${esc(s.title)}</h3>
            <span class="meta">${esc(s.outlet)} · ${fmt(s.date,{day:"numeric",month:"short"})}</span>
          </span>
        </button>`; }).join("")}</div>
    </section>` : ""}

    <aside class="glance" aria-label="At a glance">
      <div class="panel">
        <div class="eyebrow">Beat mix</div>
        <div class="mix-bar" role="img" aria-label="${secs.map(([n,c]) => `${secInfo(n).short} ${c}`).join(", ")}">
          ${secs.map(([n,c],i) => `<span style="flex:${c};background:${secInfo(n).color};animation-delay:${i*90}ms"></span>`).join("")}
        </div>
        <div class="legend">${secs.map(([n,c]) => `<button data-beat="${esc(n)}"><i style="background:${secInfo(n).color}"></i><span>${esc(secInfo(n).short)}</span><b class="num">${c}</b></button>`).join("")}</div>
        <div class="media">${kinds.map(([k,c]) => `<div>${ICON[k]}<b class="num">${c}</b><span>${KIND[k]}</span></div>`).join("")}</div>
      </div>
      <div class="panel">
        <div class="eyebrow">Watchlist</div>
        <div class="watch">${hits.map(g => `<span class="wgroup">${esc(g.g)}</span>` + g.items.map(w =>
          `<button class="wchip ${w.ids.length ? "on" : "zero"}" aria-pressed="${state.watch === w.k}" data-watch="${esc(w.k)}" ${w.ids.length ? "" : 'disabled title="No mentions in this edition"'}>${esc(w.k)} <b class="num">${w.ids.length}</b></button>`).join("")).join("")}</div>
      </div>
      <div class="panel">
        <div class="eyebrow">Where the coverage ran</div>
        <div class="outlets">${outlets.slice(0,6).map(([o,c],i) => `<div class="outlet"><span>${esc(o)}</span><b class="num">${c}</b><span class="bar"><i style="width:${c/outlets[0][1]*100}%;animation-delay:${i*70}ms"></i></span></div>`).join("")}</div>
      </div>
    </aside>

    <section class="feed" aria-labelledby="feed-h">
      <div class="sec-head" style="margin-bottom:0"><div><div class="eyebrow">The brief</div><h2 id="feed-h">Every story, by beat</h2></div></div>
      <div class="filters" role="group" aria-label="Filter by beat">
        <button class="fchip" data-beat="all" aria-pressed="${state.beat === "all"}">All <small>${S.length}</small></button>
        ${secs.map(([n,c]) => `<button class="fchip" data-beat="${esc(n)}" aria-pressed="${state.beat === n}"><i style="background:${secInfo(n).color}"></i>${esc(secInfo(n).short)} <small>${c}</small></button>`).join("")}
      </div>
      <div id="feed-body"></div>
    </section>
  </div>`;
  renderFeed();
  countUp();
}

function card(s, i, lead){
  const v = visual(s);
  const w = WATCH.flatMap(g => g.items).filter(w => !w.own && matches(w, s)).slice(0, 2);
  const kick = `<div class="kick"><span class="src">${esc(s.outlet)}</span>${s.edition ? `<span>${esc(s.edition.split(",")[0])}${s.edition.includes(",") ? " +" + (s.edition.split(",").length-1) : ""}</span>` : ""}${s.page ? `<span>${pages(s.page)}</span>` : ""}</div>`;
  const foot = `<div class="foot"><span class="tag">${ICON[s.kind]}${KIND[s.kind]}${s.platform ? " · " + esc(s.platform) : ""}</span>${s.clips?.length ? `<span class="tag">${ICON.clip}Clipping</span>` : ""}${w.map(x => `<span class="tag hit">${esc(x.k)}</span>`).join("")}</div>`;
  if (lead && v) return `<button class="card lead" style="--i:${i}" data-story="${s.id}">
      <div class="lead-img"><img src="${esc(v.src)}" alt="" loading="lazy"></div>
      <div class="txt">${kick}<h4>${esc(s.title)}</h4><p>${esc(s.summary)}</p>${foot}</div></button>`;
  return `<button class="card" style="--i:${i}" data-story="${s.id}">
      <div style="min-width:0">${kick}<h4>${esc(s.title)}</h4><p>${esc(s.summary)}</p>${foot}</div>
      ${v ? `<div class="thumb ${s.clips?.length ? "paper" : ""}"><img src="${esc(v.thumb || v.src)}" alt="" loading="lazy"></div>` : `<div class="thumb noimg">${ICON[s.kind]}</div>`}
    </button>`;
}

function renderFeed(){
  const list = filtered();
  const groups = state.ed.sections.map(n => [n, list.filter(s => s.section === n)]).filter(([,l]) => l.length);
  let i = 0;
  $("#feed-body").innerHTML = (state.watch ? `<div class="active-filter">Showing stories that mention <b>${esc(state.watch)}</b><button data-clear-watch>Clear</button></div>` : "") +
    (groups.length ? groups.map(([n, l]) => `
      <div class="beat">
        <div class="beat-head"><span class="sw" style="background:${secInfo(n).color}"></span>
          <div><h3>${esc(n)}</h3><p>${esc(secInfo(n).why)}</p></div><span class="ct num">${String(l.length).padStart(2,"0")}</span></div>
        <div class="cards">${l.map((s, j) => card(s, i++, j === 0 && l.length > 2 && n !== "Gulf in the News")).join("")}</div>
      </div>`).join("") : `<div class="empty">No stories match this filter.</div>`);
}

function countUp(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  document.querySelectorAll("[data-count]").forEach(el => {
    const to = +el.dataset.count, t0 = performance.now();
    const step = t => { const p = Math.min(1, (t - t0) / 900); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

/* ---------- Clippings ---------- */
function renderClippings(){
  const S = state.ed.stories.filter(s => s.clips?.length || s.image);
  const secs = state.ed.sections;
  const list = state.beat === "all" ? S : S.filter(s => s.section === state.beat);
  $("#view-clippings").innerHTML = `
    <div class="sec-head" style="margin-top:6px"><div><div class="eyebrow">${fmt(state.date,{day:"numeric",month:"long",year:"numeric"})}</div><h2>Today's clippings</h2></div><span class="hint">${list.length} cuttings</span></div>
    <div class="filters" role="group" aria-label="Filter by beat">
      <button class="fchip" data-beat="all" aria-pressed="${state.beat === "all"}">All <small>${S.length}</small></button>
      ${secs.map(n => { const c = S.filter(s => s.section === n).length; return c ? `<button class="fchip" data-beat="${esc(n)}" aria-pressed="${state.beat === n}"><i style="background:${secInfo(n).color}"></i>${esc(secInfo(n).short)} <small>${c}</small></button>` : ""; }).join("")}
    </div>
    <div class="wall">${list.map(s => { const v = visual(s); return `
      <button class="clip" data-story="${s.id}" data-tab="clip">
        <img src="${esc(v.thumb && !s.clips?.length ? v.thumb : v.src)}" alt="Clipping: ${esc(s.title)}" loading="lazy" width="${v.w}" height="${v.h}">
        <span class="cap">${esc(s.outlet)}<span>${esc(s.edition ? s.edition.split(",")[0] + " · " : "")}${esc(pages(s.page) || KIND[s.kind])}</span></span>
      </button>`; }).join("")}</div>`;
}

/* ---------- Archive ---------- */
function renderArchive(){
  const have = new Map(state.index.map(e => [e.date, e]));
  const ref = dateObj(state.date);
  const first = new Date(ref.getFullYear(), ref.getMonth(), 1);
  const days = new Date(ref.getFullYear(), ref.getMonth() + 1, 0).getDate();
  const lead = (first.getDay() + 6) % 7; // Monday-first
  let cells = Array.from({length: lead}, () => `<span class="pad"></span>`).join("");
  for (let d = 1; d <= days; d++){
    const key = new Date(ref.getFullYear(), ref.getMonth(), d).toLocaleDateString("en-CA");
    const e = have.get(key);
    cells += `<button ${e ? `class="has ${key === state.date ? "sel" : ""}" data-date="${key}"` : "disabled"} aria-label="${fmt(key,{day:"numeric",month:"long"})}${e ? ", " + e.stories + " stories" : ", no edition"}">${d}${e ? `<small>${e.stories}</small>` : ""}</button>`;
  }
  $("#view-archive").innerHTML = `
    <div class="sec-head" style="margin-top:6px"><div><div class="eyebrow">Archive</div><h2>Past editions</h2></div><span class="hint">${state.index.length} edition${state.index.length > 1 ? "s" : ""} so far</span></div>
    <div class="archive-grid">
      <div class="panel">
        <div class="eyebrow">${ref.toLocaleDateString("en-IN",{month:"long",year:"numeric"})}</div>
        <div class="cal">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d => `<span class="dh">${d}</span>`).join("")}${cells}</div>
      </div>
      <div>
        <div class="ed-list">${state.index.map(e => `
          <button class="ed" data-date="${e.date}" data-goto="today">
            <span class="d">${dateObj(e.date).getDate()}<small>${fmt(e.date,{month:"short"}).toUpperCase()}</small></span>
            <span style="min-width:0"><b>${fmt(e.date,{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</b>
            <span>${e.stories} stories · ${e.gulf} Gulf mention${e.gulf === 1 ? "" : "s"}</span></span>
          </button>`).join("")}</div>
        <p class="hint" style="margin-top:14px">Each morning's tracker email becomes a new edition. Editions published before today will show here as they are added.</p>
      </div>
    </div>`;
}

/* ---------- Story sheet ---------- */
function openStory(id, tab){
  const s = state.ed.stories.find(x => x.id === id); if (!s) return;
  state.open = id;
  const v = visual(s);
  const hasClip = !!s.clips?.length;
  tab = tab === "clip" && (hasClip || v) ? "clip" : (tab || "summary");
  const facts = [["Outlet", s.outlet], ["Type", s.outletType || KIND[s.kind] + (s.platform ? " · " + s.platform : "")], ["Edition", s.edition], ["Page", s.page && pages(s.page)],
    ["Byline", s.author], ["Published", fmt(s.date,{day:"numeric",month:"short",year:"numeric"})]].filter(f => f[1]);
  const paras = (s.fullText || "").split(/\n+/).map(p => p.trim()).filter(Boolean);
  const gulfRe = /(gulf oil|gulf[’']s|dhoni)/gi;
  const hl = t => esc(t).replace(gulfRe, "<mark>$1</mark>");
  $("#sheet-root").innerHTML = `
    <div class="scrim" data-close></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title">
      <div class="grab"></div>
      <div class="sh-top"><span class="sec">${esc(secInfo(s.section).short)}</span><button class="iconbtn" data-close aria-label="Close">${ICON.close}</button></div>
      <div class="sh-scroll">
        <h2 id="sh-title">${esc(s.title)}</h2>
        <dl class="facts">${facts.map(([k, val]) => `<div><dt>${k}</dt><dd>${esc(val)}</dd></div>`).join("")}</dl>
        <div class="seg" role="tablist">
          <button role="tab" data-tab="summary" aria-selected="${tab === "summary"}">Summary</button>
          <button role="tab" data-tab="full" aria-selected="${tab === "full"}" ${paras.length ? "" : "disabled"}>Full story</button>
          <button role="tab" data-tab="clip" aria-selected="${tab === "clip"}" ${v ? "" : "disabled"}>${hasClip ? "Clipping" : "Image"}</button>
        </div>
        <div data-pane="summary" ${tab === "summary" ? "" : "hidden"}>
          <p class="summary-lede">${hl(s.summary)}</p>
          ${secInfo(s.section).why ? `<div class="why"><b>Why we track this</b>${esc(secInfo(s.section).why)}</div>` : ""}
        </div>
        <div data-pane="full" class="prose" ${tab === "full" ? "" : "hidden"}>${paras.map(p => `<p>${hl(p)}</p>`).join("")}</div>
        <div data-pane="clip" ${tab === "clip" ? "" : "hidden"}>
          ${v ? `<div class="clipview"><img src="${esc(v.src)}" alt="${hasClip ? "Newspaper clipping" : "Story image"}: ${esc(s.title)}"></div><p class="hint" style="margin-top:8px">Tap the ${hasClip ? "clipping" : "image"} to zoom.${s.page && s.page.includes(",") ? " This story runs across several pages; the tracker link has every page." : ""}</p>` : ""}
        </div>
        <a class="cta" href="${esc(s.url)}" target="_blank" rel="noopener">${s.kind === "print" ? "Open in media tracker" : "Open original on " + esc(s.platform || s.outlet)} ${ICON.out}</a>
      </div>
    </div>`;
  document.body.style.overflow = "hidden";
  $("#sheet-root .iconbtn").focus();
  setHash(sid(s));
}
function closeStory(){
  if (!state.open) return;
  const id = state.open; state.open = null;
  $("#sheet-root").innerHTML = ""; document.body.style.overflow = "";
  setHash(state.view);
  const back = document.querySelector(`[data-story="${id}"]:not([aria-hidden])`); if (back) back.focus({preventScroll:true});
}

/* ---------- Routing & events ---------- */
function setHash(h){ if (location.hash.slice(1) !== h) history.replaceState(null, "", "#" + h); }
function show(view){
  state.view = view;
  ["today","clippings","archive"].forEach(v => { $("#view-" + v).hidden = v !== view; });
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-current", t.dataset.view === view ? "page" : "false"));
  if (view === "today") renderToday(); else if (view === "clippings") renderClippings(); else renderArchive();
  store.set("gp-view", view);
}
async function loadEdition(date){
  state.date = date;
  const r = await fetch(`data/${date}.json`);
  state.ed = await r.json();
  state.watch = null; state.beat = "all";
  renderDays();
}
function route(){
  const h = location.hash.slice(1);
  const m = /^story-(\d\d)$/.exec(h);
  if (m){ const s = state.ed.stories.find(x => x.id.startsWith(m[1])); if (s){ if (state.view !== "today" && !$("#view-" + state.view).innerHTML) show("today"); openStory(s.id); return; } }
  if (["today","clippings","archive"].includes(h)){ closeStory(); show(h); }
}

document.addEventListener("click", async e => {
  const t = e.target.closest("button, [data-close]"); if (!t) return;
  if (t.matches("[data-close]")) return closeStory();
  if (t.dataset.view){ setHash(t.dataset.view); show(t.dataset.view); window.scrollTo({top:0}); return; }
  if (t.dataset.date){ await loadEdition(t.dataset.date); const v = t.dataset.goto || state.view; setHash(v); show(v); return; }
  if (t.dataset.story) return openStory(t.dataset.story, t.dataset.tab);
  if (t.dataset.tab && t.closest(".seg")){
    document.querySelectorAll(".seg [data-tab]").forEach(b => b.setAttribute("aria-selected", b === t));
    document.querySelectorAll("[data-pane]").forEach(p => p.hidden = p.dataset.pane !== t.dataset.tab);
    return;
  }
  if (t.dataset.beat){
    state.beat = state.beat === t.dataset.beat && t.dataset.beat !== "all" ? "all" : t.dataset.beat;
    if (state.view === "clippings") return renderClippings();
    document.querySelectorAll(".filters .fchip").forEach(b => b.setAttribute("aria-pressed", b.dataset.beat === state.beat));
    renderFeed();
    if (t.closest(".legend")) $(".filters").scrollIntoView({behavior:"smooth", block:"start"});
    return;
  }
  if (t.dataset.watch){
    state.watch = state.watch === t.dataset.watch ? null : t.dataset.watch;
    document.querySelectorAll(".wchip").forEach(b => b.setAttribute("aria-pressed", b.dataset.watch === state.watch));
    renderFeed(); $(".filters").scrollIntoView({behavior:"smooth", block:"start"}); return;
  }
  if (t.hasAttribute("data-clear-watch")){ state.watch = null; document.querySelectorAll(".wchip").forEach(b => b.setAttribute("aria-pressed","false")); renderFeed(); }
});
document.addEventListener("click", e => { const img = e.target.closest(".clipview img"); if (img) img.parentElement.classList.toggle("zoom"); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeStory(); });
window.addEventListener("hashchange", route);

(async function boot(){
  try {
    const idx = await (await fetch("data/index.json")).json();
    state.index = idx.editions;
    await loadEdition(state.index[0].date);
    const h = location.hash.slice(1);
    show(["today","clippings","archive"].includes(h) ? h : "today");
    if (/^story-/.test(h)) route();
  } catch (err){
    $("#view-today").innerHTML = `<div class="empty" style="margin-top:20px">The edition could not be loaded. Refresh the page to try again.</div>`;
  }
})();
})();
</script>
