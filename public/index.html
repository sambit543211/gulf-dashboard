<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Gulf Pulse</title>
<meta name="description" content="Daily media brief for Gulf Oil Lubricants India.">
<meta name="theme-color" content="#F5F7FC" id="meta-theme">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gulf Pulse">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>
/* Pick the theme before first paint: light by default, dark only if the reader chose it. */
(function(){var t=null;try{t=JSON.parse(localStorage.getItem("gp-theme"));}catch(e){}
var m=t==="dark"?"dark":"light";
document.documentElement.dataset.theme=m;})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<script src="/config.js"></script>
<style>
/* Gulf Pulse — Glance → Choose → Read, for one thumb.
   Home: masthead + Gulf in the news + top story of each sector + today's clippings.
   Bottom bar: every sector on one line. Images never carry text. Light and dark themes. */
:root{
  --navy:#192C76; --orange:#FF7403; --sky:#93DAFE;
  --f-d:"Montserrat","Arial Black",system-ui,sans-serif;
  --f-b:"Helvetica Neue","Inter",Helvetica,Arial,system-ui,sans-serif;
  --f-s:"Newsreader",Georgia,"Times New Roman",serif;
  --ease:cubic-bezier(.22,.8,.25,1); --spring:cubic-bezier(.34,1.45,.64,1);
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  --nav-h:64px;
  /* dark (default) */
  --bg:#060A1A; --s1:#0D1430; --s2:#141C40; --s3:#1B2552;
  --line:rgba(147,218,254,.11); --line-2:rgba(147,218,254,.2);
  --hi:#FFFFFF; --fg:#E8EDFB; --fg-2:#AAB5DA; --muted:#7480AA;
  --accent:#FF7403; --on-accent:#0A0F24; --accent-soft:rgba(255,116,3,.13);
  --c-gulf:#FF7A14; --c-ind:#F2C36B; --c-infra:#7CCBF5; --c-oil:#6F95FF; --c-auto:#B4C2FF; --c-other:#9FB0E0;
  --glass:rgba(6,10,26,.8); --glass-2:rgba(6,10,26,.92);
  --card-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 18px 36px -26px rgba(0,0,0,.95);
  --paper:#ECE6D8; --img-bg:#111938;
  --aura1:rgba(25,44,118,.7); --aura2:rgba(255,116,3,.08);
  --toast-bg:#FFFFFF; --toast-fg:#192C76; --scrim:rgba(2,4,14,.62);
  --sheet:#0F1736; --btn-hi-bg:#FFFFFF; --btn-hi-fg:#192C76;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F5F7FC; --s1:#FFFFFF; --s2:#EEF2FA; --s3:#E1E7F4;
  --line:rgba(25,44,118,.1); --line-2:rgba(25,44,118,.17);
  --hi:#0B1433; --fg:#18224A; --fg-2:#4A5579; --muted:#7782A5;
  --accent:#F26A00; --on-accent:#0B1433; --accent-soft:rgba(242,106,0,.1);
  --c-gulf:#F26A00; --c-ind:#B7791F; --c-infra:#0A86C4; --c-oil:#2D55D6; --c-auto:#5B62C9; --c-other:#5A6890;
  --glass:rgba(245,247,252,.82); --glass-2:rgba(255,255,255,.94);
  --card-shadow:0 1px 2px rgba(25,44,118,.05),0 14px 30px -22px rgba(25,44,118,.35);
  --paper:#F1ECE0; --img-bg:#E4E9F4;
  --aura1:rgba(147,218,254,.38); --aura2:rgba(255,116,3,.07);
  --toast-bg:#192C76; --toast-fg:#FFFFFF; --scrim:rgba(14,22,56,.35);
  --sheet:#FFFFFF; --btn-hi-bg:#192C76; --btn-hi-fg:#FFFFFF;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--f-b);-webkit-font-smoothing:antialiased;min-height:100dvh;overflow-x:hidden;overscroll-behavior:none;touch-action:manipulation;transition:background-color .3s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
a{color:inherit;-webkit-touch-callout:none}
img{display:block;max-width:100%;-webkit-user-drag:none;-webkit-touch-callout:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
body.locked{position:fixed;left:0;right:0;overflow:hidden}
img.fx{opacity:0;transition:opacity .5s var(--ease)} img.fx.ld{opacity:1}

/* ambient light */
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--bg);transition:background .3s}
.aurora i{position:absolute;border-radius:50%;will-change:transform}
.aurora i:nth-child(1){width:110vmax;height:110vmax;left:-45vmax;top:-62vmax;background:radial-gradient(closest-side,var(--aura1),transparent);animation:d1 30s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:70vmax;height:70vmax;right:-40vmax;top:40vh;background:radial-gradient(closest-side,var(--aura2),transparent);animation:d2 36s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(12vw,10vh)}} @keyframes d2{to{transform:translate(-14vw,-12vh)}}

/* intro (once a day) */
.intro{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:var(--bg);clip-path:circle(150% at var(--ox,50%) var(--oy,50%));transition:clip-path .65s cubic-bezier(.7,0,.2,1)}
.intro.out{clip-path:circle(0% at var(--ox,50%) var(--oy,50%))}
.intro img{width:min(40vw,160px);animation:pop .7s var(--spring) both;filter:drop-shadow(0 16px 40px rgba(255,116,3,.35))}
.intro svg{position:absolute;width:min(66vw,270px);height:auto;animation:spin 3s linear infinite}
.intro circle{fill:none;stroke-linecap:round;stroke-dasharray:var(--l);stroke-dashoffset:var(--l);animation:draw .9s var(--ease) forwards}
@keyframes pop{from{transform:scale(.4) rotate(-20deg);opacity:0}}
@keyframes draw{to{stroke-dashoffset:calc(var(--l) * .4)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- header: brand · edition · theme · alerts ---------- */
.top{position:fixed;z-index:40;left:0;right:0;top:0;padding-top:var(--top);background:var(--glass);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border-bottom:1px solid var(--line);transition:transform .3s var(--ease),background .3s;view-transition-name:hdr}
.bar{display:flex;align-items:center;gap:8px;height:56px;max-width:1100px;margin:0 auto}
.bar .logo{width:30px;height:auto;flex:none}
.brand{font:800 16px/1 var(--f-d);letter-spacing:-.01em;color:var(--hi);white-space:nowrap;margin-right:auto}
.brand em{font-style:normal;color:var(--accent)}
.ed-pill{display:flex;align-items:center;gap:8px;height:40px;padding:0 10px 0 11px;border-radius:12px;background:var(--s2);border:1px solid transparent;text-align:left;transition:background .2s,transform .15s var(--ease)}
.ed-pill:active{transform:scale(.96)}
.ed-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;box-shadow:0 0 0 3px var(--accent-soft)}
.ed-pill .dot.past{background:var(--muted);box-shadow:none}
.ed-pill .t{display:flex;flex-direction:column;gap:2px}
.ed-pill small{font:700 8.5px/1 var(--f-d);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ed-pill b{font:700 12.5px/1 var(--f-d);color:var(--hi);white-space:nowrap}
.ed-pill svg{width:14px;height:14px;color:var(--muted)}
.icon-btn{position:relative;width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--s2);border:1px solid transparent;color:var(--fg);transition:transform .15s var(--ease)}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:19px;height:19px}
.icon-btn.on{color:var(--accent)}
.icon-btn .pip{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--s2)}
#theme svg{transition:transform .5s var(--spring)}
#theme:active svg{transform:rotate(40deg) scale(.9)}
@media (max-width:370px){ .brand{display:none} .bar .logo{margin-right:auto} }

/* pull to refresh */
.ptr{position:fixed;z-index:39;left:50%;top:calc(var(--top) + 62px);width:38px;height:38px;margin-left:-19px;border-radius:50%;display:grid;place-items:center;background:var(--s1);border:1px solid var(--line-2);box-shadow:var(--card-shadow);opacity:0;transform:translateY(-30px) scale(.6);pointer-events:none}
.ptr img{width:24px} .ptr.spin img{animation:spin .8s linear infinite}

/* ---------- bottom bar: every sector on one line ---------- */
.nav{position:fixed;z-index:45;left:0;right:0;bottom:0;display:flex;overflow-x:auto;scrollbar-width:none;
  padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + var(--bot)) max(4px,env(safe-area-inset-left,0px));
  background:var(--glass);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border-top:1px solid var(--line);view-transition-name:nav}
.nav::-webkit-scrollbar{display:none}
.nav button{position:relative;z-index:1;flex:1 0 56px;min-width:56px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font:700 10px/1.1 var(--f-d);letter-spacing:-.005em}
.nav .ic{position:relative;display:grid;place-items:center;width:46px;height:28px;border-radius:14px}
.nav svg{width:21px;height:21px;transition:transform .35s var(--spring)}
.nav .l{white-space:nowrap}
.nav button[aria-current="page"]{color:var(--hi)}
.nav button[aria-current="page"] svg{color:var(--cc,var(--accent));transform:scale(1.06)}
.nav button:active svg{transform:scale(.86)}
.nav .badge{position:absolute;top:-3px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--accent);color:var(--on-accent);font:800 9.5px/16px var(--f-d);box-shadow:0 0 0 2px var(--bg)}
.nav-ind{position:absolute;z-index:0;left:0;top:0;border-radius:14px;background:color-mix(in srgb,var(--ic,var(--accent)) 20%,transparent);transition:transform .5s var(--spring),width .4s var(--ease),background .35s;pointer-events:none}

main{max-width:1100px;margin:0 auto;padding-top:calc(var(--top) + 56px);padding-bottom:calc(var(--nav-h) + var(--bot) + 28px);min-height:100dvh;touch-action:pan-y}
.page{will-change:transform}
.enter-r{animation:inR .38s var(--ease)} .enter-l{animation:inL .38s var(--ease)} .enter-f{animation:inF .4s var(--ease)}
@keyframes inR{from{transform:translateX(40px);opacity:.3}} @keyframes inL{from{transform:translateX(-40px);opacity:.3}} @keyframes inF{from{transform:translateY(10px);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}}
.page:not(.still) .rise{animation:rise .55s var(--ease) backwards;animation-delay:calc(var(--i,0) * 50ms)}

/* page transitions (View Transitions where supported) */
html.vt-nav::view-transition-old(root){animation:vtOut .16s ease-in both}
html.vt-nav::view-transition-new(root){animation:vtIn .32s var(--ease) both}
html.vt-nav[data-dir="r"]::view-transition-old(root){animation-name:vtOutL} html.vt-nav[data-dir="r"]::view-transition-new(root){animation-name:vtInR}
html.vt-nav[data-dir="l"]::view-transition-old(root){animation-name:vtOutR} html.vt-nav[data-dir="l"]::view-transition-new(root){animation-name:vtInL}
@keyframes vtOut{to{opacity:0;transform:scale(.99)}} @keyframes vtIn{from{opacity:0;transform:translateY(10px)}}
@keyframes vtOutL{to{opacity:0;transform:translateX(-28px)}} @keyframes vtInR{from{opacity:0;transform:translateX(36px)}}
@keyframes vtOutR{to{opacity:0;transform:translateX(28px)}} @keyframes vtInL{from{opacity:0;transform:translateX(-36px)}}
html.vt-theme .top,html.vt-theme .nav{view-transition-name:none}
html.vt-theme::view-transition-old(root){animation:none}
html.vt-theme::view-transition-new(root){animation:themeIn .6s var(--ease)}
@keyframes themeIn{from{clip-path:circle(0 at var(--tx,90%) var(--ty,4%))}to{clip-path:circle(160vmax at var(--tx,90%) var(--ty,4%))}}

/* ---------- home ---------- */
.mast{display:flex;align-items:flex-end;gap:14px;margin:20px 0 4px}
.mast .tx{flex:1;min-width:0}
.mast .eb{font:700 10.5px/1 var(--f-d);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mast h1{margin:8px 0 6px;font:600 clamp(28px,8vw,36px)/1.04 var(--f-s);letter-spacing:-.015em;color:var(--hi)}
.mast .sub{font-size:13px;color:var(--fg-2)}
.play-wrap{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px}
.play-wrap small{font:700 10px/1 var(--f-d);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2)}
.play{position:relative;width:62px;height:62px;display:grid;place-items:center;transition:transform .2s var(--spring)}
.play:active{transform:scale(.92)}
.play svg.r{position:absolute;inset:0;width:62px;height:62px;transform:rotate(-90deg)}
.play circle{fill:none;stroke-width:3;stroke-linecap:round}
.play .bg{stroke:var(--line-2)} .play .fg{stroke:var(--hi);transition:stroke-dashoffset 1.2s var(--ease)}
.play .disc{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);box-shadow:0 10px 26px -10px var(--accent)}
.play .disc svg{width:20px;height:20px;margin-left:3px}
.upd{display:flex;align-items:center;gap:10px;width:100%;margin-top:16px;padding:11px 14px;border-radius:14px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);font-size:13.5px;color:var(--fg);text-align:left}
.upd i{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.upd b{color:var(--hi);font-weight:600}
.upd em{margin-left:auto;display:flex;align-items:center;gap:2px;font:700 12.5px/1 var(--f-d);font-style:normal;color:var(--accent)}
.upd em svg{width:14px;height:14px}
.sh{display:flex;align-items:baseline;gap:8px;margin:28px 0 12px}
.sh h2{margin:0;font:600 21px/1.15 var(--f-s);letter-spacing:-.01em;color:var(--hi)}
.sh .cnt{font:600 12.5px/1 var(--f-d);color:var(--muted)}
.sh .more{margin-left:auto;display:flex;align-items:center;gap:2px;min-height:36px;padding:0 2px 0 10px;font:700 12.5px/1 var(--f-d);color:var(--accent)}
.sh .more svg{width:15px;height:15px}
.sh .gl{width:18px;height:auto;align-self:center}

/* Gulf cards: image on top, words below (never on the photo) */
.hrow{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 calc(-1 * max(20px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(20px,env(safe-area-inset-left,0px)));padding:2px max(20px,env(safe-area-inset-right,0px)) 6px max(20px,env(safe-area-inset-left,0px));scroll-padding-left:max(20px,env(safe-area-inset-left,0px));overscroll-behavior-x:contain}
.hrow::-webkit-scrollbar{display:none}
.gcard{flex:0 0 82%;scroll-snap-align:start;display:flex;flex-direction:column;border-radius:20px;overflow:hidden;background:var(--s1);border:1px solid var(--line);box-shadow:var(--card-shadow);text-align:left;transition:transform .2s var(--ease)}
.gcard:only-child{flex-basis:100%}
.gcard:active{transform:scale(.98)}
.gcard .im{position:relative;aspect-ratio:16/9;background:var(--img-bg);overflow:hidden}
.gcard .im img{width:100%;height:100%;object-fit:cover}
.gcard .im.paper{background:var(--paper)} .gcard .im.paper img{object-position:top}
.gcard .tx{display:flex;flex-direction:column;gap:6px;padding:12px 14px 15px}
.gcard h3{margin:0;font:600 18px/1.24 var(--f-s);color:var(--hi);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;letter-spacing:-.005em}
.kick{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font:700 10.5px/1.3 var(--f-d);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kick .c{color:var(--cc,var(--fg-2))}
.nwt{padding:3px 6px;border-radius:5px;background:var(--accent);color:var(--on-accent);font:800 9.5px/1.2 var(--f-d);letter-spacing:.05em;text-transform:uppercase}
.quiet-box{display:flex;gap:12px;align-items:center;padding:16px;border-radius:18px;background:var(--s1);border:1px dashed var(--line-2);color:var(--fg-2);font-size:14px}
.quiet-box img{width:26px}

/* Top stories: one lead per sector */
.tops{border-radius:20px;background:var(--s1);border:1px solid var(--line);box-shadow:var(--card-shadow);overflow:hidden}
.ts{padding:4px 14px 14px;border-top:1px solid var(--line)}
.ts:first-child{border-top:0}
.ts-h{display:flex;align-items:center;gap:8px;min-height:44px}
.ts-h .chip{display:flex;align-items:center;gap:7px;font:700 11px/1 var(--f-d);letter-spacing:.08em;text-transform:uppercase;color:var(--cc)}
.ts-h .chip svg{width:16px;height:16px}
.ts-h .all{margin-left:auto;display:flex;align-items:center;gap:2px;height:36px;padding:0 4px 0 10px;border-radius:10px;font:700 12px/1 var(--f-d);color:var(--fg-2)}
.ts-h .all svg{width:14px;height:14px}
.ts-h .all:active{background:var(--s2)}
.ts-b{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;border-radius:12px;transition:transform .15s var(--ease)}
.ts-b:active{transform:scale(.985)}
.ts-b .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.ts-b h3{margin:0;font:600 17px/1.26 var(--f-s);color:var(--hi);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ts-b .m{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.thumb{flex:none;width:72px;height:84px;border-radius:8px;overflow:hidden;background:var(--img-bg);border:1px solid var(--line)}
.thumb.paper{background:var(--paper);border-radius:4px;transform:rotate(2deg);box-shadow:0 8px 18px -12px rgba(0,0,0,.7)}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top}
.thumb.none{display:grid;place-items:center;color:var(--muted);background:var(--s2)}
.thumb.none svg{width:22px;height:22px}

/* Clippings in full: true shape, no cropping */
.cfeed{display:grid;gap:26px}
.cf{display:flex;flex-direction:column;gap:12px;width:100%;text-align:left}
.cf .cap{display:flex;flex-direction:column;gap:6px;padding:0 2px}
.cf b{font:600 17px/1.28 var(--f-s);color:var(--hi)}
.cf .paper{position:relative;display:block;border-radius:6px;overflow:hidden;background:var(--paper);box-shadow:0 26px 44px -28px rgba(0,0,0,.85),0 0 0 1px var(--line);transition:transform .25s var(--ease)}
.cf .paper img{width:100%;height:auto;min-height:220px}
.cf .paper img.ld{min-height:0}
.cf:active .paper{transform:scale(.985)}
.cf .zoom{position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(6,10,26,.62);color:#fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.cf .zoom svg{width:17px;height:17px}
.showall{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:50px;margin-top:18px;border-radius:14px;background:var(--s1);border:1px solid var(--line);font:700 13.5px/1 var(--f-d);color:var(--fg)}
.showall svg{width:16px;height:16px}
.showall:active{background:var(--s2)}
@media (min-width:900px){ .cfeed{grid-template-columns:1fr 1fr;align-items:start;gap:28px 24px} }
/* Today's clippings: large carousel */
.ccar{gap:14px}
.cc{flex:0 0 min(76%,330px);scroll-snap-align:center;display:flex;flex-direction:column;gap:12px;text-align:left}
.cc .pp{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--paper);box-shadow:0 22px 40px -24px rgba(0,0,0,.85),0 0 0 1px var(--line);transition:transform .3s var(--ease)}
.cc .pp img{width:100%;height:100%;object-fit:cover;object-position:top}
.cc:active .pp{transform:scale(.98)}
.cc .cap{display:flex;flex-direction:column;gap:6px;padding:0 2px}
.cc b{font:600 16px/1.28 var(--f-s);color:var(--hi);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cdots{display:flex;gap:5px;justify-content:center;margin-top:12px;flex-wrap:wrap;padding:0 30px}
.cdots i{width:6px;height:6px;border-radius:3px;background:var(--line-2);transition:all .3s var(--ease)}
.cdots i.on{width:18px;background:var(--accent)}
/* Today's clippings strip */
.cs{flex:0 0 auto;display:flex;flex-direction:column;gap:8px;width:116px;scroll-snap-align:start;text-align:left}
.cs .pp{height:148px;border-radius:5px;overflow:hidden;background:var(--paper);box-shadow:0 14px 24px -16px rgba(0,0,0,.8);transform:rotate(var(--r,0deg));transition:transform .3s var(--spring)}
.cs:active .pp{transform:rotate(0) scale(.97)}
.cs .pp img{width:100%;height:100%;object-fit:cover;object-position:top}
.cs span{font:700 10.5px/1.25 var(--f-d);color:var(--fg-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.endnote{display:flex;flex-direction:column;align-items:center;gap:8px;margin:34px 0 6px;color:var(--muted);font-size:12.5px;text-align:center}
.endnote img{width:24px;opacity:.75}

/* ---------- category ---------- */
.cat-h{display:flex;align-items:center;gap:12px;margin:20px 0 14px}
.cat-h .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--cc) 16%,transparent);color:var(--cc);flex:none}
.cat-h .ic svg{width:20px;height:20px}
.cat-h h1{margin:0;font:600 clamp(26px,7.4vw,34px)/1.05 var(--f-s);letter-spacing:-.01em;color:var(--hi)}
.cat-h span{margin-left:auto;font:600 12.5px/1.2 var(--f-d);color:var(--muted);white-space:nowrap}
.lead{display:block;width:100%;border-radius:20px;overflow:hidden;background:var(--s1);border:1px solid var(--line);box-shadow:var(--card-shadow);text-align:left;margin-bottom:6px;transition:transform .2s var(--ease)}
.lead:active{transform:scale(.985)}
.lead .im{aspect-ratio:16/9;background:var(--img-bg);overflow:hidden}
.lead .im.paper{background:var(--paper)}
.lead .im img{width:100%;height:100%;object-fit:cover;object-position:top}
.lead .tx{display:flex;flex-direction:column;gap:7px;padding:13px 15px 16px}
.lead h2{margin:0;font:600 clamp(20px,5.6vw,24px)/1.2 var(--f-s);letter-spacing:-.005em;color:var(--hi)}
.lead .m{font-size:12.5px;color:var(--muted)}
.rows{border-top:0}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:96px;padding:14px 2px;border-bottom:1px solid var(--line);text-align:left;transition:background .2s}
.row:active{background:color-mix(in srgb,var(--sky) 5%,transparent)}
.row .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.row h3{margin:0;font:600 16.5px/1.26 var(--f-s);color:var(--hi);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.row .m{display:flex;align-items:center;gap:5px;font:600 11.5px/1 var(--f-d);color:var(--muted)}
.row .m svg{width:12px;height:12px}
.row .thumb{width:60px;height:72px}
.row.read h3{color:var(--muted);font-weight:500}
.row.read .thumb{opacity:.55}
.pager2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.pager2.one{grid-template-columns:1fr}
.pg{position:relative;display:flex;flex-direction:column;gap:7px;min-height:88px;padding:13px 14px;border-radius:16px;background:var(--s1);border:1px solid var(--line);text-align:left;overflow:hidden;transition:transform .15s var(--ease)}
.pg:active{transform:scale(.97)}
.pg small{display:flex;align-items:center;gap:4px;font:800 10px/1 var(--f-d);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pg small svg{width:14px;height:14px;flex:none}
.pg b{font:600 15px/1.28 var(--f-s);color:var(--hi);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pg.nx{text-align:right;border-color:color-mix(in srgb,var(--nc,var(--accent)) 35%,var(--line));background:linear-gradient(135deg,transparent 45%,color-mix(in srgb,var(--nc,var(--accent)) 12%,transparent)),var(--s1)}
.pg.nx small{justify-content:flex-end;color:var(--nc,var(--accent))}
.swipe-hint{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;font-size:11.5px;color:var(--muted)}
.swipe-hint svg{width:14px;height:14px}

/* sector story cards: headline + small image, the crux readable in place */
.scs{display:grid;gap:12px}
.sc{display:flex;flex-direction:column;gap:11px;width:100%;padding:15px 15px 13px;border-radius:20px;background:var(--s1);border:1px solid var(--line);box-shadow:var(--card-shadow);text-align:left;transition:transform .2s var(--ease)}
.sc:active{transform:scale(.985)}
.sc-h{display:flex;gap:14px;align-items:flex-start}
.sc-h .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.sc h3{margin:0;font:600 18px/1.25 var(--f-s);color:var(--hi);letter-spacing:-.005em;overflow-wrap:anywhere}
.sc .thumb{width:64px;height:76px}
.sc .cx{display:block;font:400 15px/1.55 var(--f-b);color:var(--fg-2)}
.sc .cx mark{color:var(--hi)}
.sc-f{display:flex;align-items:center;gap:5px;padding-top:10px;border-top:1px solid var(--line);font:600 11.5px/1 var(--f-d);color:var(--muted)}
.sc-f svg{width:13px;height:13px}
.sc-f em{margin-left:auto;display:flex;align-items:center;gap:2px;font-style:normal;font-weight:700;color:var(--cc,var(--accent))}
.sc.read h3{color:var(--fg-2)}
.sc.read .thumb{opacity:.6}
@media (min-width:900px){ .scs{grid-template-columns:1fr 1fr;align-items:start} }

/* clippings wall */
.wall{columns:2 150px;column-gap:12px}
.clip{break-inside:avoid;display:block;width:100%;margin:0 0 14px;text-align:left}
.clip .pp{border-radius:5px;overflow:hidden;background:var(--paper);box-shadow:0 16px 26px -18px rgba(0,0,0,.8);transition:transform .25s var(--ease)}
.clip:active .pp{transform:scale(.97)}
.clip img{width:100%;height:auto;min-height:80px}
.clip span{display:block;margin-top:7px;font:700 10.5px/1.25 var(--f-d);color:var(--fg-2)}

/* ---------- story ---------- */
.story{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:hidden;animation:stIn .38s var(--ease)}
@keyframes stIn{from{transform:translateY(40px);opacity:0}}
.st-page{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);will-change:transform}
.st-top{position:absolute;z-index:3;left:0;right:0;top:0;padding:calc(8px + var(--top)) max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;transition:background .3s}
.st-page.scrolled .st-top{background:var(--glass-2);border-bottom:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.prog{display:flex;gap:3px;margin:-4px 0}
.prog button{flex:1;height:13px;display:flex;align-items:center}
.prog button i{display:block;width:100%;height:3px;border-radius:2px;background:rgba(255,255,255,.3);box-shadow:0 0 0 .5px rgba(0,0,0,.15)}
.prog button.d i{background:rgba(255,255,255,.85)} .prog button.c i{background:var(--cc)}
.st-page.scrolled .prog button i{background:var(--line-2)} .st-page.scrolled .prog button.d i{background:var(--fg-2)} .st-page.scrolled .prog button.c i{background:var(--cc)}
.st-ctl{display:flex;gap:8px;align-items:center}
.rb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--glass-2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);color:var(--hi);flex:none;transition:transform .15s var(--ease)}
.rb:active{transform:scale(.9)}
.rb svg{width:18px;height:18px}
.rb.aa{font:600 15px/1 var(--f-s)}
.st-lbl{position:relative;flex:1;min-width:0;height:40px}
.st-lbl>*{position:absolute;inset:0;display:flex;align-items:center;transition:opacity .25s,transform .3s var(--ease)}
.st-lbl .pos{justify-content:center}
.st-lbl .pos span{display:flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:999px;background:var(--glass-2);border:1px solid var(--line);font:700 12px/1 var(--f-d);color:var(--hi)}
.st-lbl .pos i{width:7px;height:7px;border-radius:50%;background:var(--cc)}
.st-lbl .mini{display:block;opacity:0;transform:translateY(6px);font:600 15px/40px var(--f-s);color:var(--hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.st-page.scrolled .st-lbl .pos{opacity:0;transform:translateY(-6px)} .st-page.scrolled .st-lbl .mini{opacity:1;transform:none}
.st-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding-bottom:calc(86px + var(--bot))}
.st-hero{position:relative;height:34vh;min-height:200px;max-height:360px;overflow:hidden;background:var(--img-bg);will-change:transform}
.st-hero.paper{background:var(--paper)}
.st-hero img{width:100%;height:100%;object-fit:cover;object-position:top;animation:kb 16s ease-out both}
.st-hero .gen{position:absolute;inset:0;display:grid;place-items:center;color:var(--cc);opacity:.5}
.st-hero .gen svg{width:72px;height:72px}
.st-hero::after{content:"";position:absolute;left:0;right:0;top:0;height:120px;background:linear-gradient(rgba(0,0,0,.45),transparent);pointer-events:none}
@keyframes kb{from{transform:scale(1.1)}}
/* Clipping header: whole cut-out, scaled to the screen width, never cropped. Starts below the top controls. */
.st-hero.paper{height:auto;min-height:0;max-height:none;padding:calc(var(--top) + 80px) 0 0}
.st-hero.paper img{display:block;width:100%;height:auto;max-height:calc(78svh - var(--top));object-fit:contain;object-position:center top;animation:none}
.st-hero.paper::after{height:calc(var(--top) + 80px)}
.st-scroll{overflow-x:hidden}
.st-body{position:relative;z-index:1;background:var(--bg);max-width:700px;margin:0 auto;padding-top:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.crux p,.full .in,.sc .cx,.ts-b h3,.row h3{overflow-wrap:anywhere;word-break:break-word}
.st-body h1{margin:0;font:600 calc(clamp(26px,7vw,36px) * var(--ts,1))/1.13 var(--f-s);letter-spacing:-.01em;color:var(--hi);text-wrap:balance;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:3px 7px;font-size:13px;color:var(--fg-2)}
.meta i{font-style:normal;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:-4px}
.links a{font:700 13px/1.3 var(--f-d);color:var(--c-infra);text-decoration:none}
.crux{position:relative;padding:17px 17px 17px 20px;border-radius:18px;background:linear-gradient(135deg,var(--accent-soft),transparent 70%),var(--s1);border:1px solid var(--line)}
.crux::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.crux .lab{font:800 10.5px/1 var(--f-d);letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.crux p{margin:9px 0 0;font:500 calc(19px * var(--ts,1))/1.5 var(--f-s);color:var(--hi)}
mark{background:color-mix(in srgb,var(--accent) 28%,transparent);color:inherit;border-radius:4px;padding:0 3px}
.full{overflow:hidden;max-height:0;transition:max-height .6s var(--ease)}
.full.open{max-height:var(--h,8000px)}
.full .in{font:400 calc(18px * var(--ts,1))/1.7 var(--f-s);color:var(--fg)}
.full .in p{margin:0 0 15px}
.full .in p:first-child::first-letter{font:600 3.1em/.82 var(--f-s);color:var(--cc);float:left;margin:4px 8px 0 0}
.act{position:absolute;z-index:3;left:0;right:0;bottom:0;display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:8px;padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + var(--bot)) max(12px,env(safe-area-inset-left,0px));background:var(--glass-2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.act a{display:flex;align-items:center;justify-content:center;gap:7px;height:48px;border-radius:14px;font:700 13px/1 var(--f-d);white-space:nowrap;text-decoration:none}
.act button{display:flex;align-items:center;justify-content:center;gap:7px;height:48px;border-radius:14px;background:var(--s2);border:1px solid var(--line);color:var(--fg);font:700 13px/1 var(--f-d);white-space:nowrap;transition:transform .15s var(--ease)}
.act button:active{transform:scale(.96)}
.act a.p,.act .p{background:var(--btn-hi-bg);color:var(--btn-hi-fg);border-color:transparent}
.act svg{width:16px;height:16px;flex:none}
.act button:disabled{opacity:.35}
.edge-hint{position:absolute;z-index:2;top:50%;width:44px;height:44px;margin-top:-22px;border-radius:50%;display:grid;place-items:center;background:var(--s2);border:1px solid var(--line-2);color:var(--fg);opacity:0;pointer-events:none}
.edge-hint svg{width:20px;height:20px}
.edge-hint.l{left:10px} .edge-hint.r{right:10px}
/* Tap arrows: small, always within thumb reach, fade back while reading/scrolling */
.tap-nav{position:absolute;z-index:4;top:58%;width:36px;height:56px;margin-top:-28px;display:grid;place-items:center;background:var(--glass-2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);color:var(--hi);box-shadow:0 8px 20px -10px rgba(0,0,0,.45);transition:opacity .35s,transform .15s var(--ease),background .2s}
.tap-nav svg{width:18px;height:18px}
.tap-nav.l{left:0;border-left:0;border-radius:0 14px 14px 0}
.tap-nav.r{right:0;border-right:0;border-radius:14px 0 0 14px}
.tap-nav:active{transform:scale(.92);background:var(--accent);color:var(--on-accent)}
.st-page.reading .tap-nav{opacity:.28}
@media (min-width:900px){ .tap-nav{width:44px;height:64px;margin-top:-32px} .tap-nav:hover{opacity:1;background:var(--s2)} }

/* section hand-off and finish */
.inter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(40px + var(--top)) 28px calc(40px + var(--bot));text-align:center;background:radial-gradient(90% 60% at 50% 35%,color-mix(in srgb,var(--cc) 18%,transparent),transparent 70%),var(--bg)}
.inter .done{display:flex;align-items:center;gap:8px;font:700 13px/1 var(--f-d);color:var(--fg-2)}
.inter .done svg{width:18px;height:18px;color:#36C38A}
.inter .big{width:84px;height:84px;border-radius:26px;display:grid;place-items:center;background:color-mix(in srgb,var(--cc) 18%,transparent);color:var(--cc);animation:pop .55s var(--spring) both}
.inter .big svg{width:42px;height:42px}
.inter small{font:800 11px/1 var(--f-d);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.inter h2{margin:-4px 0 0;font:600 34px/1.05 var(--f-s);letter-spacing:-.01em;color:var(--hi)}
.inter p{margin:0;max-width:30ch;color:var(--fg-2);font-size:15px}
.inter .lead-line{max-width:34ch;padding:12px 14px;border-radius:14px;background:var(--s1);border:1px solid var(--line);font:600 16px/1.35 var(--f-s);color:var(--hi)}
.inter .btns{display:grid;gap:8px;width:min(100%,320px);margin-top:8px}
.inter .btn1{height:52px;border-radius:16px;background:var(--accent);color:var(--on-accent);font:800 15px/1 var(--f-d);display:flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden}
.inter .btn1 svg{width:18px;height:18px}
.inter .btn1 .fill{position:absolute;inset:0;background:rgba(255,255,255,.28);transform-origin:left;transform:scaleX(0);animation:fill 4s linear forwards}
@keyframes fill{to{transform:scaleX(1)}}
.inter .btn2{height:48px;border-radius:16px;background:var(--s2);border:1px solid var(--line);font:700 14px/1 var(--f-d);color:var(--fg)}
.inter .close{position:absolute;top:calc(10px + var(--top));left:max(12px,env(safe-area-inset-left,0px))}
.journey{display:flex;align-items:center;gap:6px}
.journey span{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:var(--s1);border:1px solid var(--line);color:var(--muted)}
.journey span svg{width:15px;height:15px}
.journey span.dn{color:var(--cc2);border-color:color-mix(in srgb,var(--cc2) 45%,transparent);background:color-mix(in srgb,var(--cc2) 12%,transparent)}
.journey span.cur{color:var(--bg);background:var(--cc2);border-color:var(--cc2);transform:scale(1.12)}
.journey i{width:10px;height:2px;border-radius:1px;background:var(--line-2)}
.burst{position:relative;display:grid;place-items:center;width:120px;height:120px}
.burst img{width:76px;position:relative;animation:pop .7s var(--spring) both}
.burst i{position:absolute;inset:18px;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:ring 1.6s var(--ease) .2s infinite}
.burst i:nth-child(2){border-color:var(--c-infra);animation-delay:.7s}
@keyframes ring{0%{transform:scale(.7);opacity:.7}100%{transform:scale(1.7);opacity:0}}
@keyframes flash{0%{background:color-mix(in srgb,var(--cc,var(--accent)) 20%,transparent)}100%{background:transparent}}
.flash{animation:flash 1.2s var(--ease)}

/* lightbox (always dark: it's for reading paper) */
.lightbox{position:fixed;inset:0;z-index:80;background:#04060F;display:flex;flex-direction:column;animation:fade .2s both;touch-action:none;color:#fff}
@keyframes fade{from{opacity:0}}
.lb-top{position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:calc(8px + var(--top)) 12px 8px;font:700 13px/1.2 var(--f-d)}
.lb-top .rb{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.15)}
.lb-top span{color:#C9D2EE;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-stage{flex:1;position:relative;overflow:hidden;cursor:grab}
.lb-zoom{position:absolute;z-index:3;right:max(14px,env(safe-area-inset-right,0px));top:calc(10px + var(--top));display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14)}
.lb-zoom button{min-width:36px;height:32px;padding:0 10px;border-radius:999px;font:700 14px/1 var(--f-d);color:#fff}
.lb-zoom button:hover{background:rgba(255,255,255,.12)}
.lb-stage img{position:absolute;left:50%;top:0;width:min(100%,900px);height:auto;background:#ECE6D8;transform-origin:0 0;will-change:transform}
.lb-foot{position:relative;z-index:2;display:flex;gap:8px;justify-content:center;padding:10px 12px calc(14px + var(--bot))}
.lb-foot button{height:44px;padding:0 16px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);font:700 13px/1 var(--f-d);color:#fff}
.lb-foot button.on,.lb-foot .story-btn{background:#fff;color:#192C76}
.lb-tip{position:absolute;z-index:2;left:50%;top:calc(64px + var(--top));transform:translateX(-50%);padding:8px 14px;border-radius:999px;background:rgba(20,28,64,.92);font:600 12px/1 var(--f-d);color:#C9D2EE;white-space:nowrap;animation:fade .3s both,tipOut .4s ease 2.6s forwards;pointer-events:none}
@keyframes tipOut{to{opacity:0}}

/* sheets, toast, tour */
.scrim{position:fixed;inset:0;z-index:70;background:var(--scrim);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fade .2s both}
.sheet{position:fixed;z-index:71;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;overscroll-behavior:contain;background:var(--sheet);border-radius:26px 26px 0 0;border-top:1px solid var(--line-2);padding:10px max(18px,env(safe-area-inset-right,0px)) calc(20px + var(--bot)) max(18px,env(safe-area-inset-left,0px));animation:sheetUp .42s var(--spring);will-change:transform;box-shadow:0 -20px 50px -20px rgba(0,0,0,.4)}
@keyframes sheetUp{from{transform:translateY(100%)}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line-2);margin:0 auto 14px}
.sheet h2{margin:0 0 4px;font:600 23px/1.2 var(--f-s);color:var(--hi)}
.sheet .sub{font-size:13.5px;color:var(--fg-2);margin-bottom:14px}
.sheet .hero-ic{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin:6px 0 14px}
.sheet .hero-ic svg{width:30px;height:30px}
.eds{display:grid;gap:2px;margin:0 0 16px}
.ed{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 10px;border-radius:14px;text-align:left}
.ed:active{background:var(--s2)}
.ed.sel{background:var(--accent-soft)}

<script>
(() => {
const CFG = window.GP_CONFIG;
const GULF = "Gulf in the News";
const TOUR_VERSION = 2;
const BOOT_T = performance.now(); // raise this after a big UI change to show the walkthrough again
const svg = (d, extra = "") => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${extra}>${d}</svg>`;
const ICON = {
  brief: svg('<path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/>'),
  gulf: svg('<circle cx="12" cy="12" r="8.5"/><path d="M4 10.5c5-1 11-1 16 0M4 13.5c5 1 11 1 16 0"/>'),
  ind: svg('<path d="M3 20V10l5 3V10l5 3V6h3l1 4v10z"/><path d="M3 20h18M15 16h2M10 16h2"/>'),
  infra: svg('<path d="M3 20h18M5 20V10M19 20V10M3 10c3-4 15-4 18 0M9 20v-6M15 20v-6"/>'),
  oil: svg('<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/><path d="M9.5 15a2.5 2.5 0 0 0 2.5 2.5"/>'),
  auto: svg('<path d="M5 16V11l2-5h10l2 5v5"/><path d="M3 16h18v2H3z"/><path d="m12.5 7-1.5 3h2l-1.5 3"/>'),
  other: svg('<path d="M4 5h13a2 2 0 0 1 2 2v12H6a2 2 0 0 1-2-2z"/><path d="M8 9h7M8 13h7M8 17h4"/>'),
  clip: svg('<circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><path d="M8 7.5 20 17M8 16.5 20 7"/>'),
  close: svg('<path d="M6 6l12 12M18 6 6 18"/>', 'stroke-width="2.4"'),
  down: svg('<path d="m6 9 6 6 6-6"/>', 'stroke-width="2.4"'),
  prev: svg('<path d="m15 6-6 6 6 6"/>', 'stroke-width="2.4"'),
  next: svg('<path d="m9 6 6 6-6 6"/>', 'stroke-width="2.4"'),
  arrow: svg('<path d="M5 12h14M13 6l6 6-6 6"/>', 'stroke-width="2.4"'),
  share: svg('<path d="M12 15V3M7.5 7.5 12 3l4.5 4.5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/>'),
  out: svg('<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>', 'stroke-width="2.2"'),
  read: svg('<path d="M4 5h13a2 2 0 0 1 2 2v12H6a2 2 0 0 1-2-2z"/><path d="M8 9h7M8 13h7"/>'),
  bell: svg('<path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>'),
  check: svg('<path d="m5 12 5 5 9-10"/>', 'stroke-width="2.6"'),
  play: svg('<path d="M7 5v14l11-7z"/>', 'fill="currentColor" stroke-width="1.5"'),
  swipe: svg('<path d="M15 6l-6 6 6 6"/><path d="M9 6l6 6-6 6" opacity=".35"/>'),
  sun: svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
  moon: svg('<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>'),
  zoom: svg('<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2M11 8v6M8 11h6"/>'),
  help: svg('<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/>')
};
function catInfo(name){
  const n = (name || "").toLowerCase();
  if (name === GULF) return {short:"Gulf", long:"Gulf in the news", icon:ICON.gulf, color:"var(--c-gulf)"};
  if (/infra/.test(n)) return {short:"Infra", long:"Infrastructure", icon:ICON.infra, color:"var(--c-infra)"};
  if (/oil|gas|energy|fuel/.test(n)) return {short:"Oil & Gas", long:"Oil & Gas", icon:ICON.oil, color:"var(--c-oil)"};
  if (/auto|mobility|\bev\b|vehicle/.test(n)) return {short:"Auto & EV", long:"Auto & E-Mobility", icon:ICON.auto, color:"var(--c-auto)"};
  if (/industr|manufactur|business|corporate/.test(n)) return {short:"Industry", long:"Industry", icon:ICON.ind, color:"var(--c-ind)"};
  const s = name.split(/\s+/).slice(0, 2).join(" ");
  return {short:s, long:name, icon:ICON.other, color:"var(--c-other)"};
}
const KIND = {print:"Print", online:"Online", social:"Social"};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dObj = d => new Date(d + "T00:00:00");
const fmt = (d, o) => dObj(d).toLocaleDateString("en-IN", o);
const IST = {timeZone:"Asia/Kolkata"};
const todayIST = () => new Date().toLocaleDateString("en-CA", IST);
const timeIST = t => new Date(t).toLocaleTimeString("en-IN", {hour:"numeric", minute:"2-digit", ...IST});
const pages = p => p ? (/,/.test(p) ? "pp. " + p : "p. " + p) : "";
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const smooth = reduce ? "auto" : "smooth";
const clean = t => String(t || "").replace(/<\s*https?:\/\/[^>]*>/g, " ").replace(/https?:\/\/\S+/g, " ").replace(/\s+\|\s+/g, " · ").replace(/[ \t]{2,}/g, " ").replace(/^[\s·|]+/, "").trim();
const cruxOf = s => clean(s.summary);
const hl = t => esc(clean(t)).replace(/(gulf oil|gulf[’']s|dhoni)/gi, "<mark>$1</mark>");
const store = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const buzz = (ms = 8) => { try { navigator.vibrate && navigator.vibrate(ms); } catch(e){} };
const PROXY = !/^(localhost|127\.|$)/.test(location.hostname);
const imgUrl = (src, w) => !src ? "" : (PROXY ? `/_vercel/image?url=${encodeURIComponent(src)}&w=${w}&q=70` : src);
const img = (src, w, alt = "", extra = "") => src ? `<img class="fx" src="${esc(imgUrl(src, w))}" data-orig="${esc(src)}" alt="${esc(alt)}" loading="lazy" decoding="async" draggable="false" ${extra}>` : "";
document.addEventListener("error", e => { const t = e.target; if (t.tagName !== "IMG") return; if (t.dataset.orig && t.src !== t.dataset.orig) t.src = t.dataset.orig; else t.classList.add("ld"); }, true);
document.addEventListener("load", e => { if (e.target.tagName === "IMG") e.target.classList.add("ld"); }, true);
const settleImgs = root => root.querySelectorAll("img.fx").forEach(i => { if (i.complete && i.naturalWidth) i.classList.add("ld"); });
const visual = s => (s.clips && s.clips[0] && {src:s.clips[0].src, paper:true}) || (s.image && {src:s.image.src, paper:false}) || null;
const clipItem = (s, k, hide) => { const c = catInfo(s.section); return `<button class="cf rise" style="--i:${Math.min(k, 6)}" data-clip="${esc(s.key || s.id)}" ${hide ? "hidden" : ""}>
  <span class="cap"><span class="kick"><span class="c" style="--cc:${c.color}">${esc(c.short)}</span><span>${esc(s.outlet)}${s.page ? " · " + pages(s.page) : ""}</span></span></span>
  <span class="paper">${img(s.clips[0].src, 1080, "Newspaper clipping: " + s.title, k < 2 ? 'loading="eager"' : "")}<span class="zoom" aria-hidden="true">${ICON.zoom}</span></span></button>`; };
const thumbHTML = (s, w = 192) => { const v = visual(s); return v ? `<span class="thumb ${v.paper ? "paper" : ""}">${img(v.src, w)}</span>` : `<span class="thumb none">${catInfo(s.section).icon}</span>`; };

const st = {index:[], ed:null, date:null, view:"brief", cat:null, preview:false, story:null};
const readKey = () => "gp-read-" + st.date;
const isRead = s => (store.get(readKey()) || []).includes(s.key || s.id);
const markRead = s => { const r = store.get(readKey()) || []; if (!r.includes(s.key || s.id)) { r.push(s.key || s.id); store.set(readKey(), r); } };
const isNew = s => st.ed.version > 1 && s.firstVersion === st.ed.version && !isRead(s);
const storiesIn = sec => st.ed.stories.filter(s => s.section === sec);
const leadOf = sec => { const l = storiesIn(sec); const id = (st.ed.leads || {})[sec]; return l.find(s => s.key === id) || l.find(s => visual(s)) || l[0]; };
const ordered = sec => { const l = storiesIn(sec), lead = leadOf(sec); return lead ? [lead, ...l.filter(s => s !== lead)] : []; };
const secs = () => st.ed.sections.filter(n => storiesIn(n).length);
const slug = n => "c-" + catInfo(n).short.toLowerCase().replace(/[^a-z]+/g, "-").replace(/-+$/, "");
const readMins = s => Math.max(1, Math.round(((s.fullText || s.summary || "").split(/\s+/).length) / 220));
const SIZES = [1, 1.12, 1.25];
const isLatest = () => st.preview || st.date === st.index[0]?.date;

/* ---------- data ---------- */
// Data goes through the app's own address first (office networks often block the database host),
// then straight to the database if the relay is unavailable.
const SB_BASES = PROXY ? ["/sb/", `${CFG.supabaseUrl}/rest/v1/`] : [`${CFG.supabaseUrl}/rest/v1/`];
async function sbFetch(path, init = {}){
  let last;
  for (const base of SB_BASES){
    try {
      const r = await fetch(base + path, {...init, cache:"no-store", headers:{apikey:CFG.supabaseKey, Authorization:`Bearer ${CFG.supabaseKey}`, ...(init.headers || {})}});
      if (r.ok) return r;
      last = new Error("load " + r.status);
      if (r.status < 500 && r.status !== 404) break;
    } catch (e){ last = e; }
  }
  throw last || new Error("load");
}
async function sb(path){ return (await sbFetch(path)).json(); }
const loadIndex = async () => { st.index = await sb("edition_index?select=*&order=date.desc"); };
async function loadEdition(date){
  const rows = await sb(`editions?date=eq.${date}&select=date,version,published_at,data`);
  if (!rows[0]) throw new Error("missing");
  st.date = date; st.ed = rows[0].data; st.ed.version = rows[0].version; st.ed.publishedAt = rows[0].published_at;
  store.set("gp-cache", {index:st.index, date, ed:st.ed});
}

/* ---------- theme ---------- */
function themeIcon(){
  const dark = document.documentElement.dataset.theme !== "light";
  const b = $("#theme"); b.innerHTML = dark ? ICON.sun : ICON.moon;
  b.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
  $("#meta-theme").setAttribute("content", dark ? "#060A1A" : "#F5F7FC");
}
function toggleTheme(from){
  const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  const apply = () => { document.documentElement.dataset.theme = next; store.set("gp-theme", next); themeIcon(); };
  buzz(6);
  if (document.startViewTransition && !reduce && from){
    const r = from.getBoundingClientRect(), h = document.documentElement;
    h.style.setProperty("--tx", r.left + r.width / 2 + "px"); h.style.setProperty("--ty", r.top + r.height / 2 + "px");
    h.classList.add("vt-theme");
    document.startViewTransition(apply).finished.finally(() => h.classList.remove("vt-theme"));
  } else apply();
}

/* ---------- chrome: header edition + bottom bar ---------- */
function renderChrome(){
  const t = todayIST(), latest = isLatest();
  $("#ed-label").textContent = st.date === t ? "Today" : fmt(st.date, {weekday:"short", day:"numeric", month:"short"});
  $("#ed-kind").textContent = st.preview ? "Preview" : latest ? "Latest edition" : "Past edition";
  $("#ed-dot").classList.toggle("past", !latest);
  const b = (id, label, icon, color, badge, cur) => `<button data-nav="${esc(id)}" style="${color ? `--cc:${color}` : ""}" aria-current="${cur ? "page" : "false"}"><span class="ic">${icon}${badge ? `<span class="badge num">${badge}</span>` : ""}</span><span class="l">${esc(label)}</span></button>`;
  const nav = $("#nav"), ind = nav.querySelector(".nav-ind") || Object.assign(document.createElement("span"), {className:"nav-ind"});
  nav.innerHTML = b("brief", "Home", ICON.brief, "", 0, st.view !== "cat") +
    secs().map(n => { const c = catInfo(n); return b("c:" + n, c.short, c.icon, c.color, storiesIn(n).filter(isNew).length, st.view === "cat" && st.cat === n); }).join("");
  nav.prepend(ind); placeInd();
}
function placeInd(){
  const nav = $("#nav"), ind = nav.querySelector(".nav-ind"), cur = nav.querySelector('[aria-current="page"] .ic'); if (!ind || !cur) return;
  const n = nav.getBoundingClientRect(), r = cur.getBoundingClientRect(), first = !ind.dataset.ok;
  if (first) ind.style.transition = "none";
  Object.assign(ind.style, {width:r.width + "px", height:r.height + "px", transform:`translate(${r.left - n.left + nav.scrollLeft}px,${r.top - n.top + nav.scrollTop}px)`});
  ind.style.setProperty("--ic", cur.closest("button").style.getPropertyValue("--cc") || "var(--accent)");
  if (first){ ind.dataset.ok = 1; requestAnimationFrame(() => ind.style.transition = ""); }
  const btn = cur.closest("button"); if (nav.scrollWidth > nav.clientWidth) btn.scrollIntoView({inline:"nearest", block:"nearest"});
}
addEventListener("resize", placeInd);

/* ---------- home ---------- */
function renderBrief(){
  const ed = st.ed, gulf = ordered(GULF), others = secs().filter(n => n !== GULF);
  const clips = ed.stories.filter(s => s.clips?.length);
  const hr = +new Date().toLocaleString("en-IN", {hour:"numeric", hour12:false, ...IST});
  const latest = isLatest(), isToday = st.date === todayIST();
  const greet = !latest ? "From the archive" : hr < 12 ? "Good morning" : hr < 17 ? "Good afternoon" : "Good evening";
  const title = isToday ? "Today's brief" : fmt(st.date, {weekday:"long"}) + "'s brief";
  const vs = ed.versions || [], last = vs.at(-1);
  const newCount = ed.stories.filter(isNew).length;
  const unread = ed.stories.filter(s => !isRead(s)).length;
  const outlets = new Set(ed.stories.map(s => s.outlet)).size;
  let i = 0;
  const upd = ed.version > 1 && last && newCount ? `<button class="upd rise" style="--i:${i++}" data-act="read-new"><i></i><span><b>${newCount} new ${newCount === 1 ? "story" : "stories"}</b> · updated ${timeIST(last.at)}</span><em>Read${ICON.next}</em></button>` : "";
  const gulfHTML = gulf.length ? `<div class="hrow gcards" id="gcards">${gulf.map((s, k) => { const v = visual(s); return `
      <button class="gcard rise" style="--i:${i + k}" data-open="${esc(GULF)}" data-i="${k}" data-skey="${esc(s.key || s.id)}">
        <span class="im ${v?.paper ? "paper" : ""}">${v ? img(v.src, 640, "", k ? "" : 'loading="eager" fetchpriority="high"') : ""}</span>
        <span class="tx"><span class="kick"><span class="c" style="--cc:var(--c-gulf)">${esc(s.outlet)}</span>${s.platform ? `<span>${esc(s.platform)}</span>` : ""}${isNew(s) ? `<span class="nwt">New</span>` : ""}</span><h3>${esc(s.title)}</h3></span>
      </button>`; }).join("")}</div>`
    : `<div class="quiet-box"><img src="/logo.png" alt="">No Gulf mentions in this edition.</div>`;
  i += Math.max(1, gulf.length);
  const tops = others.map((n, k) => { const c = catInfo(n), s = leadOf(n), cnt = storiesIn(n).length; return `
      <div class="ts" style="--cc:${c.color}">
        <div class="ts-h"><span class="chip">${c.icon}${esc(c.long)}</span><button class="all" data-nav="c:${esc(n)}" aria-label="All ${cnt} ${esc(c.long)} stories">All ${cnt}${ICON.next}</button></div>
        <button class="ts-b" data-open="${esc(n)}" data-i="0" data-skey="${esc(s.key || s.id)}">
          <span class="t"><h3>${esc(s.title)}</h3><span class="m">${esc(s.outlet)} · ${readMins(s)} min${isNew(s) ? ` <span class="nwt">New</span>` : isRead(s) ? ` · Read` : ""}</span></span>
          ${thumbHTML(s)}
        </button></div>`; }).join("");
  const SHOW = 3;
  const clipHTML = clips.length ? `
      <div class="sh"><h2>Today's clippings</h2><span class="cnt num">${clips.length}</span>${clips.length > SHOW ? `<button class="more" data-view="clips">View all${ICON.next}</button>` : ""}</div>
      <div class="cfeed" id="cfeed">${clips.map((s, k) => clipItem(s, k, k >= SHOW)).join("")}</div>
      ${clips.length > SHOW ? `<button class="showall" data-act="more-clips">Show all ${clips.length} clippings${ICON.down}</button>` : ""}` : "";
  setPage(`
    <div class="mast">
      <div class="tx"><div class="eb">${esc(greet)}</div><h1>${esc(title)}</h1><div class="sub">${ed.stories.length} stories · ${outlets} outlets${latest && !st.preview ? " · " + timeIST(ed.publishedAt || Date.now()) : ""}</div></div>
      <span class="play-wrap"><button class="play" data-act="read-all" aria-label="${unread === ed.stories.length ? "Read the whole brief" : unread ? "Continue reading" : "Read it again"}"><svg class="r" viewBox="0 0 62 62"><circle class="bg" cx="31" cy="31" r="29"/><circle class="fg" cx="31" cy="31" r="29" stroke-dasharray="182.2" stroke-dashoffset="${(182.2 * unread / ed.stories.length).toFixed(1)}"/></svg><span class="disc">${ICON.play}</span></button><small>${unread === ed.stories.length ? "Read all" : unread ? "Continue" : "Again"}</small></span>
    </div>
    ${upd}
    <div class="home-grid">
      <section aria-label="Gulf in the news">
        <div class="sh"><img class="gl" src="/logo.png" alt=""><h2>Gulf in the news</h2>${gulf.length ? `<span class="cnt num">${gulf.length}</span>` : ""}</div>
        ${gulfHTML}
      </section>
      <section aria-label="Top stories">
        ${others.length ? `<div class="sh"><h2>Top stories</h2></div><div class="tops rise" style="--i:${i++}">${tops}</div>` : ""}
      </section>
    </div>
    ${clipHTML}
    <div class="endnote"><img src="/logo.png" alt="">${latest ? "That's today's brief." : "End of this edition."}</div>`, "f");
}

    <div class="cat-h"><span class="ic">${c.icon}</span><h1>${esc(c.long)}</h1><span class="num">${list.length} ${list.length === 1 ? "story" : "stories"}</span></div>
    <div class="scs">${list.map((s, j) => { const r = isRead(s); return `
      <button class="sc rise ${r ? "read" : ""}" style="--i:${Math.min(j, 8)}" data-open="${esc(n)}" data-i="${j}" data-skey="${esc(s.key || s.id)}">
        <span class="sc-h"><span class="t"><span class="kick"><span class="c">${esc(s.outlet)}</span>${s.page ? `<span>${pages(s.page)}</span>` : s.kind !== "print" ? `<span>${KIND[s.kind]}${s.platform ? " · " + esc(s.platform) : ""}</span>` : ""}${isNew(s) ? `<span class="nwt">New</span>` : ""}</span><h3>${esc(s.title)}</h3></span>${thumbHTML(s)}</span>
        <span class="cx">${hl(s.summary)}</span>

/* ---------- clippings ---------- */
function renderClips(){
  const l = st.ed.stories.filter(s => s.clips?.length);
  setPage(`<div class="cat-h" style="--cc:var(--c-infra)"><span class="ic">${ICON.clip}</span><h1>Clippings</h1><span class="num">${l.length} cut-outs</span></div>
    <div class="cfeed">${l.map((s, k) => clipItem(s, k, false)).join("")}</div>`, "f");
}

function setPage(html, anim){
  const p = $("#page");
  p.innerHTML = html;
  p.style.transform = "";
  p.classList.toggle("still", !!st.quiet);
  p.classList.remove("enter-r", "enter-l", "enter-f"); void p.offsetWidth;
  if (!reduce && anim && !st.quiet && !st.vt) p.classList.add("enter-" + anim);
  settleImgs(p);
}
function render(dir, quiet){
  st.quiet = !!quiet;
  renderChrome();
  if (st.view === "cat" && !secs().includes(st.cat)) st.view = "brief";
  if (st.view === "brief") renderBrief(); else if (st.view === "cat") renderCat(dir); else renderClips();
}

/* ---------- navigation with real history (back gesture stays in the app) ---------- */
function viewHash(){ return st.view === "cat" ? slug(st.cat) : st.view === "clips" ? "clips" : "brief"; }
function swap(fn, dir){
  if (document.startViewTransition && !reduce){
    const h = document.documentElement; h.dataset.dir = dir > 0 ? "r" : dir < 0 ? "l" : "f"; h.classList.add("vt-nav");
    st.vt = true;
    document.startViewTransition(() => { fn(); st.vt = false; }).finished.finally(() => h.classList.remove("vt-nav"));
  } else fn();
}
function go(view, cat, {push = true, dir = 0} = {}){
  const was = st.view; $("#top").classList.remove("hide");
  st.view = view; st.cat = cat || null;
  const state = {v:view, c:st.cat};
  if (push && was === "brief" && view !== "brief") history.pushState(state, "", "#" + viewHash());
  else if (view === "brief" && history.state?.v && history.state.v !== "brief" && push) { history.back(); return; }
  else history.replaceState(state, "", "#" + viewHash());
  swap(() => { render(dir); window.scrollTo(0, 0); }, dir); buzz(5);
}
window.addEventListener("popstate", e => {
  const s = e.state || {};
  if ($(".lightbox") && !s.lb) { $(".lightbox").remove(); if (!$(".story")) unlock(); return; }
  if ($(".sheet") && !s.sheet) { closeLayer(); return; }
  if ($(".story") && !s.story) { closeStory(true); return; }
  if ($(".story")) return;
  if (!st.ed) return;
  const v = s.v || "brief";
  if (v !== st.view || s.c !== st.cat){ st.view = v; st.cat = s.c || null; swap(() => { render(0); window.scrollTo(0, 0); }, -1); }
});
function pushOverlay(flag){ history.pushState({...(history.state || {v:st.view, c:st.cat}), [flag]:true}, ""); }

let lockY = 0;
function lock(){ if (document.body.classList.contains("locked")) return; lockY = window.scrollY; document.body.style.top = -lockY + "px"; document.body.classList.add("locked"); }
function unlock(){ if (!document.body.classList.contains("locked")) return; document.body.classList.remove("locked"); document.body.style.top = ""; window.scrollTo(0, lockY); }

/* ---------- story reader: sectors flow into each other ---------- */
function openStory(sec, i, fromEl){
  const fresh = !$(".story");
  st.story = {sec, i};
  if (fresh){
    pushOverlay("story"); lock();
    $("#layer").innerHTML = `<div class="story" id="story" role="dialog" aria-modal="true" style="--ts:${SIZES[store.get("gp-ts") || 0]}"></div>`;
    const box = $("#story"), r = fromEl?.getBoundingClientRect();
    if (r && !reduce && r.width){
      box.style.animation = "none";
      const W = innerWidth, H = innerHeight;
      box.animate([{clipPath:`inset(${r.top}px ${W - r.right}px ${H - r.bottom}px ${r.left}px round 20px)`, opacity:.6}, {clipPath:"inset(0px 0px 0px 0px round 0px)", opacity:1}], {duration:460, easing:"cubic-bezier(.22,.8,.25,1)"});
    }
  }
  paintStory(0);
}
function neighbour(d){
  const {sec, i} = st.story, order = secs(), list = ordered(sec), si = order.indexOf(sec);
  if (d > 0){
    if (list[i + 1]) return {label:"Up next", title:list[i + 1].title, color:catInfo(sec).color};
    const ns = order[si + 1];
    if (ns) return {label:"Next · " + catInfo(ns).short, title:`${storiesIn(ns).length} ${catInfo(ns).long} ${storiesIn(ns).length === 1 ? "story" : "stories"}`, color:catInfo(ns).color};
    return {label:"Finish", title:"You're all caught up", color:"var(--accent)"};
  }
  if (i > 0) return {label:"Previous", title:list[i - 1].title, color:catInfo(sec).color};
  const ps = order[si - 1];
  if (ps){ const pl = ordered(ps); return {label:"Back · " + catInfo(ps).short, title:pl[pl.length - 1].title, color:catInfo(ps).color}; }
  return null;
}
function storyPageHTML(){
  const {sec, i} = st.story, list = ordered(sec), s = list[i], c = catInfo(sec);
  markRead(s);
  const v = visual(s);
  const paras = (s.fullText || "").split(/\n+/).map(p => p.trim()).filter(Boolean);
  const facts = [s.outlet, s.edition && s.edition.split(",")[0], pages(s.page), s.author && s.author !== "Bureau" ? "By " + s.author : null, fmt(s.date || st.date, {day:"numeric", month:"short"}), readMins(s) + " min read"].filter(Boolean);
  const media = s.clips?.length ? s.clips : (s.image ? [s.image] : []);
  const pv = neighbour(-1), nx = neighbour(1);
  return `<div class="st-page" style="--cc:${c.color}">
    <div class="st-top">
      <div class="prog">${list.map((x, k) => `<button class="${k < i ? "d" : k === i ? "c" : ""}" data-act="jump" data-k="${k}" aria-label="Story ${k + 1}: ${esc(x.title)}"><i></i></button>`).join("")}</div>
      <div class="st-ctl"><button class="rb" data-act="close" aria-label="Close">${ICON.down}</button>
        <span class="st-lbl"><span class="pos num"><span><i></i>${esc(c.short)} · ${i + 1}/${list.length}</span></span><span class="mini">${esc(s.title)}</span></span>
        <button class="rb aa" data-act="size" aria-label="Text size">Aa</button></div>
    </div>
    <div class="st-scroll">
      <div class="st-hero ${v?.paper ? "paper" : ""}">${v ? img(v.src, 1080, "", 'loading="eager"') : `<div class="gen">${c.icon}</div>`}</div>
      <div class="st-body gut">
        <span class="kick"><span class="c">${esc(c.long)}</span><span>${KIND[s.kind]}${s.platform ? " · " + esc(s.platform) : ""}</span>${st.ed.version > 1 && s.firstVersion === st.ed.version ? `<span class="nwt">New</span>` : ""}</span>
        <h1>${esc(s.title)}</h1>
        <div class="meta">${facts.map(esc).join('<i aria-hidden="true">·</i>')}</div>
        <div class="crux"><span class="lab">The crux</span><p>${hl(s.summary)}</p></div>
        <div class="links"><a href="${esc(s.url)}" target="_blank" rel="noopener">${s.kind === "print" ? "Open in media tracker" : "Open on " + esc(s.platform || s.outlet)} ↗</a>${(s.alsoOn || []).map(a => `<a href="${esc(a.url)}" target="_blank" rel="noopener">Also on ${esc(a.label)} ↗</a>`).join("")}</div>
        <div class="full"><div class="in">${paras.map(p => `<p>${hl(p)}</p>`).join("")}</div></div>
        <div class="pager2 ${pv ? "" : "one"}">
          ${pv ? `<button class="pg pv" data-act="prev" style="--nc:${pv.color}"><small>${ICON.prev}${esc(pv.label)}</small><b>${esc(pv.title)}</b></button>` : ""}
          <button class="pg nx" data-act="next" style="--nc:${nx.color}"><small>${esc(nx.label)}${ICON.next}</small><b>${esc(nx.title)}</b></button></div>
      </div>
    </div>
    <div class="act">
      ${paras.length ? `<button class="p" data-act="full" aria-expanded="false">${ICON.read}<span>Full story</span></button>` : `<a class="p" href="${esc(s.url)}" target="_blank" rel="noopener">${ICON.out}<span>${s.kind === "print" ? "Source" : esc(s.platform || "Source")}</span></a>`}
      <button data-act="clip" ${media.length ? "" : "disabled"}>${ICON.clip}<span>${s.clips?.length ? "Clipping" : "Image"}</span></button>
      <button data-act="share">${ICON.share}<span>Share</span></button>
    </div>
    <span class="edge-hint l">${ICON.prev}</span><span class="edge-hint r">${ICON.next}</span>
    ${pv ? `<button class="tap-nav l" data-act="prev" aria-label="Previous story">${ICON.prev}</button>` : ""}
    <button class="tap-nav r" data-act="next" aria-label="Next story">${ICON.next}</button>
  </div>`;
}
function journeyHTML(curSec){
  const order = secs(), ci = curSec == null ? order.length : order.indexOf(curSec);
  return `<div class="journey" aria-hidden="true">${order.map((n, k) => { const c = catInfo(n); return `${k ? "<i></i>" : ""}<span class="${k < ci ? "dn" : k === ci ? "cur" : ""}" style="--cc2:${c.color}">${k < ci ? ICON.check : c.icon}</span>`; }).join("")}</div>`;
}
function interHTML(kind){
  if (kind === "end"){
    const n = st.ed.stories.filter(isRead).length;
    return `<div class="st-page" style="--cc:var(--accent)"><div class="inter">
    <button class="rb close" data-act="close" aria-label="Close">${ICON.down}</button>
    ${journeyHTML(null)}
    <span class="burst"><i></i><i></i><img src="/logo-lg.png" alt=""></span>
    <small>That's the brief</small><h2>You're all caught up</h2>
    <p>${n} of ${st.ed.stories.length} stories read. ${st.ed.version > 1 ? "We'll notify you if another update lands today." : "We'll notify you when the next edition is out."}</p>
    <div class="btns"><button class="btn1" data-act="close">Back to home</button><button class="btn2" data-act="prev">Back to the last story</button></div></div></div>`;
  }
  const ns = st.story.nextSec, c = catInfo(ns), lead = leadOf(ns), prevC = catInfo(st.story.sec);
  return `<div class="st-page" style="--cc:${c.color}"><div class="inter">
    <button class="rb close" data-act="close" aria-label="Close">${ICON.down}</button>
    <span class="done">${ICON.check}${esc(prevC.long)} done</span>
    ${journeyHTML(ns)}
    <span class="big">${c.icon}</span>
    <small>Up next</small><h2>${esc(c.long)}</h2>
    <p>${storiesIn(ns).length} ${storiesIn(ns).length === 1 ? "story" : "stories"} in this edition</p>
    <div class="lead-line">${esc(lead.title)}</div>
    <div class="btns"><button class="btn1" data-act="continue">${reduce ? "" : '<span class="fill"></span>'}<span style="position:relative">Continue</span>${ICON.arrow}</button><button class="btn2" data-act="close">Back to home</button></div></div></div>`;
}
let autoTimer = null;
function paintStory(dir){
  clearTimeout(autoTimer);
  const box = $("#story"); if (!box) return;
  const html = st.story.inter ? interHTML(st.story.inter) : storyPageHTML();
  const old = box.firstElementChild;
  box.insertAdjacentHTML("beforeend", html);
  const neu = box.lastElementChild;
  if (old && dir && !reduce){
    neu.animate([{transform:`translateX(${dir * 100}%)`}, {transform:"none"}], {duration:320, easing:"cubic-bezier(.22,.8,.25,1)"});
    const a = old.animate([{transform:old.style.transform || "none"}, {transform:`translateX(${-dir * 30}%)`, opacity:.4}], {duration:320, easing:"cubic-bezier(.22,.8,.25,1)"});
    a.onfinish = () => old.remove();
  } else if (old) old.remove();
  if (st.story.inter === "sec" && !reduce) autoTimer = setTimeout(() => { if (st.story?.inter === "sec") step(1); }, 4000);
  settleImgs(neu);
  const sc = neu.querySelector(".st-scroll"), hero = neu.querySelector(".st-hero"), h1 = neu.querySelector(".st-body h1");
  if (sc) sc.addEventListener("scroll", () => {
    const y = sc.scrollTop;
    if (hero && !reduce && y < 500){ hero.style.transform = `translateY(${y * .4}px)`; hero.style.opacity = Math.max(.2, 1 - y / 450); }
    neu.classList.toggle("scrolled", !!h1 && y > h1.offsetTop + h1.offsetHeight - 70);
    neu.classList.add("reading"); clearTimeout(neu._rt); neu._rt = setTimeout(() => neu.classList.remove("reading"), 700);
  }, {passive:true});
  neu.querySelector("[data-act=close]")?.focus({preventScroll:true});
}
function step(d){
  const s = st.story; if (!s) return;
  clearTimeout(autoTimer);
  const order = secs();
  if (s.inter === "sec"){
    if (d > 0){ st.story = {sec:s.nextSec, i:0}; buzz(10); return paintStory(1); }
    st.story = {sec:s.sec, i:ordered(s.sec).length - 1}; return paintStory(-1);
  }
  if (s.inter === "end"){ if (d < 0){ const ls = order.at(-1); st.story = {sec:ls, i:ordered(ls).length - 1}; return paintStory(-1); } return closeStory(); }
  const list = ordered(s.sec), n = s.i + d;
  if (n >= 0 && n < list.length){ st.story = {sec:s.sec, i:n}; buzz(4); return paintStory(d); }
  const si = order.indexOf(s.sec);
  if (d > 0){ const ns = order[si + 1]; st.story = ns ? {sec:s.sec, i:s.i, inter:"sec", nextSec:ns} : {sec:s.sec, i:s.i, inter:"end"}; buzz(12); return paintStory(1); }
  const ps = order[si - 1];
  if (ps){ st.story = {sec:ps, i:ordered(ps).length - 1}; return paintStory(-1); }
  bounce(-1);
}
function jump(k){ const s = st.story; if (!s || s.inter || k === s.i) return; const d = Math.sign(k - s.i); st.story = {sec:s.sec, i:k}; buzz(4); paintStory(d); }
function bounce(d){ const p = $("#story .st-page:last-child"); if (p && !reduce) p.animate([{transform:"none"}, {transform:`translateX(${-d * 18}px)`}, {transform:"none"}], {duration:260, easing:"ease-out"}); }
function closeStory(fromPop, how){
  const el = $("#story"); if (!el || el.dataset.closing) return;
