<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Gulf Pulse</title>
<meta name="description" content="Daily media brief for Gulf Oil Lubricants India.">
<meta name="theme-color" content="#050917">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gulf Pulse">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<script src="/config.js"></script>
<style>
/* Glance → Choose → Read, built for one thumb.
   Brief (one screen) → category list (swipe sideways between categories) → story
   (swipe sideways to move on, down to close; sections flow into each other). Dark only. */
:root{
  /* brand */
  --navy:#192C76; --orange:#FF7403; --sky:#93DAFE;
  /* surfaces: deep navy, layered */
  --bg:#050917; --s1:#0B1230; --s2:#111A42; --s3:#18235A;
  --line:rgba(147,218,254,.12); --line-2:rgba(147,218,254,.22);
  --fg:#F3F6FF; --fg-2:#B9C4E6; --muted:#7E8BB6; --ink:#050917;
  /* categories: brand blues; orange is reserved for Gulf and for actions */
  --c-gulf:#FF7403; --c-infra:#93DAFE; --c-oil:#5B8DFF; --c-auto:#C9D6FF; --c-other:#9FB0E0;
  --f-d:"Montserrat","Arial Black",system-ui,sans-serif;
  --f-b:"Helvetica Neue","Inter",Helvetica,Arial,system-ui,sans-serif;
  --f-s:"Newsreader",Georgia,"Times New Roman",serif;
  --ease:cubic-bezier(.22,.8,.25,1); --spring:cubic-bezier(.34,1.45,.64,1);
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  --nav-h:66px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--f-b);-webkit-font-smoothing:antialiased;min-height:100dvh;overflow-x:hidden;overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
a{color:inherit;-webkit-touch-callout:none}
img{display:block;max-width:100%;-webkit-user-drag:none;-webkit-touch-callout:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--orange);outline-offset:3px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
body.locked{position:fixed;left:0;right:0;overflow:hidden}

/* ambient light (fixed, never moves with overscroll) */
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--bg)}
.aurora i{position:absolute;border-radius:50%;will-change:transform}
.aurora i:nth-child(1){width:110vmax;height:110vmax;left:-45vmax;top:-60vmax;background:radial-gradient(closest-side,rgba(25,44,118,.85),transparent);animation:d1 30s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:70vmax;height:70vmax;right:-40vmax;top:35vh;background:radial-gradient(closest-side,rgba(255,116,3,.10),transparent);animation:d2 36s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(12vw,10vh)}}
@keyframes d2{to{transform:translate(-14vw,-12vh)}}

/* intro (1 s, once a day) */
.intro{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:var(--bg);clip-path:circle(150% at var(--ox,50%) var(--oy,50%));transition:clip-path .65s cubic-bezier(.7,0,.2,1)}
.intro.out{clip-path:circle(0% at var(--ox,50%) var(--oy,50%))}
.intro img{width:min(40vw,160px);animation:pop .7s var(--spring) both;filter:drop-shadow(0 16px 40px rgba(255,116,3,.35))}
.intro svg{position:absolute;width:min(66vw,270px);height:auto;animation:spin 3s linear infinite}
.intro circle{fill:none;stroke-linecap:round;stroke-dasharray:var(--l);stroke-dashoffset:var(--l);animation:draw .9s var(--ease) forwards}
@keyframes pop{from{transform:scale(.4) rotate(-20deg);opacity:0}}
@keyframes draw{to{stroke-dashoffset:calc(var(--l) * .4)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* header */
.top{position:fixed;z-index:40;left:0;right:0;top:0;padding-top:var(--top);background:rgba(5,9,23,.78);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border-bottom:1px solid var(--line);transition:transform .3s var(--ease)}
.bar{display:flex;align-items:center;gap:10px;height:58px;max-width:1100px;margin:0 auto}
.bar .logo{width:34px;height:auto;flex:none}
.brand{min-width:0}
.brand b{display:block;font:800 17px/1 var(--f-d);letter-spacing:-.01em}
.brand b em{font-style:normal;color:var(--orange)}
.brand span{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.live{width:6px;height:6px;border-radius:50%;background:var(--orange);flex:none;animation:ping 2s infinite}
.live.off{background:var(--muted);animation:none}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,116,3,.6)}70%{box-shadow:0 0 0 7px rgba(255,116,3,0)}100%{box-shadow:0 0 0 0 rgba(255,116,3,0)}}
.pill-btn{margin-left:auto;display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;background:var(--s2);border:1px solid var(--line);font:700 12.5px/1 var(--f-d);white-space:nowrap}
.pill-btn svg{width:14px;height:14px;color:var(--muted)}
.icon-btn{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--s2);border:1px solid var(--line)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.on{color:var(--orange);border-color:rgba(255,116,3,.45)}
.icon-btn .pip{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--orange);transform:translate(9px,-9px);box-shadow:0 0 0 2px var(--bg)}

/* pull to refresh */
.ptr{position:fixed;z-index:39;left:50%;top:calc(var(--top) + 64px);width:38px;height:38px;margin-left:-19px;border-radius:50%;display:grid;place-items:center;background:var(--s2);border:1px solid var(--line-2);box-shadow:0 10px 26px -10px #000;opacity:0;transform:translateY(-30px) scale(.6);pointer-events:none}
.ptr img{width:24px}
.ptr.spin img{animation:spin .8s linear infinite}

/* bottom nav */
.nav{position:fixed;z-index:45;left:0;right:0;bottom:0;display:flex;justify-content:space-around;
  padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + var(--bot)) max(6px,env(safe-area-inset-left,0px));
  background:rgba(5,9,23,.86);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border-top:1px solid var(--line)}
.nav button{position:relative;flex:1;min-width:0;max-width:100px;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font:700 10.5px/1.1 var(--f-d)}
.nav .ic{position:relative;display:grid;place-items:center;width:52px;height:30px;border-radius:15px;transition:background .25s var(--ease)}
.nav svg{width:22px;height:22px;transition:transform .35s var(--spring)}
.nav span.l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nav button[aria-current="page"]{color:#fff}
.nav button[aria-current="page"] .ic{background:color-mix(in srgb,var(--cc,var(--orange)) 22%,transparent)}
.nav button[aria-current="page"] svg{color:var(--cc,var(--orange));transform:scale(1.06)}
.nav button:active svg{transform:scale(.88)}
.nav .badge{position:absolute;top:-3px;right:4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--orange);color:var(--ink);font:800 9.5px/16px var(--f-d);box-shadow:0 0 0 2px var(--bg)}

main{max-width:1100px;margin:0 auto;padding-top:calc(var(--top) + 58px);padding-bottom:calc(var(--nav-h) + var(--bot) + 24px);min-height:100dvh;touch-action:pan-y}
.page{will-change:transform}
.enter-r{animation:inR .38s var(--ease)} .enter-l{animation:inL .38s var(--ease)} .enter-f{animation:inF .4s var(--ease)}
@keyframes inR{from{transform:translateX(40px);opacity:.3}} @keyframes inL{from{transform:translateX(-40px);opacity:.3}} @keyframes inF{from{transform:translateY(10px);opacity:0}}

/* brief */
.greet{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:10px 0 8px}
.greet h1{margin:0;font:800 clamp(23px,6.4vw,30px)/1.1 var(--f-d);letter-spacing:-.025em}
.greet span{font:600 12.5px/1 var(--f-d);color:var(--muted);white-space:nowrap}
.upd{display:flex;align-items:center;gap:10px;margin-top:14px;padding:9px 12px;border-radius:12px;background:rgba(255,116,3,.1);border:1px solid rgba(255,116,3,.28);font-size:13px;color:#ffd7b5}
.upd i{width:7px;height:7px;border-radius:50%;background:var(--orange);flex:none}
.upd b{color:#fff;font-weight:600}
.spot-row{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-right:calc(-1 * max(20px,env(safe-area-inset-right,0px)));padding-right:max(20px,env(safe-area-inset-right,0px));overscroll-behavior-x:contain}
.spot-row::-webkit-scrollbar{display:none}
.spot-card{position:relative;flex:0 0 calc(100% - 26px);scroll-snap-align:start;scroll-snap-stop:always;height:min(32vw,190px);border-radius:20px;overflow:hidden;isolation:isolate;background:var(--navy);text-align:left;transition:transform .2s var(--ease)}
.spot-card:only-child{flex-basis:100%}
.spot-card:active{transform:scale(.98)}
.spot-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.spot-card::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(5,9,23,.05) 0%,rgba(5,9,23,.3) 35%,rgba(5,9,23,.94) 88%)}
.spot-card .tx{position:absolute;left:14px;right:14px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.spot-card h3{margin:0;font:700 16.5px/1.22 var(--f-d);letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.spot-card .meta{font-size:12px;color:var(--fg-2)}
.flag{align-self:flex-start;padding:5px 8px;border-radius:7px;background:var(--orange);color:var(--ink);font:800 10px/1 var(--f-d);letter-spacing:.1em;text-transform:uppercase}
.nw{display:inline-block;padding:3px 6px;border-radius:5px;background:var(--orange);color:var(--ink);font:800 9.5px/1.2 var(--f-d);letter-spacing:.04em}
.spot-card .nw{position:absolute;top:12px;right:12px}
.dots{display:flex;gap:5px;justify-content:center;margin-top:6px}
.dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.22);transition:all .3s var(--ease)}
.dots i.on{width:18px;background:var(--orange)}
.quiet{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:18px;background:var(--s1);border:1px solid var(--line);color:var(--fg-2);font-size:14px}
.quiet img{width:28px}
.eyebrow{display:flex;align-items:center;justify-content:space-between;font:800 10.5px/1 var(--f-d);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:10px 0 7px}
.eyebrow span{letter-spacing:.02em;text-transform:none;font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tile{position:relative;display:flex;flex-direction:column;gap:5px;min-height:96px;padding:10px 12px;border-radius:18px;background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--cc) 14%,transparent),transparent 60%),var(--s1);border:1px solid var(--line);text-align:left;overflow:hidden;transition:transform .2s var(--ease),border-color .3s}
.tile:active{transform:scale(.97)}
.tile .hd{display:flex;align-items:center;gap:7px;font:700 13px/1.1 var(--f-d)}
.tile .hd svg{width:18px;height:18px;color:var(--cc);flex:none}
.tile .n{margin-left:auto;font:800 22px/1 var(--f-d);letter-spacing:-.02em}
.tile p{margin:0;font:500 12.5px/1.38 var(--f-b);color:var(--fg-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stack{display:flex;margin-top:auto;padding-top:2px}
.stack span{width:22px;height:27px;border-radius:3px;background:#ebe5d8;border:2px solid var(--s1);margin-left:-8px;overflow:hidden;transform:rotate(-5deg);box-shadow:0 6px 12px -6px #000}
.stack span:first-child{margin-left:0} .stack span:nth-child(2){transform:rotate(2deg)} .stack span:nth-child(3){transform:rotate(-1deg)}
.stack span img{width:100%;height:100%;object-fit:cover;object-position:top}
.tile .nw{position:absolute;right:12px;bottom:12px}
.tile.wide{grid-column:1/-1;min-height:0}
.read-all{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:10px;height:46px;border-radius:16px;background:var(--orange);color:var(--ink);font:800 14px/1 var(--f-d);box-shadow:0 14px 30px -14px rgba(255,116,3,.7);transition:transform .2s var(--ease)}
.read-all:active{transform:scale(.98)}
.read-all svg{width:18px;height:18px}
.foot{margin:18px 0 0;text-align:center;color:var(--muted);font-size:12px}

/* category */
.cat-h{display:flex;align-items:center;gap:10px;margin:16px 0 12px}
.cat-h .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--cc) 18%,transparent);color:var(--cc);flex:none}
.cat-h .ic svg{width:19px;height:19px}
.cat-h h1{margin:0;font:800 clamp(23px,6.4vw,32px)/1 var(--f-d);letter-spacing:-.025em}
.cat-h span{margin-left:auto;font:600 12.5px/1.2 var(--f-d);color:var(--muted);white-space:nowrap}
.cat-dots{display:flex;gap:5px;justify-content:center;margin:-2px 0 12px}
.cat-dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.18)}
.cat-dots i.on{width:16px;background:var(--cc)}
.lead{position:relative;display:block;width:100%;height:min(48vw,210px);border-radius:20px;overflow:hidden;isolation:isolate;background:var(--navy);text-align:left;margin-bottom:8px;transition:transform .2s var(--ease)}
.lead:active{transform:scale(.985)}
.lead img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;z-index:-2}
.lead.paper img{filter:grayscale(1) contrast(1.1);mix-blend-mode:luminosity;opacity:.55}
.lead::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(5,9,23,0) 15%,rgba(5,9,23,.94) 82%)}
.lead .tx{position:absolute;left:16px;right:16px;bottom:14px;display:flex;flex-direction:column;gap:6px}
.lead h2{margin:0;font:700 clamp(18px,5vw,23px)/1.2 var(--f-d);letter-spacing:-.015em;text-wrap:balance}
.lead .nw{position:absolute;top:14px;right:14px}
.kick{font:700 10.5px/1.3 var(--f-d);letter-spacing:.07em;text-transform:uppercase;color:var(--sky)}
.kick em{font-style:normal;color:var(--muted);letter-spacing:.03em}
.rows{display:grid;gap:6px}
.row{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:72px;padding:8px 12px 8px 8px;border-radius:16px;background:var(--s1);border:1px solid var(--line);text-align:left;transition:transform .15s var(--ease),background .2s}
.row:active{transform:scale(.985);background:var(--s2)}
.row .th{flex:none;width:44px;height:54px;border-radius:4px;overflow:hidden;background:#ebe5d8;transform:rotate(2deg);box-shadow:0 8px 16px -10px #000}
.row .th.photo{border-radius:10px;transform:none}
.row .th.none{display:grid;place-items:center;background:var(--s2);color:var(--muted);transform:none;border-radius:10px}
.row .th.none svg{width:20px;height:20px}
.row .th img{width:100%;height:100%;object-fit:cover;object-position:top}
.row .tx{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.row h3{margin:0;font:700 14px/1.3 var(--f-d);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.row .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--orange);box-shadow:0 0 10px var(--orange)}
.row.read h3{color:var(--muted);font-weight:600}
.row.read .th{opacity:.55}
.row .check{flex:none;width:18px;height:18px;color:var(--muted)}
.next-cat{display:flex;align-items:center;gap:12px;width:100%;margin-top:14px;padding:14px;border-radius:18px;background:var(--s2);border:1px solid var(--line-2);text-align:left}
.next-cat .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--cc) 18%,transparent);color:var(--cc);flex:none}
.next-cat .ic svg{width:20px;height:20px}
.next-cat small{display:block;font:700 10px/1 var(--f-d);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.next-cat b{display:block;margin-top:5px;font:700 15px/1.2 var(--f-d)}
.next-cat>svg{width:20px;height:20px;margin-left:auto;color:var(--fg-2)}
.swipe-hint{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:12px;font-size:11.5px;color:var(--muted)}
.swipe-hint svg{width:14px;height:14px}

/* clippings */
.wall{columns:2 150px;column-gap:10px}
.clip{break-inside:avoid;display:block;width:100%;margin:0 0 10px;background:#ebe5d8;border-radius:4px;overflow:hidden;position:relative;box-shadow:0 20px 30px -20px #000;transition:transform .2s var(--ease)}
.clip:active{transform:scale(.97)}
.clip img{width:100%;height:auto;min-height:80px}
.clip span{position:absolute;inset:auto 0 0;padding:22px 9px 8px;background:linear-gradient(transparent,rgba(5,9,23,.92));font:700 10.5px/1.25 var(--f-d);color:#fff;text-align:left}

/* story */
.story{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:hidden;animation:stIn .38s var(--ease)}
@keyframes stIn{from{transform:translateY(40px);opacity:0}}
.st-page{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);will-change:transform}
.st-top{position:absolute;z-index:3;left:0;right:0;top:0;padding:calc(8px + var(--top)) max(12px,env(safe-area-inset-right,0px)) 16px max(12px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(5,9,23,.9),rgba(5,9,23,.55) 65%,rgba(5,9,23,0));display:flex;flex-direction:column;gap:9px}
.prog{display:flex;gap:3px}
.prog i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.2)}
.prog i.d{background:rgba(255,255,255,.75)} .prog i.c{background:var(--orange)}
.st-ctl{display:flex;gap:8px;align-items:center}
.rb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(5,9,23,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);flex:none}
.rb svg{width:18px;height:18px}
.st-ctl .pos{display:flex;align-items:center;gap:7px;margin-right:auto;font:700 12.5px/1 var(--f-d);color:var(--fg-2)}
.st-ctl .pos i{width:8px;height:8px;border-radius:50%;background:var(--cc)}
.st-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding-bottom:calc(84px + var(--bot))}
.st-hero{position:relative;height:30vh;min-height:190px;max-height:330px;overflow:hidden;background:var(--navy);isolation:isolate}
.st-hero img{width:100%;height:100%;object-fit:cover;object-position:top;animation:kb 16s ease-out both}
.st-hero.paper img{filter:grayscale(1) contrast(1.15);mix-blend-mode:luminosity;opacity:.6}
.st-hero .gen{position:absolute;inset:0;display:grid;place-items:center;font:800 min(24vw,170px)/1 var(--f-d);color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.28);background:radial-gradient(circle at 30% 30%,rgba(147,218,254,.25),transparent 55%),var(--navy)}
@keyframes kb{from{transform:scale(1.12)}}
.st-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,var(--bg))}
.st-body{max-width:700px;margin:-34px auto 0;position:relative;display:flex;flex-direction:column;gap:14px}
.st-body h1{margin:0;font:800 clamp(22px,6.2vw,32px)/1.15 var(--f-d);letter-spacing:-.02em;text-wrap:balance;overflow-wrap:anywhere}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.facts span,.facts a{padding:5px 10px;border-radius:999px;background:var(--s2);border:1px solid var(--line);font-size:12px;color:var(--fg-2);text-decoration:none}
.facts a{color:var(--sky)}
.crux{position:relative;padding:16px 16px 16px 19px;border-radius:18px;background:linear-gradient(135deg,rgba(255,116,3,.13),rgba(255,116,3,.02) 70%),var(--s1);border:1px solid rgba(255,116,3,.26)}
.crux::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--orange)}
.crux .lab{font:800 10.5px/1 var(--f-d);letter-spacing:.18em;text-transform:uppercase;color:var(--orange)}
.crux p{margin:8px 0 0;font:500 17px/1.55 var(--f-b);color:#fff}
mark{background:rgba(255,116,3,.3);color:#fff;border-radius:4px;padding:0 3px}
.full{overflow:hidden;max-height:0;transition:max-height .6s var(--ease)}
.full.open{max-height:var(--h,8000px)}
.full .in{padding-top:4px;font-size:16.5px;line-height:1.72;color:var(--fg-2)}
.full .in p{margin:0 0 14px}
.next{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--s1);border:1px solid var(--line);width:100%;text-align:left}
.next .th{flex:none;width:50px;height:50px;border-radius:10px;overflow:hidden;background:var(--navy)}
.next .th img{width:100%;height:100%;object-fit:cover;object-position:top}
.next small{display:block;font:800 10px/1 var(--f-d);letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}
.next b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:5px;font:700 14px/1.3 var(--f-d)}
.next>svg{flex:none;width:20px;height:20px;margin-left:auto;color:var(--orange)}
.act{position:absolute;z-index:3;left:0;right:0;bottom:0;display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:8px;padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + var(--bot)) max(12px,env(safe-area-inset-left,0px));background:rgba(5,9,23,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.act button,.act a{display:flex;align-items:center;justify-content:center;gap:7px;height:48px;border-radius:14px;background:var(--s2);border:1px solid var(--line);font:700 13px/1 var(--f-d);text-decoration:none;white-space:nowrap;transition:transform .15s var(--ease)}
.act button:active,.act a:active{transform:scale(.96)}
.act .p{background:#fff;color:var(--navy);border-color:#fff}
.act svg{width:16px;height:16px;flex:none}
.act button:disabled{opacity:.35}
.edge-hint{position:absolute;z-index:2;top:50%;width:44px;height:44px;margin-top:-22px;border-radius:50%;display:grid;place-items:center;background:var(--s2);border:1px solid var(--line-2);opacity:0;pointer-events:none}
.edge-hint svg{width:20px;height:20px}
.edge-hint.l{left:10px} .edge-hint.r{right:10px}

/* section interstitial */
.inter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(40px + var(--top)) 28px calc(40px + var(--bot));text-align:center;background:radial-gradient(90% 60% at 50% 35%,color-mix(in srgb,var(--cc) 22%,transparent),transparent 70%),var(--bg)}
.inter .done{display:flex;align-items:center;gap:8px;font:700 13px/1 var(--f-d);color:var(--fg-2)}
.inter .done svg{width:18px;height:18px;color:#6EE7A8}
.inter .big{width:84px;height:84px;border-radius:26px;display:grid;place-items:center;background:color-mix(in srgb,var(--cc) 20%,transparent);color:var(--cc);animation:pop .55s var(--spring) both}
.inter .big svg{width:42px;height:42px}
.inter .big img{width:64px}
.inter small{font:800 11px/1 var(--f-d);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.inter h2{margin:-4px 0 0;font:800 30px/1.1 var(--f-d);letter-spacing:-.025em}
.inter p{margin:0;max-width:30ch;color:var(--fg-2);font-size:15px}
.inter .lead-line{max-width:34ch;padding:12px 14px;border-radius:14px;background:var(--s1);border:1px solid var(--line);font:600 14px/1.35 var(--f-d);color:#fff}
.inter .btns{display:grid;gap:8px;width:min(100%,320px);margin-top:8px}
.inter .btn1{height:52px;border-radius:16px;background:var(--orange);color:var(--ink);font:800 15px/1 var(--f-d);display:flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden}
.inter .btn1 svg{width:18px;height:18px}
.inter .btn1 .fill{position:absolute;inset:0;background:rgba(255,255,255,.25);transform-origin:left;transform:scaleX(0);animation:fill 4s linear forwards}
@keyframes fill{to{transform:scaleX(1)}}
.inter .btn2{height:48px;border-radius:16px;background:var(--s2);border:1px solid var(--line);font:700 14px/1 var(--f-d)}
.inter .close{position:absolute;top:calc(10px + var(--top));left:max(12px,env(safe-area-inset-left,0px))}

/* lightbox with pinch / double-tap zoom */
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(2,4,14,.97);display:flex;flex-direction:column;animation:fade .2s both;touch-action:none}
@keyframes fade{from{opacity:0}}
.lb-top{position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:calc(8px + var(--top)) 12px 8px;font:700 13px/1.2 var(--f-d)}
.lb-top span{color:var(--fg-2)}
.lb-stage{flex:1;position:relative;overflow:hidden}
.lb-stage img{position:absolute;left:50%;top:0;width:min(100%,900px);height:auto;background:#ebe5d8;transform-origin:0 0;will-change:transform}
.lb-tip{position:absolute;z-index:2;left:50%;bottom:calc(18px + var(--bot));transform:translateX(-50%);padding:8px 14px;border-radius:999px;background:rgba(17,26,66,.9);font:600 12px/1 var(--f-d);color:var(--fg-2);white-space:nowrap;animation:fade .3s both,tipOut .4s ease 2.6s forwards}
@keyframes tipOut{to{opacity:0}}
.lb-pages{position:absolute;z-index:2;left:0;right:0;bottom:calc(60px + var(--bot));display:flex;justify-content:center;gap:6px}
.lb-pages button{padding:7px 12px;border-radius:999px;background:var(--s2);border:1px solid var(--line);font:700 12px/1 var(--f-d)}
.lb-pages button.on{background:#fff;color:var(--navy)}

/* sheets + toast */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(2,4,14,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fade .2s both}
.sheet{position:fixed;z-index:71;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;overscroll-behavior:contain;background:linear-gradient(180deg,#121c48,#0b1230);border-radius:26px 26px 0 0;border-top:1px solid var(--line-2);padding:10px max(18px,env(safe-area-inset-right,0px)) calc(20px + var(--bot)) max(18px,env(safe-area-inset-left,0px));animation:sheetUp .42s var(--spring);will-change:transform}
@keyframes sheetUp{from{transform:translateY(100%)}}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.22);margin:0 auto 14px}
.sheet h2{margin:0 0 4px;font:800 20px/1.2 var(--f-d)}
.sheet .sub{font-size:13.5px;color:var(--fg-2);margin-bottom:16px}
.sheet .hero-ic{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:rgba(255,116,3,.15);color:var(--orange);margin:6px 0 14px}
.sheet .hero-ic svg{width:32px;height:32px}
.cal-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-h b{font:800 15px/1 var(--f-d);flex:1;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dh{font:700 10px/1 var(--f-d);letter-spacing:.1em;color:var(--muted);text-align:center;padding-bottom:4px}
.cal button,.cal .pad{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:700 14px/1 var(--f-d)}
.cal button{background:rgba(255,255,255,.03)}
.cal button:disabled{color:rgba(255,255,255,.2)}
.cal button.has{background:var(--s3);border:1px solid var(--line-2)}
.cal button.has small{font:600 9.5px/1 var(--f-b);color:var(--sky)}
.cal button.sel{background:var(--orange);border-color:var(--orange);color:var(--ink)}
.cal button.sel small{color:var(--ink)}
.cal button.today{box-shadow:inset 0 0 0 1.5px var(--fg-2)}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:12px;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;color:var(--fg-2);counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--orange);color:var(--ink);font:800 12px/26px var(--f-d);text-align:center}
.steps b{color:#fff}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:15px;background:var(--orange);color:var(--ink);font:800 14.5px/1 var(--f-d);margin-top:16px}
.btn.ghost{background:var(--s2);color:var(--fg);border:1px solid var(--line);margin-top:8px}
.toast{position:fixed;z-index:90;left:50%;bottom:calc(var(--nav-h) + var(--bot) + 12px);transform:translateX(-50%);padding:11px 16px;border-radius:999px;background:#fff;color:var(--navy);font:700 13px/1.2 var(--f-d);box-shadow:0 14px 40px -10px #000;animation:toast 3.2s var(--ease) both;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
@keyframes toast{0%{opacity:0;transform:translate(-50%,14px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,8px)}}
.preview-bar{position:fixed;z-index:50;left:0;right:0;top:0;padding:calc(4px + var(--top)) 16px 4px;background:var(--orange);color:var(--ink);font:800 11px/1.3 var(--f-d);text-align:center}
.preview .top{top:22px} .preview main{padding-top:calc(var(--top) + 80px)}
.empty{margin-top:60px;text-align:center;color:var(--fg-2);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty img{width:64px}
.empty h2{margin:0;font:800 20px/1.2 var(--f-d);color:#fff}

/* ---------- polish layer ---------- */
img.fx{opacity:0;transition:opacity .5s var(--ease)} img.fx.ld{opacity:1}
.top.hide{transform:translateY(calc(-100% - 1px))}
.nav-ind{position:absolute;z-index:0;left:0;top:0;border-radius:15px;background:color-mix(in srgb,var(--ic,var(--orange)) 22%,transparent);box-shadow:0 0 22px -6px var(--ic,var(--orange));transition:transform .5s var(--spring),width .4s var(--ease),background .35s,box-shadow .35s;pointer-events:none}
.nav button{z-index:1}
.nav button[aria-current="page"] .ic{background:transparent}
/* staggered entrances (transform only, never left hidden) */
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}}
.page:not(.still) .spot-card,.page:not(.still) .tile,.page:not(.still) .read-all,.page:not(.still) .lead,.page:not(.still) .row,.page:not(.still) .pager2{animation:rise .55s var(--ease) backwards;animation-delay:calc(var(--i,0) * 45ms)}
/* journey: per-sector progress on tiles, ring on the read button */
.tile .tp{position:absolute;left:12px;right:12px;bottom:6px;height:3px;border-radius:2px;background:rgba(255,255,255,.07);overflow:hidden}
.tile .tp i{display:block;height:100%;border-radius:2px;background:var(--cc);transform-origin:left;animation:grow 1s var(--ease) .25s backwards}
@keyframes grow{from{transform:scaleX(0)}}
.tile .ok{position:absolute;right:11px;bottom:12px;display:flex;align-items:center;gap:4px;font:700 10.5px/1 var(--f-d);color:var(--cc)}
.tile .ok svg{width:13px;height:13px}
.read-all .ring{position:relative;width:28px;height:28px;flex:none;display:grid;place-items:center}
.read-all .ring svg.r{position:absolute;inset:0;width:28px;height:28px;transform:rotate(-90deg)}
.read-all .ring circle{fill:none;stroke-width:3;stroke-linecap:round}
.read-all .ring .bg{stroke:rgba(5,9,23,.22)} .read-all .ring .fg{stroke:var(--ink);transition:stroke-dashoffset 1s var(--ease)}
.read-all .ring svg.pl{width:12px;height:12px}
.read-all small{font:700 12px/1 var(--f-d);opacity:.7;margin-left:2px}
/* row highlight after returning from a story */
@keyframes flash{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--cc,var(--orange)) 70%,transparent);background:var(--s3)}100%{box-shadow:0 0 0 14px transparent}}
.flash{animation:flash 1.1s var(--ease)}
/* bottom pagers: previous beside next (story and category) */
.pager2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pager2.one{grid-template-columns:1fr}
.pg{position:relative;display:flex;flex-direction:column;gap:7px;min-height:92px;padding:12px 13px;border-radius:16px;background:var(--s1);border:1px solid var(--line);text-align:left;overflow:hidden;transition:transform .15s var(--ease),border-color .2s}
.pg:active{transform:scale(.97)}
.pg small{display:flex;align-items:center;gap:5px;font:800 10px/1 var(--f-d);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pg small svg{width:14px;height:14px;flex:none}
.pg b{font:700 13.5px/1.3 var(--f-d);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pg.nx{text-align:right;background:linear-gradient(135deg,transparent 40%,color-mix(in srgb,var(--nc,var(--orange)) 14%,transparent)),var(--s1);border-color:color-mix(in srgb,var(--nc,var(--orange)) 35%,var(--line))}
.pg.nx small{justify-content:flex-end;color:var(--nc,var(--orange))}
.pg .ico{position:absolute;right:-10px;bottom:-14px;width:64px;height:64px;color:var(--nc);opacity:.12}
.pg.pv .ico{left:-10px;right:auto}
.pg .ico svg{width:100%;height:100%}
/* story: tappable progress, compact title on scroll, parallax hero */
.prog{gap:3px;margin:-5px 0}
.prog button{flex:1;height:13px;display:flex;align-items:center}
.prog button i{display:block;width:100%;height:3px;border-radius:2px;background:rgba(255,255,255,.2);transition:background .3s}
.prog button.d i{background:rgba(255,255,255,.75)} .prog button.c i{background:var(--cc)}
.st-lbl{position:relative;flex:1;min-width:0;height:40px}
.st-lbl>*{position:absolute;inset:0;display:flex;align-items:center;transition:opacity .25s,transform .3s var(--ease)}
.st-lbl .mini{opacity:0;transform:translateY(6px);font:700 13.5px/1.2 var(--f-d);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;line-height:40px}
.st-page.scrolled .st-lbl .pos{opacity:0;transform:translateY(-6px)}
.st-page.scrolled .st-lbl .mini{opacity:1;transform:none}
.st-page.scrolled .st-top{background:rgba(5,9,23,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.st-top{transition:background .3s}
.st-hero{will-change:transform}
/* section hand-off: the journey across sectors */
.journey{display:flex;align-items:center;gap:6px;margin-top:2px}
.journey span{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:var(--s1);border:1px solid var(--line);color:var(--muted)}
.journey span svg{width:15px;height:15px}
.journey span.dn{color:var(--cc2);border-color:color-mix(in srgb,var(--cc2) 45%,transparent);background:color-mix(in srgb,var(--cc2) 12%,transparent)}
.journey span.cur{color:var(--ink);background:var(--cc2);border-color:var(--cc2);transform:scale(1.12);box-shadow:0 0 20px -4px var(--cc2)}
.journey i{width:12px;height:2px;border-radius:1px;background:var(--line-2)}
.burst{position:relative;display:grid;place-items:center;width:120px;height:120px}
.burst img{width:76px;position:relative;animation:pop .7s var(--spring) both}
.burst i{position:absolute;inset:18px;border-radius:50%;border:2px solid var(--orange);opacity:0;animation:ring 1.6s var(--ease) .2s infinite}
.burst i:nth-child(2){border-color:var(--sky);animation-delay:.7s}
@keyframes ring{0%{transform:scale(.7);opacity:.7}100%{transform:scale(1.7);opacity:0}}
/* first-load skeleton */
.sk{border-radius:18px;background:linear-gradient(100deg,var(--s1) 30%,var(--s2) 50%,var(--s1) 70%);background-size:300% 100%;animation:shim 1.4s linear infinite}
@keyframes shim{from{background-position:100% 0}to{background-position:-50% 0}}

/* ---------- editorial layer ---------- */
.hdr-ctx{margin-left:auto;font:600 12px/1 var(--f-d);color:var(--muted);white-space:nowrap}
.mast{margin:16px 0 4px}
.mast .eb{display:flex;align-items:center;gap:8px;font:700 10.5px/1 var(--f-d);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mast .mrow{display:flex;align-items:flex-end;gap:14px;margin-top:8px}
.mast .md{flex:1;min-width:0;text-align:left}
.mast h1{margin:0;font:500 clamp(24px,6.8vw,34px)/1.06 var(--f-s);letter-spacing:-.01em;color:var(--fg-2)}
.mast h1 span{color:#fff;font-weight:600}
.mast .chev{display:inline-grid;place-items:center;width:24px;height:24px;margin-left:6px;vertical-align:4px;border-radius:50%;background:var(--s2);border:1px solid var(--line);color:var(--fg-2)}
.mast .chev svg{width:13px;height:13px}
.mast .md:active .chev{background:var(--s3)}
.play-wrap{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px}
.play-wrap small{font:700 10.5px/1 var(--f-d);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2)}
.play{position:relative;width:60px;height:60px;display:grid;place-items:center;transition:transform .2s var(--spring)}
.play:active{transform:scale(.92)}
.play svg.r{position:absolute;inset:0;width:60px;height:60px;transform:rotate(-90deg)}
.play circle{fill:none;stroke-width:3;stroke-linecap:round}
.play .bg{stroke:rgba(255,255,255,.1)} .play .fg{stroke:#fff;transition:stroke-dashoffset 1.2s var(--ease)}
.play .disc{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--orange);color:var(--ink);box-shadow:0 10px 26px -8px rgba(255,116,3,.75)}
.play .disc svg{width:20px;height:20px;margin-left:3px}
button.upd{width:100%;text-align:left}
.upd em{margin-left:auto;display:flex;align-items:center;gap:2px;font:700 12px/1 var(--f-d);font-style:normal;color:var(--orange)}
.upd em svg{width:14px;height:14px}
.eyebrow.first{margin-top:12px}
.eyebrow .gl{display:flex;align-items:center;gap:7px;color:var(--fg-2)}
.eyebrow .gl img{width:16px;height:auto}
.spot-card h3{font:600 17px/1.2 var(--f-s);letter-spacing:-.005em;-webkit-line-clamp:2}
.spot-card .tx{gap:4px;bottom:11px}
.spot-card::after{background:linear-gradient(180deg,rgba(5,9,23,0) 0%,rgba(5,9,23,.25) 30%,rgba(5,9,23,.95) 85%)}
.spot-card .cnt{position:absolute;top:12px;left:12px;padding:4px 8px;border-radius:999px;background:rgba(5,9,23,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font:700 10.5px/1 var(--f-d);color:#fff}
.tile p{font:600 14px/1.3 var(--f-s);color:var(--fg);-webkit-line-clamp:2}
.lead h2{font:600 clamp(21px,5.8vw,26px)/1.15 var(--f-s);letter-spacing:-.005em}
.rows{display:block;gap:0;border-top:1px solid var(--line)}
.row{min-height:88px;gap:14px;padding:13px 2px;border-radius:0;background:none;border:0;border-bottom:1px solid var(--line)}
.row:active{transform:none;background:rgba(147,218,254,.04)}
.row .th{width:58px;height:68px}
.row h3{font:600 16.5px/1.25 var(--f-s);-webkit-line-clamp:3;letter-spacing:-.003em}
.row .rm{display:flex;align-items:center;gap:4px;font:600 11.5px/1 var(--f-d);color:var(--muted)}
.row .rm svg{width:12px;height:12px}
.row .nwt{padding:3px 6px;border-radius:5px;background:var(--orange);color:var(--ink);font:800 9.5px/1.2 var(--f-d);letter-spacing:.04em;text-transform:uppercase}
.row.read h3{color:var(--muted);font-weight:500}
.st-body h1{font:600 calc(clamp(26px,7vw,36px) * var(--ts,1))/1.12 var(--f-s);letter-spacing:-.01em}
.crux p{font:500 calc(19px * var(--ts,1))/1.5 var(--f-s)}
.full .in{font:400 calc(18px * var(--ts,1))/1.68 var(--f-s);color:#D7DEF5}
.full .in p:first-child::first-letter{font:600 3.1em/.82 var(--f-s);color:var(--cc);float:left;margin:4px 8px 0 0}
.meta{display:flex;flex-wrap:wrap;gap:3px 7px;font-size:13px;color:var(--fg-2)}
.meta i{font-style:normal;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:-4px}
.links a{font:600 13px/1.3 var(--f-d);color:var(--sky);text-decoration:none}
.rb.aa{font:600 15px/1 var(--f-s);margin-left:auto}
.pg b{font:600 15px/1.28 var(--f-s)}
.inter .lead-line{font:600 16px/1.35 var(--f-s)}
.inter h2{font:600 34px/1.05 var(--f-s);letter-spacing:-.01em}
.cat-h h1{font:600 clamp(26px,7vw,34px)/1 var(--f-s);letter-spacing:-.01em}

/* desktop: nav becomes a left rail; stories open as a side panel */
@media (min-width:900px){
  .nav{top:0;bottom:0;right:auto;width:210px;flex-direction:column;justify-content:flex-start;gap:4px;padding:calc(84px + var(--top)) 12px 20px;border-top:0;border-right:1px solid var(--line)}
  .nav button{flex:none;max-width:none;height:46px;flex-direction:row;justify-content:flex-start;gap:10px;padding:0 8px;font-size:13.5px}
  .nav .ic{width:36px;height:30px}
  .nav .badge{right:auto;left:30px}
  .top{left:210px}
  main{margin-left:210px;padding-left:32px;padding-right:32px;max-width:none}
  main>.page{max-width:1000px;margin:0 auto}
  .gut{padding-left:0;padding-right:0}
  .bar{padding:0 32px}
  .brief-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
  .brief-grid .eyebrow:first-child{margin-top:0}
  .spot-row{margin-right:0;padding-right:0}
  .spot-card{height:300px}
  .tile{min-height:146px} .tile p{-webkit-line-clamp:3}
  .rows{grid-template-columns:1fr 1fr}
  .lead{height:320px}
  .wall{columns:4 180px}
  .story{left:auto;width:min(720px,100%);border-left:1px solid var(--line);box-shadow:-30px 0 80px rgba(0,0,0,.6)}
  .story .gut{padding-left:32px;padding-right:32px}
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:420px;transform:translate(-50%,-50%);border-radius:24px;border:1px solid var(--line-2);animation:fade .25s both}
  .grab,.swipe-hint{display:none}
  .toast{bottom:28px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.intro{display:none}}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i></div>
<div class="intro" id="intro" aria-hidden="true" hidden>
  <svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="96" stroke="#FF7403" stroke-width="1.5" style="--l:603"/><circle cx="100" cy="100" r="86" stroke="#93DAFE" stroke-width="1" style="--l:540"/></svg>
  <img src="/logo-lg.png" alt="">
</div>
<div id="preview-bar" class="preview-bar" hidden>Preview · not published yet</div>

<header class="top" id="top">
  <div class="bar gut">
    <img class="logo" id="hdr-logo" src="/logo.png" alt="Gulf">
    <div class="brand"><b>Gulf <em>Pulse</em></b></div>
    <span id="hdr-ctx" class="hdr-ctx"></span>
    <button class="icon-btn" id="bell" aria-label="Turn on notifications" hidden></button>
  </div>
</header>
<div class="ptr" id="ptr" aria-hidden="true"><img src="/logo.png" alt=""></div>

<main class="gut" id="main"><div class="page" id="page"></div></main>
<nav class="nav" id="nav" aria-label="Sections"></nav>
<div id="layer"></div>

<script>
(() => {
const CFG = window.GP_CONFIG;
const GULF = "Gulf in the News";
const svg = (d, extra = "") => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${extra}>${d}</svg>`;
const ICON = {
  brief: svg('<rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/>'),
  gulf: svg('<circle cx="12" cy="12" r="8.5"/><path d="M4 10.5c5-1 11-1 16 0M4 13.5c5 1 11 1 16 0"/>'),
  infra: svg('<path d="M3 20h18M5 20V10M19 20V10M3 10c3-4 15-4 18 0M9 20v-6M15 20v-6"/>'),
  oil: svg('<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/><path d="M9.5 15a2.5 2.5 0 0 0 2.5 2.5"/>'),
  auto: svg('<path d="M5 16V11l2-5h10l2 5v5"/><path d="M3 16h18v2H3z"/><path d="m12.5 7-1.5 3h2l-1.5 3"/>'),
  other: svg('<path d="M4 5h13a2 2 0 0 1 2 2v12H6a2 2 0 0 1-2-2z"/><path d="M8 9h7M8 13h7M8 17h4"/>'),
  more: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
  clip: svg('<circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><path d="M8 7.5 20 17M8 16.5 20 7"/>'),
  close: svg('<path d="M6 6l12 12M18 6 6 18"/>', 'stroke-width="2.4"'),
  down: svg('<path d="m6 9 6 6 6-6"/>', 'stroke-width="2.4"'),
  prev: svg('<path d="m15 6-6 6 6 6"/>', 'stroke-width="2.4"'),
  next: svg('<path d="m9 6 6 6-6 6"/>', 'stroke-width="2.4"'),
  arrow: svg('<path d="M5 12h14M13 6l6 6-6 6"/>', 'stroke-width="2.4"'),
  share: svg('<path d="M12 15V3M7.5 7.5 12 3l4.5 4.5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/>'),
  read: svg('<path d="M4 5h13a2 2 0 0 1 2 2v12H6a2 2 0 0 1-2-2z"/><path d="M8 9h7M8 13h7"/>'),
  out: svg('<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>', 'stroke-width="2.2"'),
  bell: svg('<path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>'),
  check: svg('<path d="m5 12 5 5 9-10"/>', 'stroke-width="2.6"'),
  play: svg('<path d="M7 5v14l11-7z"/>', 'fill="currentColor" stroke-width="1.5"'),
  swipe: svg('<path d="M15 6l-6 6 6 6"/><path d="M9 6l6 6-6 6" opacity=".35"/>')
};
function catInfo(name){
  const n = (name || "").toLowerCase();
  if (name === GULF) return {short:"Gulf", long:"Gulf in the news", icon:ICON.gulf, color:"var(--c-gulf)"};
  if (/infra/.test(n)) return {short:"Infra", long:"Infrastructure", icon:ICON.infra, color:"var(--c-infra)"};
  if (/oil|gas|energy|fuel/.test(n)) return {short:"Oil & Gas", long:"Oil & Gas", icon:ICON.oil, color:"var(--c-oil)"};
  if (/auto|mobility|\bev\b|vehicle/.test(n)) return {short:"Auto & EV", long:"Auto & EV", icon:ICON.auto, color:"var(--c-auto)"};
  const s = name.split(/\s+/).slice(0, 2).join(" ");
  return {short:s, long:name, icon:ICON.other, color:"var(--c-other)"};
}
const KIND = {print:"Print", online:"Online", social:"Social"};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dObj = d => new Date(d + "T00:00:00");
const fmt = (d, o) => dObj(d).toLocaleDateString("en-IN", o);
const IST = {timeZone:"Asia/Kolkata"};
const todayIST = () => new Date().toLocaleDateString("en-CA", IST);
const timeIST = t => new Date(t).toLocaleTimeString("en-IN", {hour:"numeric", minute:"2-digit", ...IST});
const pages = p => p ? (/,/.test(p) ? "pp. " + p : "p. " + p) : "";
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const smooth = reduce ? "auto" : "smooth";
const hl = t => esc(t).replace(/(gulf oil|gulf[’']s|dhoni)/gi, "<mark>$1</mark>");
const store = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const buzz = (ms = 8) => { try { navigator.vibrate && navigator.vibrate(ms); } catch(e){} };
const PROXY = !/^(localhost|127\.|$)/.test(location.hostname);
const imgUrl = (src, w) => !src ? "" : (PROXY ? `/_vercel/image?url=${encodeURIComponent(src)}&w=${w}&q=70` : src);
const img = (src, w, alt = "", extra = "") => src ? `<img class="fx" src="${esc(imgUrl(src, w))}" data-orig="${esc(src)}" alt="${esc(alt)}" loading="lazy" decoding="async" draggable="false" ${extra}>` : "";
document.addEventListener("error", e => { const t = e.target; if (t.tagName !== "IMG") return; if (t.dataset.orig && t.src !== t.dataset.orig) t.src = t.dataset.orig; else t.classList.add("ld"); }, true);
document.addEventListener("load", e => { if (e.target.tagName === "IMG") e.target.classList.add("ld"); }, true);
const settleImgs = root => root.querySelectorAll("img.fx").forEach(i => { if (i.complete && i.naturalWidth) i.classList.add("ld"); });
const visual = s => (s.clips && s.clips[0] && {src:s.clips[0].src, paper:true}) || (s.image && {src:s.image.src, paper:false}) || null;

const st = {index:[], ed:null, date:null, view:"brief", cat:null, preview:false, story:null};
const readKey = () => "gp-read-" + st.date;
const isRead = s => (store.get(readKey()) || []).includes(s.key || s.id);
const markRead = s => { const r = store.get(readKey()) || []; if (!r.includes(s.key || s.id)) { r.push(s.key || s.id); store.set(readKey(), r); } };
const isNew = s => st.ed.version > 1 && s.firstVersion === st.ed.version && !isRead(s);
const storiesIn = sec => st.ed.stories.filter(s => s.section === sec);
const leadOf = sec => { const l = storiesIn(sec); const id = (st.ed.leads || {})[sec]; return l.find(s => s.key === id) || l.find(s => visual(s)) || l[0]; };
const ordered = sec => { const l = storiesIn(sec), lead = leadOf(sec); return lead ? [lead, ...l.filter(s => s !== lead)] : []; };
const secs = () => st.ed.sections;
const readMins = s => Math.max(1, Math.round(((s.fullText || s.summary || "").split(/\s+/).length) / 220));
const SIZES = [1, 1.12, 1.25];
const slug = n => "c-" + catInfo(n).short.toLowerCase().replace(/[^a-z]+/g, "-").replace(/-+$/, "");

/* ---------- data ---------- */
async function sb(path){
  const r = await fetch(`${CFG.supabaseUrl}/rest/v1/${path}`, {headers:{apikey:CFG.supabaseKey, Authorization:`Bearer ${CFG.supabaseKey}`}, cache:"no-store"});
  if (!r.ok) throw new Error("load " + r.status);
  return r.json();
}
const loadIndex = async () => { st.index = await sb("edition_index?select=*&order=date.desc"); };
async function loadEdition(date){
  const rows = await sb(`editions?date=eq.${date}&select=date,version,published_at,data`);
  if (!rows[0]) throw new Error("missing");
  st.date = date; st.ed = rows[0].data; st.ed.version = rows[0].version; st.ed.publishedAt = rows[0].published_at;
  store.set("gp-cache", {index:st.index, date, ed:st.ed});
}

/* ---------- chrome ---------- */
function renderChrome(){
  // Outside the brief, the header quietly says which edition you're in.
  $("#hdr-ctx").textContent = st.view === "brief" ? "" : fmt(st.date, {weekday:"short", day:"numeric", month:"short"});
  const all = secs(), max = 4, shown = all.length > max ? all.slice(0, max - 1) : all;
  const b = (id, label, icon, color, badge, cur) => `<button data-nav="${esc(id)}" style="${color ? `--cc:${color}` : ""}" aria-current="${cur ? "page" : "false"}"><span class="ic">${icon}${badge ? `<span class="badge num">${badge}</span>` : ""}</span><span class="l">${esc(label)}</span></button>`;
  const moreCur = st.view === "cat" && !shown.includes(st.cat);
  const nav = $("#nav"), ind = nav.querySelector(".nav-ind") || Object.assign(document.createElement("span"), {className:"nav-ind"});
  nav.innerHTML = b("brief", "Brief", ICON.brief, "", 0, st.view !== "cat") +
    shown.map(n => { const c = catInfo(n); return b("c:" + n, c.short, c.icon, c.color, storiesIn(n).filter(isNew).length, st.view === "cat" && st.cat === n); }).join("") +
    (all.length > max ? b("more", "More", ICON.more, "", 0, moreCur) : "");
  nav.prepend(ind); placeInd();
}
function placeInd(){
  const nav = $("#nav"), ind = nav.querySelector(".nav-ind"), cur = nav.querySelector('[aria-current="page"] .ic'); if (!ind || !cur) return;
  const n = nav.getBoundingClientRect(), r = cur.getBoundingClientRect(), first = !ind.dataset.ok;
  if (first) ind.style.transition = "none";
  Object.assign(ind.style, {width:r.width + "px", height:r.height + "px", transform:`translate(${r.left - n.left}px,${r.top - n.top}px)`});
  ind.style.setProperty("--ic", cur.closest("button").style.getPropertyValue("--cc") || "var(--orange)");
  if (first){ ind.dataset.ok = 1; requestAnimationFrame(() => ind.style.transition = ""); }
}
addEventListener("resize", placeInd);

/* ---------- brief ---------- */
function renderBrief(){
  const ed = st.ed, gulf = ordered(GULF), others = secs().filter(n => n !== GULF);
  const clips = ed.stories.filter(s => s.clips?.length);
  const hr = +new Date().toLocaleString("en-IN", {hour:"numeric", hour12:false, ...IST});
  const isToday = st.date === todayIST();
  const greet = !isToday ? fmt(st.date, {weekday:"long"}) + "'s brief" : hr < 12 ? "Good morning" : hr < 17 ? "Good afternoon" : "Good evening";
  const vs = ed.versions || [], last = vs.at(-1), first = vs[0];
  const newCount = ed.stories.filter(isNew).length;
  const upd = ed.version > 1 && last && last.added > 0 && newCount ? `<button class="upd" data-act="read-new"><i></i><span><b>${newCount} new ${newCount === 1 ? "story" : "stories"}</b> · updated ${timeIST(last.at)}</span><em>Read ${ICON.next}</em></button>` : "";
  const latest = st.preview || st.date === st.index[0]?.date;
  const unread = ed.stories.filter(s => !isRead(s)).length;
  let ti = 2;
  const tile = (n, wide) => {
    const c = catInfo(n), l = storiesIn(n), lead = leadOf(n), nn = l.filter(isNew).length, rd = l.filter(isRead).length;
    const thumbs = l.map(visual).filter(Boolean).slice(0, 3);
    return `<button class="tile ${wide ? "wide" : ""}" data-nav="c:${esc(n)}" style="--cc:${c.color};--i:${ti++}">
      <span class="hd">${c.icon}${esc(c.long)}<span class="n num">${l.length}</span></span>
      <p>${esc(lead.title)}</p>
      <span class="stack">${thumbs.map(v => `<span>${img(v.src, 96, "", 'loading="eager"')}</span>`).join("")}</span>
      ${nn ? `<span class="nw">${nn} NEW</span>` : rd === l.length ? `<span class="ok">${ICON.check}Read</span>` : ""}
      ${rd ? `<span class="tp"><i style="width:${Math.round(rd / l.length * 100)}%"></i></span>` : ""}</button>`;
  };
  const tiles = others.map((n, i) => tile(n, others.length % 2 && i === others.length - 1 && !clips.length));
  if (clips.length) tiles.push(`<button class="tile ${tiles.length % 2 ? "" : "wide"}" data-view="clips" style="--cc:#ebe5d8;--i:${ti++}">
      <span class="hd">${ICON.clip}Clippings<span class="n num">${clips.length}</span></span>
      <p>Today's newspaper cut-outs</p>
      <span class="stack">${clips.slice(0, 3).map(s => `<span>${img(s.clips[0].src, 96, "", 'loading="eager"')}</span>`).join("")}</span></button>`);
  setPage(`
    <div class="mast">
      <div class="eb"><i class="live ${latest ? "" : "off"}"></i>${esc(greet)} · ${st.preview ? "Preview" : latest ? "Published " + timeIST(ed.publishedAt || Date.now()) : "Past edition"}</div>
      <div class="mrow">
        <button class="md" data-act="editions" aria-label="Change edition"><h1>${fmt(st.date,{weekday:"long"})},<br><span>${fmt(st.date,{day:"numeric",month:"long"})}</span><i class="chev">${ICON.down}</i></h1></button>
        <span class="play-wrap"><button class="play" data-act="read-all" aria-label="${unread === ed.stories.length ? "Read today's brief" : unread ? "Continue reading" : "Read it again"}"><svg class="r" viewBox="0 0 56 56"><circle class="bg" cx="28" cy="28" r="26"/><circle class="fg" cx="28" cy="28" r="26" stroke-dasharray="163.4" stroke-dashoffset="${(163.4 * unread / ed.stories.length).toFixed(1)}"/></svg><span class="disc">${ICON.play}</span></button><small>${unread === ed.stories.length ? "Read" : unread ? "Continue" : "Again"}</small></span>
      </div>
    </div>
    ${upd}
    <div class="brief-grid">
      <section aria-label="Gulf in the news">
        <div class="eyebrow first"><span class="gl"><img src="/logo.png" alt="">Gulf in the news</span><span>${gulf.length ? gulf.length + (gulf.length === 1 ? " mention" : " mentions") : ""}</span></div>
        ${gulf.length ? `<div class="spot-row" id="spot-row">${gulf.map((s, i) => { const v = visual(s); return `
          <button class="spot-card" data-open="${esc(GULF)}" data-i="${i}" data-skey="${esc(s.key || s.id)}" style="--i:${i}">${v ? img(v.src, 640, "", i ? "" : 'loading="eager" fetchpriority="high"') : ""}
            ${isNew(s) ? `<span class="nw">NEW</span>` : ""}${gulf.length > 1 ? `<span class="cnt num">${i + 1}/${gulf.length}</span>` : ""}
            <span class="tx"><h3>${esc(s.title)}</h3><span class="meta">${esc(s.outlet)}${s.platform ? " · " + esc(s.platform) : ""}</span></span></button>`; }).join("")}</div>
          ${gulf.length > 1 ? `<div class="dots" id="dots">${gulf.map((_, i) => `<i class="${i ? "" : "on"}"></i>`).join("")}</div>` : ""}`
        : `<div class="quiet"><img src="/logo.png" alt=""><span>No Gulf mentions in today's coverage.</span></div>`}
      </section>
      <section aria-label="Your sectors today">
        <div class="eyebrow">Your sectors<span>${ed.stories.length} stories · ${new Set(ed.stories.map(s => s.outlet)).size} outlets</span></div>
        <div class="tiles">${tiles.join("")}</div>
        <button class="read-all" hidden data-act="read-all" style="--i:${ti}"><span class="ring"><svg class="r" viewBox="0 0 28 28"><circle class="bg" cx="14" cy="14" r="12"/><circle class="fg" cx="14" cy="14" r="12" stroke-dasharray="75.4" stroke-dashoffset="${(75.4 * unread / ed.stories.length).toFixed(1)}"/></svg>${ICON.play.replace("<svg", '<svg class="pl"')}</span><span>${unread === ed.stories.length ? "Read today's brief" : unread ? "Continue reading" : "Read it again"}</span>${unread && unread < ed.stories.length ? `<small class="num">${ed.stories.length - unread}/${ed.stories.length}</small>` : ""}</button>
      </section>
    </div>`, "f");
  const row = $("#spot-row"), dots = $("#dots");
  if (row && dots) row.addEventListener("scroll", () => {
    const i = Math.round(row.scrollLeft / (row.firstElementChild.offsetWidth + 10));
    [...dots.children].forEach((d, k) => d.classList.toggle("on", k === i));
  }, {passive:true});
}

/* ---------- category ---------- */
function renderCat(dir){
  const n = st.cat, c = catInfo(n), list = ordered(n), lead = list[0], rest = list.slice(1);
  const i = secs().indexOf(n), nextSec = secs()[i + 1], prevSec = secs()[i - 1];
  const lv = visual(lead);
  const kick = s => `<span class="kick">${esc(s.outlet)}${s.edition ? ` <em>· ${esc(s.edition.split(",")[0])}</em>` : ""}${s.page ? ` <em>· ${pages(s.page)}</em>` : ""}${!s.page && s.kind !== "print" ? ` <em>· ${KIND[s.kind]}${s.platform ? " · " + esc(s.platform) : ""}</em>` : ""}</span>`;
  setPage(`<div style="--cc:${c.color}">
    <div class="cat-h"><span class="ic">${c.icon}</span><h1>${esc(c.long)}</h1><span class="num">${list.length} ${list.length === 1 ? "story" : "stories"}</span></div>
    <button class="lead ${lv?.paper ? "paper" : ""} ${isRead(lead) ? "read" : ""}" data-open="${esc(n)}" data-i="0" data-skey="${esc(lead.key || lead.id)}">${lv ? img(lv.src, 1080, "", 'loading="eager"') : ""}
      ${isNew(lead) ? `<span class="nw">NEW</span>` : ""}
      <span class="tx">${kick(lead)}<h2>${esc(lead.title)}</h2></span></button>
    <div class="rows">${rest.map((s, k) => { const v = visual(s), r = isRead(s); return `
      <button class="row ${r ? "read" : ""}" data-open="${esc(n)}" data-i="${k + 1}" data-skey="${esc(s.key || s.id)}" style="--i:${Math.min(k + 1, 9)}">
        <span class="tx">${kick(s)}<h3>${esc(s.title)}</h3><span class="rm">${isNew(s) ? `<b class="nwt">New</b>` : r ? `${ICON.check}Read` : readMins(s) + " min read"}</span></span>
        <span class="th ${v ? (v.paper ? "" : "photo") : "none"}">${v ? img(v.src, 256) : ICON.other}</span></button>`; }).join("")}</div>
    <div class="pager2 ${prevSec ? "" : "one"}" style="margin-top:14px;--i:10">
      ${prevSec ? `<button class="pg pv" data-nav="c:${esc(prevSec)}" style="--nc:${catInfo(prevSec).color}"><span class="ico">${catInfo(prevSec).icon}</span><small>${ICON.prev}Previous sector</small><b>${esc(catInfo(prevSec).long)}</b></button>` : ""}
      ${nextSec ? `<button class="pg nx" data-nav="c:${esc(nextSec)}" style="--nc:${catInfo(nextSec).color}"><span class="ico">${catInfo(nextSec).icon}</span><small>Next sector${ICON.next}</small><b>${esc(catInfo(nextSec).long)} · ${storiesIn(nextSec).length}</b></button>`
        : `<button class="pg nx" data-nav="brief"><small>That's every sector${ICON.next}</small><b>Back to the brief</b></button>`}
    </div>
    <div class="swipe-hint">${ICON.swipe}Swipe sideways to change sector</div>
  </div>`, dir > 0 ? "r" : dir < 0 ? "l" : "f");
}

/* ---------- clippings ---------- */
function renderClips(){
  const l = st.ed.stories.filter(s => s.clips?.length);
  setPage(`<div class="cat-h" style="--cc:#ebe5d8"><span class="ic">${ICON.clip}</span><h1>Clippings</h1><span class="num">${l.length} cut-outs</span></div>

let autoTimer = null;

    const a = old.animate([{transform:old.style.transform || "none"}, {transform:`translateX(${-dir * 30}%)`, opacity:.4}], {duration:320, easing:"cubic-bezier(.22,.8,.25,1)"});

  const done = () => {
    el.remove(); unlock();

async function shareStory(){

}
function openEditions(){ calMonth = null; openLayerSheet(editionsSheet()); }
function moreSheet(){
  const extra = secs().slice(3);
  openLayerSheet(`<div class="grab"></div><h2>More sectors</h2><div class="sub">Today's other categories</div>
    <div class="rows">${extra.map(n => { const c = catInfo(n); return `<button class="row" data-nav="c:${esc(n)}" style="--cc:${c.color}"><span class="th none" style="color:${c.color}">${c.icon}</span><span class="tx"><h3>${esc(n)}</h3><span class="kick">${storiesIn(n).length} stories</span></span></button>`; }).join("")}</div>`);
}

/* ---------- notifications ---------- */
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
let swReg = null, pushOn = false;
async function initPush(){
  if (!("serviceWorker" in navigator)) return;
  try { swReg = await navigator.serviceWorker.register("/sw.js"); } catch(e){ return; }
  const sub = pushSupported() ? await swReg.pushManager.getSubscription().catch(() => null) : null;
  pushOn = !!sub && Notification.permission === "granted";
  if (sub && pushOn) saveSub(sub).catch(() => {}); // keep the server copy fresh
  setBell();
  maybeAskForNotifications();
}
function setBell(){
  const b = $("#bell");
  if (!(pushSupported() || isIOS) || st.preview) { b.hidden = true; return; }
  b.hidden = false; b.classList.toggle("on", pushOn);
  b.innerHTML = ICON.bell + (pushOn ? "" : '<span class="pip"></span>');
  b.setAttribute("aria-label", pushOn ? "Notifications are on" : "Turn on notifications");
}
function maybeAskForNotifications(){
  // Ask once, gently, on the second visit or after the first story, never on top of something else.
  if (pushOn || st.preview || store.get("gp-asked")) return;
  if (pushSupported() && Notification.permission === "denied") return;
  const visits = (store.get("gp-visits") || 0);
  if (visits >= 1 || store.get("gp-read-any")) setTimeout(() => { if (!$(".story") && !$(".sheet") && !$(".intro:not([hidden])")) notifySheet(); }, 1600);
}
function notifySheet(){
  store.set("gp-asked", true);
  if (isIOS && !standalone) return installSheet();
  openLayerSheet(`<div class="grab"></div><div class="hero-ic">${ICON.bell}</div><h2>Know the moment it's out</h2>
    <div class="sub">Get a notification when each day's Gulf Pulse is published, and when a later update adds stories.</div>
    <button class="btn" data-act="notify">Turn on notifications</button><button class="btn ghost" data-act="sheet-x">Not now</button>`);
}
const b64 = s => { const p = "=".repeat((4 - s.length % 4) % 4), r = atob((s + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from([...r].map(c => c.charCodeAt(0))); };
async function saveSub(sub){
  const j = sub.toJSON();
  const r = await fetch(`${CFG.supabaseUrl}/rest/v1/rpc/add_push_sub`, {method:"POST", headers:{apikey:CFG.supabaseKey, Authorization:`Bearer ${CFG.supabaseKey}`, "Content-Type":"application/json"},
    body:JSON.stringify({p_endpoint:j.endpoint, p_p256dh:j.keys.p256dh, p_auth:j.keys.auth})});
  if (!r.ok) throw new Error("save");
}
async function enablePush(){
  if (isIOS && !standalone) return installSheet();
  if (!pushSupported()) return toast("This browser can't show notifications.");
  if (Notification.permission === "denied") return toast("Notifications are blocked. Allow them in Settings.");
  try {
    const perm = await Notification.requestPermission();
    if (perm !== "granted") return toast("Notifications stay off.");
    const reg = swReg || await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64(CFG.vapidPublicKey)});
    await saveSub(sub);
    pushOn = true; setBell(); store.set("gp-asked", true);
    toast("You're set. We'll notify you when each edition is out."); buzz(15);
  } catch (e){ toast("Couldn't turn on notifications. Try again."); }
}
function installSheet(){
  openLayerSheet(`<div class="grab"></div><div class="hero-ic">${ICON.bell}</div><h2>Add Gulf Pulse to your home screen</h2><div class="sub">On iPhone, notifications work once Gulf Pulse is on your home screen.</div>
    <ol class="steps"><li><span>Tap <b>Share</b> in Safari's toolbar.</span></li><li><span>Choose <b>Add to Home Screen</b>, then <b>Add</b>.</span></li><li><span>Open <b>Gulf Pulse</b> from your home screen and tap <b>Turn on</b>.</span></li></ol>
    <button class="btn" data-act="sheet-x">Got it</button>`);
}
function toast(msg){ document.querySelector(".toast")?.remove(); const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3300); }

/* ---------- refresh ---------- */
async function refresh(manual){
  if (st.preview) return;
  try {
    const before = st.index[0];
    await loadIndex();
    const now = st.index[0];
    if (!now) return;
    const changed = !before || now.date !== before.date || now.version !== before.version;
    const onLatest = !before || st.date === before.date;
    if (changed && onLatest){ await loadEdition(now.date); if (!$(".story")) render(0); }
    if (changed) toast(before && now.date === before.date ? "Updated with the latest stories" : "Today's edition is here");
    else if (manual) toast("You're up to date");
  } catch(e){ if (manual) toast("Couldn't refresh. Check your connection."); }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(false); });
navigator.serviceWorker?.addEventListener("message", e => { if (e.data?.type === "refresh") refresh(false); });
setInterval(() => !document.hidden && refresh(false), 5 * 60 * 1000);

/* ---------- taps ---------- */
document.addEventListener("click", async e => {
  if (drag.consumed){ drag.consumed = false; e.preventDefault(); e.stopPropagation(); return; }
  const t = e.target.closest("[data-nav],[data-view],[data-open],[data-act],[data-date],#date-btn,#bell"); if (!t) return;
  const a = t.dataset.act;
  if (t.id === "date-btn") return openEditions();
  if (t.id === "bell") return pushOn ? toast("Notifications are on.") : (isIOS && !standalone ? installSheet() : enablePush());
  if (t.dataset.nav){
    if ($(".sheet")) closeLayer();
    const v = t.dataset.nav;
    if (v === "brief") return go("brief");
    if (v === "more") return moreSheet();
    const n = v.slice(2), from = secs().indexOf(st.cat), to = secs().indexOf(n);
    return go("cat", n, {dir: st.view === "cat" ? Math.sign(to - from) : 0});
  }
  if (t.dataset.view) return go(t.dataset.view);
  if (t.dataset.date){ closeLayer(); await loadEdition(t.dataset.date); st.view = "brief"; history.replaceState({v:"brief"}, "", "#brief"); render(0); window.scrollTo(0, 0); return; }
  if (t.dataset.open !== undefined){
    store.set("gp-read-any", true);
    const sec = t.dataset.open;
    const i = t.dataset.key ? ordered(sec).findIndex(s => (s.key || s.id) === t.dataset.key) : +t.dataset.i;
    return openStory(sec, Math.max(0, i), t);
  }
  if (a === "read-all"){
    store.set("gp-read-any", true);
    for (const n of secs()){ const k = ordered(n).findIndex(s => !isRead(s)); if (k >= 0) return openStory(n, k); }
    return openStory(secs()[0], 0);
  }
  if (a === "close") return closeStory();
  if (a === "editions") return openEditions();
  if (a === "share") return shareStory();
  if (a === "size"){ const k = ((store.get("gp-ts") || 0) + 1) % SIZES.length; store.set("gp-ts", k); $("#story").style.setProperty("--ts", SIZES[k]); toast(["Standard text", "Larger text", "Largest text"][k]); return; }
  if (a === "read-new"){ for (const n of secs()){ const k = ordered(n).findIndex(isNew); if (k >= 0) return openStory(n, k); } return; }
  if (a === "jump") return jump(+t.dataset.k);
  if (a === "prev") return step(-1);
  if (a === "next" || a === "continue") return step(1);
  if (a === "full"){
    const pg = t.closest(".st-page"), f = pg.querySelector(".full"), open = !f.classList.contains("open");
    f.style.setProperty("--h", f.scrollHeight + 40 + "px"); f.classList.toggle("open", open);
    t.setAttribute("aria-expanded", open); t.querySelector("span").textContent = open ? "Less" : "Full story";
    if (open) setTimeout(() => { const sc = pg.querySelector(".st-scroll"); sc.scrollTo({top: f.offsetTop - 90, behavior:smooth}); }, 60);
    return;
  }
  if (a === "clip") return lightbox();
  if (a === "lb-x") return history.state?.lb ? history.back() : t.closest(".lightbox").remove();
  if (a === "lb-page"){ const lb = t.closest(".lightbox"), k = +t.dataset.k, im = lb.querySelector("#lb-img"); im.src = imgUrl(lb._media[k].src, 1080); im.dataset.orig = lb._media[k].src; lb.querySelectorAll(".lb-pages button").forEach((b, j) => b.classList.toggle("on", j === k)); return; }
  if (a === "sheet-x") return closeSheetUser();
  if (a === "m-prev" || a === "m-next"){ const r = calMonth || dObj(st.date); calMonth = new Date(r.getFullYear(), r.getMonth() + (a === "m-next" ? 1 : -1), 1); $("#layer .sheet").innerHTML = editionsSheet(); return; }
  if (a === "notify"){ closeSheetUser(); return enablePush(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape"){ if ($(".lightbox")) return history.state?.lb ? history.back() : $(".lightbox").remove(); if ($(".sheet")) return closeSheetUser(); return closeStory(); }
  if ($(".story") && !$(".lightbox")){ if (e.key === "ArrowRight") step(1); if (e.key === "ArrowLeft") step(-1); }
  else if (st.view === "cat" && !$(".sheet")){ if (e.key === "ArrowRight") swipeCat(1); if (e.key === "ArrowLeft") swipeCat(-1); }
});

/* ---------- thumb gestures ----------
   Story: drag sideways follows the finger → next/previous (sections flow on); drag down at the top → close.
   Category: drag sideways → next/previous sector. Brief/category at the top: pull down → refresh. */
const drag = {on:false, consumed:false};
function swipeCat(d){
  const order = secs(), i = order.indexOf(st.cat) + d;
  if (i >= 0 && i < order.length) go("cat", order[i], {dir:d});
  else if (d < 0) go("brief");
}
document.addEventListener("touchstart", e => {
  if (e.touches.length !== 1 || $(".lightbox") || $(".sheet")) { drag.on = false; return; }
  const t = e.touches[0], story = $("#story");
  const tgt = e.target;
  const page = story ? story.lastElementChild : $("#page");
  const sc = story ? page?.querySelector(".st-scroll") : null;
  Object.assign(drag, {on:true, inSpot: !story && !!tgt.closest(".spot-row"), x:t.clientX, y:t.clientY, t:Date.now(), axis:null, dx:0, dy:0, page, story:!!story, atTop: story ? (!sc || sc.scrollTop <= 0) : window.scrollY <= 0});
}, {passive:true});
document.addEventListener("touchmove", e => {
  if (!drag.on || !drag.page) return;
  const t = e.touches[0]; drag.dx = t.clientX - drag.x; drag.dy = t.clientY - drag.y;
  if (!drag.axis){
    if (Math.abs(drag.dx) < 10 && Math.abs(drag.dy) < 10) return;
    drag.axis = Math.abs(drag.dx) > Math.abs(drag.dy) * 1.2 ? "x" : "y";
    if (drag.axis === "y" && !(drag.dy > 0 && drag.atTop)) { drag.on = false; return; }
    if (drag.axis === "x" && (drag.inSpot || (!drag.story && st.view !== "cat"))) { drag.on = false; return; }
    drag.page.style.transition = "none";
  }
  e.preventDefault();
  const W = window.innerWidth;
  if (drag.axis === "x"){
    let dx = drag.dx;
    const edge = drag.story ? !canStep(dx < 0 ? 1 : -1) : !canSwipeCat(dx < 0 ? 1 : -1);
    if (edge) dx *= .3;
    drag.page.style.transform = `translateX(${dx}px) rotate(${dx / W * (drag.story ? 2 : 0)}deg)`;
    if (drag.story){ const h = drag.page.querySelector(dx < 0 ? ".edge-hint.r" : ".edge-hint.l"); if (h) h.style.opacity = Math.min(1, Math.abs(dx) / (W * .25)); }
  } else {
    const dy = Math.max(0, drag.dy);
    if (drag.story){ drag.page.style.transform = `translateY(${dy * .9}px) scale(${1 - Math.min(dy, 400) / 2200})`; drag.page.style.borderRadius = Math.min(28, dy / 6) + "px"; drag.page.style.overflow = "hidden"; }
    else { const p = Math.min(dy * .5, 90); drag.page.style.transform = `translateY(${p}px)`; ptr(p); }
  }
}, {passive:false});
document.addEventListener("touchend", () => {
  if (!drag.on || !drag.axis) { drag.on = false; return; }
  drag.on = false; drag.consumed = true; setTimeout(() => drag.consumed = false, 60);
  const p = drag.page, W = window.innerWidth, v = Math.abs(drag.dx) / Math.max(1, Date.now() - drag.t);
  const reset = () => { p.style.transition = "transform .3s cubic-bezier(.22,.8,.25,1), border-radius .3s"; p.style.transform = ""; p.style.borderRadius = ""; p.querySelectorAll?.(".edge-hint").forEach(h => h.style.opacity = 0); };
  if (drag.axis === "x"){
    const d = drag.dx < 0 ? 1 : -1, go2 = Math.abs(drag.dx) > W * .22 || (v > .45 && Math.abs(drag.dx) > 30);
    if (drag.story){ if (go2 && canStep(d)) { p.style.transform = ""; step(d); } else reset(); }
    else { if (go2 && canSwipeCat(d)) { p.style.transform = ""; swipeCat(d); } else reset(); }
  } else {
    if (drag.story){ if (drag.dy > 120) closeStory(false, "drag"); else reset(); }
    else { const pulled = drag.dy * .5 > 60; reset(); ptr(0, pulled); if (pulled) refresh(true); }
  }
}, {passive:true});
function canStep(d){ const s = st.story; if (!s) return false; if (d > 0) return true; return !(s.i === 0 && !s.inter && secs().indexOf(s.sec) === 0); }
function canSwipeCat(d){ const i = secs().indexOf(st.cat); return d > 0 ? i < secs().length - 1 : true; }
function ptr(p, spin){
  const el = $("#ptr");
  if (spin){ el.classList.add("spin"); el.style.transition = "opacity .2s"; el.style.opacity = 1; el.style.transform = "translateY(0) scale(1)"; setTimeout(() => { el.classList.remove("spin"); el.style.opacity = 0; el.style.transform = "translateY(-30px) scale(.6)"; }, 900); return; }
  el.style.transition = p ? "none" : "opacity .2s, transform .2s";
  el.style.opacity = Math.min(1, p / 60); el.style.transform = `translateY(${p - 30}px) scale(${.6 + Math.min(.4, p / 150)}) rotate(${p * 4}deg)`;
}

/* ---------- header hides on scroll down, returns on scroll up ---------- */
let lastY = 0;
addEventListener("scroll", () => {
  if (document.body.classList.contains("locked")) return;
  const y = window.scrollY, top = $("#top");
  if (y > lastY + 6 && y > 90) top.classList.add("hide"); else if (y < lastY - 6 || y < 60) top.classList.remove("hide");
  lastY = y;
}, {passive:true});

/* ---------- intro + boot ---------- */
function intro(){
  const el = $("#intro"), today = todayIST();
  if (reduce || store.get("gp-intro") === today) return el.remove();
  store.set("gp-intro", today); el.hidden = false;
  setTimeout(() => {
    const r = $("#hdr-logo").getBoundingClientRect();
    el.style.setProperty("--ox", r.left + r.width / 2 + "px"); el.style.setProperty("--oy", r.top + r.height / 2 + "px");
    el.classList.add("out"); setTimeout(() => el.remove(), 700);
  }, 950);
}
function routeFromHash(){
  const h = location.hash.slice(1);
  let v = "brief", c = null;
  if (h === "clips") v = "clips";
  else if (h.startsWith("c-")){ const n = secs().find(n => slug(n) === h); if (n){ v = "cat"; c = n; } }
  st.view = v; st.cat = c;
  // Build history so Back from a deep link lands on the brief, not outside the app.
  history.replaceState({v:"brief"}, "", "#brief");
  if (v !== "brief") history.pushState({v, c}, "", "#" + viewHash());
  render(0);
}
(async function boot(){
  const params = new URLSearchParams(location.search);
  st.preview = params.get("preview") === "1";
  if (st.preview){
    const d = store.get("gp-preview");
    if (!d){ $("#page").innerHTML = `<div class="empty"><h2>Nothing to preview</h2><p>Open the preview from the publish page.</p></div>`; return; }
    document.body.classList.add("preview"); $("#preview-bar").hidden = false; $("#intro").remove();
    st.ed = d; st.date = d.date; st.index = [{date:d.date, version:d.version, stories:d.stories.length}];
    return routeFromHash();
  }
  store.set("gp-visits", (store.get("gp-visits") || 0) + 1);
  intro();
  const cached = store.get("gp-cache");
  if (!cached?.ed) $("#page").innerHTML = `<div style="display:grid;gap:10px;margin-top:12px" aria-label="Loading"><div class="sk" style="height:30px;width:60%"></div><div class="sk" style="height:min(37vw,190px)"></div><div class="tiles"><div class="sk" style="height:104px"></div><div class="sk" style="height:104px"></div><div class="sk" style="height:104px"></div><div class="sk" style="height:104px"></div></div><div class="sk" style="height:46px"></div></div>`;
  if (cached?.ed){ st.index = cached.index; st.date = cached.date; st.ed = cached.ed; routeFromHash(); } // instant open, then refresh
  try {
    await loadIndex();
    if (!st.index.length){ $("#page").innerHTML = `<div class="empty"><img src="/logo-lg.png" alt=""><h2>No edition yet</h2><p>The first brief appears here as soon as it's published.</p></div>`; $("#nav").innerHTML = ""; return; }
    const target = cached?.date && cached.date === st.index[0].date && cached.ed?.version === st.index[0].version ? null : st.index[0].date;
    if (target){ await loadEdition(target); if (!$(".story")) cached?.ed ? render(0) : routeFromHash(); }
    else renderChrome();
  } catch (e){
    if (!st.ed) $("#page").innerHTML = `<div class="empty"><img src="/logo-lg.png" alt=""><h2>Couldn't load the brief</h2><p>Check your connection, then pull down to try again.</p></div>`;
  }
  initPush();
})();
})();
</script>
