      const pg = t.closest(".st-page"), f = pg.querySelector(".full"), open = !f.classList.contains("open");
      f.style.setProperty("--h", f.scrollHeight + 40 + "px"); f.classList.toggle("open", open);
      t.setAttribute("aria-expanded", open); t.querySelector("span").textContent = open ? "Less" : "Full story";
      if (open) setTimeout(() => pg.querySelector(".st-scroll").scrollTo({top: f.offsetTop - 90, behavior:smooth}), 60);
      return;
    }
    case "clip": return lightbox(ordered(st.story.sec)[st.story.i], false);
    case "lb-x": return closeLightbox();
    case "lb-in": return t.closest(".lightbox")._zoomBy(1.4);
    case "lb-out": return t.closest(".lightbox")._zoomBy(1 / 1.4);
    case "lb-fit": return t.closest(".lightbox")._reset();
    case "lb-story": { const s = findStory(t.dataset.skey); closeLightbox(); if (s) setTimeout(() => openStory(s.section, ordered(s.section).indexOf(s)), 120); return; }
    case "lb-page": { const lb = t.closest(".lightbox"), k = +t.dataset.k, im = lb.querySelector("#lb-img"); im.src = imgUrl(lb._media[k].src, 1080); im.dataset.orig = lb._media[k].src; im.addEventListener("load", () => lb._reset(), {once:true}); lb.querySelectorAll("[data-act=lb-page]").forEach((b, j) => b.classList.toggle("on", j === k)); return; }
    case "sheet-x": return closeSheetUser();
    case "m-prev": case "m-next": { const r = calMonth || dObj(st.date); calMonth = new Date(r.getFullYear(), r.getMonth() + (a === "m-next" ? 1 : -1), 1); $("#layer .sheet").innerHTML = editionsSheet(); return; }
    case "notify": closeSheetUser(); return enablePush();
  }
});
document.addEventListener("keydown", e => {
  if ($(".tour")) return;
  if (e.key === "Escape"){ if ($(".lightbox")) return closeLightbox(); if ($(".sheet")) return closeSheetUser(); return closeStory(); }
  if ($(".story") && !$(".lightbox")){ if (e.key === "ArrowRight") step(1); if (e.key === "ArrowLeft") step(-1); }
  else if (st.view === "cat" && !$(".sheet")){ if (e.key === "ArrowRight") swipeCat(1); if (e.key === "ArrowLeft") swipeCat(-1); }
});

/* ---------- thumb gestures ---------- */
const drag = {on:false, consumed:false};
function swipeCat(d){ store.set("gp-swiped", true); const order = secs(), i = order.indexOf(st.cat) + d; if (i >= 0 && i < order.length) go("cat", order[i], {dir:d}); else if (d < 0) go("brief"); }
document.addEventListener("touchstart", e => {
  if (e.touches.length !== 1 || $(".lightbox") || $(".sheet") || $(".tour")) { drag.on = false; return; }
  const t = e.touches[0], story = $("#story"), tgt = e.target;
  const page = story ? story.lastElementChild : $("#page");
  const sc = story ? page?.querySelector(".st-scroll") : null;
  Object.assign(drag, {on:true, inRow: !story && !!tgt.closest(".hrow, .nav"), x:t.clientX, y:t.clientY, t:Date.now(), axis:null, dx:0, dy:0, page, story:!!story, atTop: story ? (!sc || sc.scrollTop <= 0) : window.scrollY <= 0});
}, {passive:true});
document.addEventListener("touchmove", e => {
  if (!drag.on || !drag.page) return;
  const t = e.touches[0]; drag.dx = t.clientX - drag.x; drag.dy = t.clientY - drag.y;
  if (!drag.axis){
    if (Math.abs(drag.dx) < 10 && Math.abs(drag.dy) < 10) return;
    drag.axis = Math.abs(drag.dx) > Math.abs(drag.dy) * 1.2 ? "x" : "y";
    if (drag.axis === "y" && !(drag.dy > 0 && drag.atTop)) { drag.on = false; return; }
    if (drag.axis === "x" && (drag.inRow || (!drag.story && st.view !== "cat"))) { drag.on = false; return; }
    drag.page.style.transition = "none";
  }
  e.preventDefault();
  const W = window.innerWidth;
  if (drag.axis === "x"){
    let dx = drag.dx;
    if (drag.story ? !canStep(dx < 0 ? 1 : -1) : !canSwipeCat(dx < 0 ? 1 : -1)) dx *= .3;
    drag.page.style.transform = `translateX(${dx}px) rotate(${dx / W * (drag.story ? 2 : 0)}deg)`;
    if (drag.story){ const h = drag.page.querySelector(dx < 0 ? ".edge-hint.r" : ".edge-hint.l"); if (h) h.style.opacity = Math.min(1, Math.abs(dx) / (W * .25)); }
  } else {
    const dy = Math.max(0, drag.dy);
    if (drag.story){ drag.page.style.transform = `translateY(${dy * .9}px) scale(${1 - Math.min(dy, 400) / 2200})`; drag.page.style.borderRadius = Math.min(28, dy / 6) + "px"; drag.page.style.overflow = "hidden"; }
    else { const p = Math.min(dy * .5, 90); drag.page.style.transform = `translateY(${p}px)`; ptr(p); }
  }
}, {passive:false});
document.addEventListener("touchend", () => {
  if (!drag.on || !drag.axis) { drag.on = false; return; }
  drag.on = false; drag.consumed = true; setTimeout(() => drag.consumed = false, 60);
  const p = drag.page, W = window.innerWidth, v = Math.abs(drag.dx) / Math.max(1, Date.now() - drag.t);
  const reset = () => { p.style.transition = "transform .3s cubic-bezier(.22,.8,.25,1), border-radius .3s"; p.style.transform = ""; p.style.borderRadius = ""; p.querySelectorAll?.(".edge-hint").forEach(h => h.style.opacity = 0); };
  if (drag.axis === "x"){
    const d = drag.dx < 0 ? 1 : -1, ok = Math.abs(drag.dx) > W * .22 || (v > .45 && Math.abs(drag.dx) > 30);
    if (drag.story){ if (ok && canStep(d)) { p.style.transform = ""; step(d); } else reset(); }
    else { if (ok && canSwipeCat(d)) { p.style.transform = ""; swipeCat(d); } else reset(); }
  } else {
    if (drag.story){ if (drag.dy > 120) closeStory(false, "drag"); else reset(); }
    else { const pulled = drag.dy * .5 > 60; reset(); ptr(0, pulled); if (pulled) refresh(true); }
  }
}, {passive:true});
function canStep(d){ const s = st.story; if (!s) return false; if (d > 0) return true; return !(s.i === 0 && !s.inter && secs().indexOf(s.sec) === 0); }
function canSwipeCat(d){ const i = secs().indexOf(st.cat); return d > 0 ? i < secs().length - 1 : true; }
function ptr(p, spin){
  const el = $("#ptr");
  if (spin){ el.classList.add("spin"); el.style.transition = "opacity .2s"; el.style.opacity = 1; el.style.transform = "translateY(0) scale(1)"; setTimeout(() => { el.classList.remove("spin"); el.style.opacity = 0; el.style.transform = "translateY(-30px) scale(.6)"; }, 900); return; }
  el.style.transition = p ? "none" : "opacity .2s, transform .2s";
  el.style.opacity = Math.min(1, p / 60); el.style.transform = `translateY(${p - 30}px) scale(${.6 + Math.min(.4, p / 150)}) rotate(${p * 4}deg)`;
}

/* header hides while scrolling down, returns on scroll up */
let lastY = 0;
addEventListener("scroll", () => {
  if (document.body.classList.contains("locked")) return;
  const y = window.scrollY, top = $("#top");
  if (y > lastY + 6 && y > 90) top.classList.add("hide"); else if (y < lastY - 6 || y < 60) top.classList.remove("hide");
  lastY = y;
}, {passive:true});

/* ---------- intro + boot ---------- */
function intro(){
  const el = $("#intro"), today = todayIST();
  if (reduce || store.get("gp-intro") === today) return el.remove();
  store.set("gp-intro", today); el.hidden = false;
  setTimeout(() => {
    const r = $("#hdr-logo").getBoundingClientRect();
    el.style.setProperty("--ox", r.left + r.width / 2 + "px"); el.style.setProperty("--oy", r.top + r.height / 2 + "px");
    el.classList.add("out"); setTimeout(() => el.remove(), 700);
  }, 950);
}
function routeFromHash(){
  const h = location.hash.slice(1);
  let v = "brief", c = null;
  if (h === "clips") v = "clips";
  else if (h.startsWith("c-")){ const n = secs().find(n => slug(n) === h); if (n){ v = "cat"; c = n; } }
  st.view = v; st.cat = c;
  history.replaceState({v:"brief"}, "", "#brief");
  if (v !== "brief") history.pushState({v, c}, "", "#" + viewHash());
  render(0);
}
let retryTimer = null;
function showLoadError(){
  $("#page").innerHTML = `<div class="empty"><img src="/logo-lg.png" alt=""><h2>Couldn't load the brief</h2><p>We'll keep trying. If you're on an office network or VPN, try again in a moment or switch networks.</p><button class="btn" style="max-width:240px" data-act="retry">Try again</button></div>`;
  clearTimeout(retryTimer); retryTimer = setTimeout(() => retryLoad(true), 8000);
}
async function retryLoad(auto){
  clearTimeout(retryTimer);
  if (!auto) $("#page").innerHTML = `<div style="display:grid;gap:12px;margin-top:20px" aria-label="Loading"><div class="sk" style="height:34px;width:60%"></div><div class="sk" style="height:250px;margin-top:14px"></div></div>`;
  try {
    await loadIndex();
    if (!st.index.length) return;
    await loadEdition(st.index[0].date); routeFromHash();
  } catch (e){ showLoadError(); }
}
(async function boot(){
  themeIcon();
  const params = new URLSearchParams(location.search);
  st.preview = params.get("preview") === "1";
  if (st.preview){
    const d = store.get("gp-preview");
    if (!d){ $("#page").innerHTML = `<div class="empty"><h2>Nothing to preview</h2><p>Open the preview from the publish page.</p></div>`; return; }
    document.body.classList.add("preview"); $("#preview-bar").hidden = false; $("#intro").remove();
    st.ed = d; st.date = d.date; st.index = [{date:d.date, version:d.version, stories:d.stories.length}];
    return routeFromHash();
  }
  store.set("gp-visits", (store.get("gp-visits") || 0) + 1);
  intro();
  const cached = store.get("gp-cache");
  if (!cached?.ed) $("#page").innerHTML = `<div style="display:grid;gap:12px;margin-top:20px" aria-label="Loading"><div class="sk" style="height:34px;width:60%"></div><div class="sk" style="height:16px;width:40%"></div><div class="sk" style="height:250px;margin-top:14px"></div><div class="sk" style="height:180px"></div></div>`;
  if (cached?.ed){ st.index = cached.index; st.date = cached.date; st.ed = cached.ed; routeFromHash(); }
  try {
    await loadIndex();
    if (!st.index.length){ $("#page").innerHTML = `<div class="empty"><img src="/logo-lg.png" alt=""><h2>No edition yet</h2><p>The first brief appears here as soon as it's published.</p></div>`; $("#nav").innerHTML = ""; return; }
    const stale = !(cached?.date && cached.date === st.index[0].date && cached.ed?.version === st.index[0].version);
    if (stale){ await loadEdition(st.index[0].date); if (!$(".story")) cached?.ed ? render(0) : routeFromHash(); }
    else renderChrome();
  } catch (e){
    if (!st.ed) showLoadError();
  }
  maybeTour();
  initPush();
})();
})();
</script>
